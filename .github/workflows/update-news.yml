name: 每日更新今日新聞
on:
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-news.mjs
      - run: |
          git add news.json
          git diff --cached --quiet || git commit -m "chore: update daily news"
          git push
