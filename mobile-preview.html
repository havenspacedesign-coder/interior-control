<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>手機版預覽</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f3f1f7;color:#29252f}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .phone{width:414px;max-width:100%;padding:12px;border-radius:34px;background:#24212c;box-shadow:0 20px 46px rgba(31,25,48,.26)}
    .speaker{width:104px;height:24px;margin:0 auto 10px;border-radius:999px;background:#15131a}
    iframe{display:block;width:390px;max-width:100%;height:844px;border:0;border-radius:24px;background:#fff}
    @media(max-width:460px){body{padding:0;background:#fff}.phone{width:100%;padding:0;border-radius:0;box-shadow:none;background:#fff}.speaker{display:none}iframe{width:100%;height:100vh;border-radius:0}}
  </style>
</head>
<body>
  <div class="phone">
    <div class="speaker"></div>
    <iframe src="/" title="室內設計案件總控系統手機版"></iframe>
  </div>
</body>
</html>
