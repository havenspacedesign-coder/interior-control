window.pnFormulaKeyDown=function(e){
  if(pnMentionActive&&pnMentionActive.formula){
    if(e.key==='Escape'){
      var menuEl=document.getElementById('pn-global-mention');
      if(menuEl)menuEl.style.display='none';
      pnMentionActive=null;
      return;
    }
  }
  if(e.key==='Escape'&&!e.isComposing&&e.keyCode!==229){pnEditCanceled=true;e.target.blur();return;}
  if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229)e.target.blur();
}

window.pnKeyDown=function(e,type,ds,idx){

      var menuEl=document.getElementById('pn-global-mention');
      if(menuEl)menuEl.style.display='none';
      pnMentionActive=null;
      return;
    }
  }
  if(e.key==='Escape'&&!e.isComposing&&e.keyCode!==229){pnEditCanceled=true;e.target.blur();return;}
  if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.target.blur();}
}

window.pnSaveBlur=async function(type,ds,idx){

window.pnStartEdit=function(type,ds,idx){

// Excel-style "select the cell, then just start typing" — the keystroke
// replaces whatever was there, rather than appending to it.
window.pnStartEditWithChar=function(type,ds,idx,ch){
  selGen++;
  S.privateSelected={};
  S.privateSelected[type+'|'+ds]=idx;
  S.privateEditing={type:type,ds:ds,idx:idx};
  updateFormulaBar(type,ds,idx,ch);
  renderProgress();
  setTimeout(function(){
    var inp=document.getElementById('pnbox-'+type+'-'+ds+'-'+idx);

let openCheckMoArgs=null;
window.openCheckMo=function(projId,stage,label,projName){
  if(!stage)return;
  const proj=S.projects.find(p=>p.id===projId);
  const metaItems=projectBibleItemsMeta(proj,stage);
  if(!metaItems.length){alert('此階段尚無項目');return;}
  const isEstimate=!!(S.bible[stage]&&S.bible[stage].isEstimate);
  const key=`${projId}_${stage}`;const stored=S.checks[key]||[];
  const merged=metaItems.map((m,i)=>({text:m.text,isSub:m.isSub,done:stored[i]?.done||false,skip:stored[i]?.skip||false,amount:stored[i]?.amount||''}));
  const done=merged.filter(x=>x.done||x.skip).length;const pct=Math.round(done/merged.length*100);
  const totalAmount=merged.reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
  const bData=projectBibleData(proj,stage);
  const beforeLen=flattenPhaseItems(bData.before).length,duringLen=flattenPhaseItems(bData.during).length;
  const PHASES=[{label:'工程前',color:'var(--pl)',from:0,to:beforeLen},{label:'工程中',color:'var(--tl)',from:beforeLen,to:beforeLen+duringLen},{label:'工程後',color:'var(--gl)',from:beforeLen+duringLen,to:merged.length}];
  let itemsHtml='';
  PHASES.forEach(ph=>{
    if(ph.to<=ph.from)return;
    itemsHtml+=`<div style="font-size:11px;font-weight:600;color:var(--text2);margin:10px 0 4px"><span style="background:${ph.color};padding:2px 8px;border-radius:8px">${ph.label}</span></div>`;
    for(let i=ph.from;i<ph.to;i++){
      itemsHtml+=renderCheckItemRow(projId,stage,i,merged[i],isEstimate);
    }
  });
  $('mo-content').innerHTML=`
    <div class="mo-title">${label}</div>
    <div class="mo-sub">${projName} — ${done}/${merged.length} 完成${isEstimate?`　｜　粗估總金額：<strong>${totalAmount.toLocaleString()}</strong>`:''}</div>
    <div class="pb-wrap"><div class="pb-fill" style="width:${pct}%;background:${pct===100?'var(--teal)':'var(--purple)'}"></div></div>
    ${itemsHtml}
    <div class="mo-footer"><button class="btn" onclick="closeMo()">關閉</button></div>`;
  $('mo-content').style.maxWidth=isEstimate?'520px':'880px';
  $('modal').style.display='flex';
  openCheckMoArgs={projId,stage,label,projName};
}
window.closeMo=function(){$('modal').style.display='none';openCheckMoArgs=null;$('mo-content').style.maxWidth='';$('mo-content').classList.remove('project-detail-modal');}

window.setCheckStatus=async function(projId,stage,idx,status){
  const proj=S.projects.find(p=>p.id===projId);
  const allItems=projectBibleItems(proj,stage);
  const key=`${projId}_${stage}`;
  const stored=[...(S.checks[key]||allItems.map(t=>({text:t,done:false})))];
  while(stored.length<allItems.length)stored.push({done:false});
  const cur=stored[idx]||{};
  const newDone=status==='done'?!cur.done:false;
  const newSkip=status==='skip'?!cur.skip:false;
  stored[idx]={...cur,done:newDone,skip:newSkip};
  S.checks=Object.assign({},S.checks,{[key]:stored});
  // Reflect the change immediately — the open modal is a one-off innerHTML
  // snapshot, so it needs an explicit re-render; it isn't part of the
  // normal panel re-render that Firestore's onSnapshot triggers.
  if(openCheckMoArgs&&openCheckMoArgs.projId===projId&&openCheckMoArgs.stage===stage){
    openCheckMo(openCheckMoArgs.projId,openCheckMoArgs.stage,openCheckMoArgs.label,openCheckMoArgs.projName);
  }
  if(activePanel==='progress')renderProgress();
  else if(activePanel==='bible')renderBible();
  setSyncing();
  try{await setDoc(doc(db,'checks',key),{items:stored});setSynced();}catch(e){setOffline();}
}
window.setCheckAmount=async function(projId,stage,idx,value){
  const proj=S.projects.find(p=>p.id===projId);
  const allItems=projectBibleItems(proj,stage);
  const key=`${projId}_${stage}`;
  const stored=[...(S.checks[key]||allItems.map(t=>({text:t,done:false})))];
  while(stored.length<allItems.length)stored.push({done:false});
  const cur=stored[idx]||{};
  stored[idx]={...cur,amount:value};
  S.checks=Object.assign({},S.checks,{[key]:stored});
  if(openCheckMoArgs&&openCheckMoArgs.projId===projId&&openCheckMoArgs.stage===stage){
    openCheckMo(openCheckMoArgs.projId,openCheckMoArgs.stage,openCheckMoArgs.label,openCheckMoArgs.projName);
  }
  setSyncing();
  try{await setDoc(doc(db,'checks',key),{items:stored});setSynced();}catch(e){setOffline();}
}

// Recursively renders one item and all its descendants at any depth.
// path is an array of indices locating this node, e.g. [2,0,1].
function renderBibleItemNode(stage,phase,path,rawItem){
  const item=normalizeBibleItem(rawItem);
  const pathStr=path.join(',');
  const depth=path.length-1;
  const addOpen=!!expandedBibleItems[stage+'|'+phase+'|'+pathStr];
  let html=`
  <div class="bib-item-row" style="padding-left:${depth*26}px">
    ${depth===0?`<span class="bib-item-num">${path[0]+1}</span>`:'<span style="color:var(--text3);flex-shrink:0">└</span>'}
    ${isAdmin()&&dragModeOn?`<button class="bib-item-add" title="新增子項目" onclick="toggleBibleSubItems('${stage}','${phase}','${pathStr}')">＋</button>`:''}
    <span class="bib-item-text" style="flex:1" ondblclick="startEditBibleNode('${stage}','${phase}','${pathStr}',this)">${item.text}</span>
    ${isAdmin()&&dragModeOn?`<button class="bib-item-del" onclick="confirmDelBibleNode('${stage}','${phase}','${pathStr}','${escAttr(item.text).replace(/'/g,"\\'")}')">×</button>`:''}
  </div>`;
  item.subs.forEach((sub,i)=>{html+=renderBibleItemNode(stage,phase,[...path,i],sub);});
  if(isAdmin()&&dragModeOn){
    html+=addOpen?`<div class="bib-add-row" style="padding-left:${(depth+1)*26}px">
      <input type="text" id="bib-child-new-${phase}-${pathStr}" placeholder="+ 新增子項目…" autocomplete="off" onkeydown="if(event.key==='Enter')addBibleChildAtPath('${stage}','${phase}','${pathStr}')">

  }
  return html;
}

// Parses a leading Chinese numeral (一..四十五 style) off a stage name like
// "十二、繪製施工圖" so stages can be sorted by their intended order even
// if a drag-reorder or import accidentally left them out of sequence.
function chineseNumPrefix(s){
  const digits={'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const m=(s||'').match(/^[一二三四五六七八九十百千零]+/);
  if(!m)return null;
  const str=m[0];
  let total=0,section=0,num=0;
  for(const ch of str){
    if(ch==='十'){section+=(num||1)*10;num=0;}
    else if(ch==='百'){section+=(num||1)*100;num=0;}
    else{num=digits[ch];if(num===undefined)return null;section+=0;}
  }
  total=section+num;
  return total;
}
// Stages numbered 一 through 十六 belong to the design workflow (設計進度);
// everything else (十七 onward, or unnumbered custom stages) is a
// construction-phase stage that belongs in 工程進度 instead.
function isDesignStage(s){
  return getDesignBibleStages().includes(s);
}

    <div class="mo-footer"><button class="btn" onclick="closeMo()">取消</button><button class="btn btn-p" id="mo-confirm-btn" onclick="closeMo();sortStagesByNumber()">校正</button></div>`;
  $('modal').style.display='flex';

}
window.sortStagesByNumber=async function(){
  if(!isAdmin())return;
  const stages=getBibleStages();
  const withNum=stages.map(s=>({s,n:chineseNumPrefix(s)}));
  const numbered=withNum.filter(x=>x.n!==null).sort((a,b)=>a.n-b.n).map(x=>x.s);
  const unnumbered=withNum.filter(x=>x.n===null).map(x=>x.s);
  const order=[...numbered,...unnumbered];
  S.bibleOrder=order;
  renderBible();
  setSyncing();
  try{await setDoc(doc(db,'bible','orderConfig'),{order});setSynced();}

window.saveBibleStageTitle=async function(oldName,newName){
  newName=(newName||'').trim();
  if(!newName||newName===oldName)return renderBible();
  if(getBibleStages().includes(newName)){alert('此階段名稱已存在');renderBible();return;}
  const data=S.bible[oldName]||{before:[],during:[],after:[]};
  const order=getBibleStages().map(s=>s===oldName?newName:s);
  S.bible=Object.assign({},S.bible);
  delete S.bible[oldName];
  S.bible[newName]=data;
  S.bibleOrder=order;
  activeBibleStage=newName;
  renderBible();
  setSyncing();
  try{
    await setDoc(doc(db,'bible',newName),data);
    await deleteDoc(doc(db,'bible',oldName));
    await setDoc(doc(db,'bible','orderConfig'),{order});
    // Migrate anything keyed off the old stage name so nothing silently
    // detaches: per-project checklist progress, calendar chips, and the
    // frozen snapshot on completed projects.
    const snap=await getDocs(collection(db,'checks'));
    const batch=writeBatch(db);
    snap.docs.filter(d=>d.id.endsWith('_'+oldName)).forEach(d=>{
      const projId=d.id.slice(0,d.id.length-('_'+oldName).length);
      batch.set(doc(db,'checks',projId+'_'+newName),d.data());
      batch.delete(doc(db,'checks',d.id));
    });
    await batch.commit();
    for(const p of S.projects){
      const sched=p.schedule||[];
      const patch={};
      if(sched.some(e=>e.stage===oldName)){
        patch.schedule=sched.map(e=>e.stage===oldName?{...e,stage:newName,label:e.label===oldName?newName:e.label}:e);
      }
      if(p.bibleSnapshot&&p.bibleSnapshot[oldName]){
        const snap2=Object.assign({},p.bibleSnapshot);
        snap2[newName]=snap2[oldName];
        delete snap2[oldName];
        patch.bibleSnapshot=snap2;
      }
      if(Object.keys(patch).length)await updateDoc(doc(db,'projects',p.id),patch);
    }
    setSynced();
  }catch(err){alert('改名失敗：'+err.message);setSynced();}
}

  return`<div class="vendor-toolbar">${isAdmin()?'<button class="btn btn-p" onclick="showOtherVendorForm()">＋新增其他廠商</button><button class="btn" onclick="showCategoryForm(\'other\')">＋新增類別</button>':''}<select onchange="setOtherVendorFilter(this.value)"><option value="all">全部類別</option>${S.otherVendorCategories.map(c=>`<option value="${c.id}" ${otherVendorFilter===c.id?'selected':''}>${escAttr(c.name)}</option>`).join('')}</select><input type="text" placeholder="搜尋公司名稱" value="${escAttr(otherVendorSearch)}" oninput="setOtherVendorSearch(this.value)"></div><div class="card"><div class="card-hdr"><span class="card-title">其他廠商（${filtered.length}）</span><button class="btn btn-sm" onclick="showOtherCategoryManager()">管理類別</button></div>${filtered.length?filtered.map(renderOtherVendorRow).join(''):'<div class="empty">沒有符合條件的廠商</div>'}</div>`;
}
function renderOtherVendorRow(v){const cats=(v.categoryIds||[]).map(id=>S.otherVendorCategories.find(c=>c.id===id)).filter(Boolean);return`<div class="vendor-row"><div class="vendor-main"><div class="vendor-name">${escAttr(v.companyName||'未命名')}</div><div class="vendor-tags">${cats.length?cats.map(c=>`<span class="vendor-tag">${escAttr(c.name)}</span>`).join(''):'<span class="vendor-tag" style="background:var(--bg);color:var(--text3)">未分類</span>'}</div>${v.note?`<div class="vendor-meta">${escAttr(v.note)}</div>`:''}</div>${isAdmin()?`<div class="vendor-actions"><button class="btn btn-sm" onclick="showOtherVendorForm('${v.id}')">編輯</button><button class="btn btn-sm btn-danger" onclick="deleteOtherVendor('${v.id}')">刪除</button></div>`:''}</div>`;}
window.setOtherVendorFilter=function(v){otherVendorFilter=v;renderVendors();};window.setOtherVendorSearch=function(v){otherVendorSearch=v;renderVendors();const inp=$('panel-vendors')?.querySelector('input[placeholder="搜尋公司名稱"]');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);}};
window.showOtherVendorForm=function(id){if(!isAdmin())return;const v=id?S.otherVendors.find(x=>x.id===id):null;$('mo-content').innerHTML=`<div class="mo-title">${v?'編輯其他廠商':'新增其他廠商'}</div><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px"><div style="font-size:12px;color:var(--text2)">類別（可複選）</div><div class="vendor-checks">${S.otherVendorCategories.length?S.otherVendorCategories.map(c=>`<label class="vendor-check"><input type="checkbox" name="ov-category" value="${c.id}" ${(v?.categoryIds||[]).includes(c.id)?'checked':''}> ${escAttr(c.name)}</label>`).join(''):'尚無類別，請先新增類別'}</div><input id="ov-company" type="text" placeholder="公司名稱*" value="${escAttr(v?.companyName||'')}"><textarea id="ov-note" rows="4" placeholder="備註">${escAttr(v?.note||'')}</textarea></div><div class="mo-footer"><button class="btn" onclick="closeMo()">取消</button><button class="btn btn-p" onclick="saveOtherVendor(${v?`'${v.id}'`:'null'})">儲存</button></div>`;$('modal').style.display='flex';}
window.saveOtherVendor=async function(id){const companyName=$('ov-company').value.trim();if(!companyName)return alert('請填寫公司名稱');const categoryIds=[...document.querySelectorAll('input[name="ov-category"]:checked')].map(x=>x.value);const data={companyName,categoryIds,note:$('ov-note').value.trim(),updatedAt:new Date().toISOString()};if(id)await updateDoc(doc(db,'otherVendors',id),data);else await addDoc(collection(db,'otherVendors'),{...data,createdAt:new Date().toISOString()});closeMo();renderVendors();}
window.deleteOtherVendor=async function(id){const v=S.otherVendors.find(x=>x.id===id);if(!v||!confirm(`確定刪除「${v.companyName}」？`))return;await deleteDoc(doc(db,'otherVendors',id));renderVendors();}
window.showCategoryForm=function(type){if(!isAdmin())return;$('mo-content').innerHTML=`<div class="mo-title">新增${type==='trade'?'工程項目':'其他廠商類別'}</div><div style="margin-top:12px"><input id="vc-name" type="text" placeholder="類別名稱*" onkeydown="if(event.key==='Enter')saveVendorCategory('${type}')"></div><div class="mo-footer"><button class="btn" onclick="closeMo()">取消</button><button class="btn btn-p" onclick="saveVendorCategory('${type}')">新增</button></div>`;$('modal').style.display='flex';setTimeout(()=>$('vc-name')?.focus(),50);}
window.saveVendorCategory=async function(type){const name=$('vc-name').value.trim(),list=type==='trade'?S.tradeCategories:S.otherVendorCategories,collectionName=type==='trade'?'tradeCategories':'otherVendorCategories';if(!name)return alert('請輸入名稱');if(list.some(x=>x.name===name))return alert('已有相同名稱');const data={name,createdAt:new Date().toISOString()};if(type==='trade')data.sortOrder=sortTradeCategories(list).length;await addDoc(collection(db,collectionName),data);closeMo();renderVendors();}
window.renameVendorCategory=async function(type,id){const list=type==='trade'?S.tradeCategories:S.otherVendorCategories,c=list.find(x=>x.id===id);if(!c)return;const name=prompt('修改類別名稱',c.name)?.trim();if(!name||name===c.name)return;if(list.some(x=>x.id!==id&&x.name===name))return alert('已有相同名稱');await updateDoc(doc(db,type==='trade'?'tradeCategories':'otherVendorCategories',id),{name});renderVendors();}
window.deleteVendorCategory=async function(type,id){const isTrade=type==='trade',list=isTrade?S.tradeCategories:S.otherVendorCategories,c=list.find(x=>x.id===id);if(!c)return;const used=isTrade?S.tradeVendors.filter(v=>v.categoryId===id):S.otherVendors.filter(v=>(v.categoryIds||[]).includes(id));if(used.length)return alert(`「${c.name}」仍有 ${used.length} 家廠商使用，請先移除或改分類後再刪除。`);if(!confirm(`確定刪除類別「${c.name}」？`))return;await deleteDoc(doc(db,isTrade?'tradeCategories':'otherVendorCategories',id));if(!isTrade&&otherVendorFilter===id)otherVendorFilter='all';renderVendors();}
window.showOtherCategoryManager=function(){$('mo-content').innerHTML=`<div class="mo-title">其他廠商類別管理</div><div style="margin-top:12px">${S.otherVendorCategories.map(c=>`<div class="vendor-row" style="padding:8px 0"><div class="vendor-main">${escAttr(c.name)}</div>${isAdmin()?`<button class="btn btn-sm" onclick="closeMo();renameVendorCategory('other','${c.id}')">修改</button><button class="btn btn-sm btn-danger" onclick="closeMo();deleteVendorCategory('other','${c.id}')">刪除</button>`:''}</div>`).join('')||'<div class="empty">尚無類別</div>'}</div><div class="mo-footer">${isAdmin()?'<button class="btn btn-p" onclick="closeMo();showCategoryForm(\'other\')">＋新增類別</button>':''}<button class="btn" onclick="closeMo()">關閉</button></div>`;$('modal').style.display='flex';}
window.openVendorUrl=function(url){const safe=vendorSafeUrl(url);if(safe)window.open(safe,'_blank','noopener');};window.copyVendorUrl=async function(url){try{await navigator.clipboard.writeText(url);alert('網址已複製');}catch(e){prompt('請複製網址',url);}};
window.showVendorQr=function(url,title){const safe=vendorSafeUrl(url);if(!safe)return;const qr='https://quickchart.io/qr?size=300&text='+encodeURIComponent(safe);$('mo-content').innerHTML=`<div class="mo-title">${escAttr(title)}</div><div class="qr-box"><img src="${qr}" alt="LINE 群組 QR Code"><div class="vendor-meta" style="margin-top:8px">掃描後開啟 LINE 群組邀請網址</div></div><div class="mo-footer"><button class="btn" onclick="copyVendorUrl('${escAttr(safe)}')">複製網址</button><button class="btn" onclick="closeMo()">關閉</button></div>`;$('modal').style.display='flex';}


// ── Members ──
let expandedMemberInfo={};
let editingMemberInfo={};
function renderMembers(){
  if(!isAdmin())return;
  const el=$('panel-members');
  const pending=S.members.filter(m=>m.role==='pending');
  const roleOrder={manager:0,admin:1,staff:2};
  const active=S.members.filter(m=>m.role!=='pending'&&m.status!=='resigned')
    .sort((a,b)=>(roleOrder[a.role]??3)-(roleOrder[b.role]??3));
  const resigned=S.members.filter(m=>m.role!=='pending'&&m.status==='resigned');
  function memberCard(m,isResigned){
    const ei=m.employeeInfo||{};
    const open=!!expandedMemberInfo[m.id];
    const isEdit=!!editingMemberInfo[m.id];
    const roleLabel=m.role==='manager'?'管理員':(m.role==='admin'?'主管':'員工');
    const roleBadgeClass=m.role==='manager'?'role-manager':(m.role==='admin'?'role-admin':'role-staff');
    return`<div class="member-card" style="flex-direction:column;align-items:stretch">
    <div style="display:flex;align-items:center;gap:10px">
      <img class="member-avatar" src="${m.photoURL||''}" onerror="this.style.display='none'">
      <div class="member-info" style="flex:1">
        <div class="member-name">${memberDisplayName(m)}${isResigned?' <span style="font-size:11px;color:var(--text3)">（離職）</span>':''}</div>
        <div class="member-email">${m.email}</div>
      </div>
      ${!isResigned?`<span class="role-badge ${roleBadgeClass}">${roleLabel}</span>`:''}
      ${!isResigned?`<select class="btn btn-sm" onchange="changeRole('${m.id}',this.value)">
        ${m.uid===currentUser?.uid?`<option value="manager" ${m.role==='manager'?'selected':''}>管理員</option>`:''}
        <option value="admin" ${m.role==='admin'?'selected':''}>主管</option>
        <option value="staff" ${m.role==='staff'?'selected':''}>員工</option>
      </select>`:''}
      ${m.uid===currentUser?.uid?'<span style="font-size:11px;color:var(--text3)">（自己）</span>':''}
      <button class="btn btn-sm" onclick="toggleMemberInfo('${m.id}')">${open?'收起資料':'員工資料'}</button>
      ${m.uid!==currentUser?.uid?(isResigned?`<button class="btn btn-sm btn-p" onclick="setMemberStatus('${m.id}','active')">恢復在職</button>`:`<button class="btn btn-sm btn-danger" onclick="setMemberStatus('${m.id}','resigned')">設為離職</button>`):''}
    </div>
    ${open?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px">
      <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
        <button class="btn btn-sm ${isEdit?'btn-p':''}" onclick="toggleMemberEdit('${m.id}')">${isEdit?'完成':'✎ 編輯'}</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;align-items:end">
      <div style="grid-column:1/-1;font-weight:600;color:var(--text2)">顯示設定</div>
      ${mfField(m.id,'displayName','顯示名稱',m.displayName||'',isEdit)}
      ${mfField(m.id,'tagInitial','標記縮寫（例如：偉）',m.tagInitial||'',isEdit)}
      <div style="grid-column:1/-1;font-weight:600;color:var(--text2)">基本資料</div>
      ${eiField(m.id,'realName','姓名',ei.realName,isEdit)}
      ${eiField(m.id,'idNumber','身份證字號',ei.idNumber,isEdit)}
      ${eiField(m.id,'birthDate','出生日期',ei.birthDate,isEdit)}
      ${eiField(m.id,'gender','性別',ei.gender,isEdit)}
      ${eiField(m.id,'bloodType','血型',ei.bloodType,isEdit)}
      ${eiField(m.id,'marital','婚姻狀況',ei.marital,isEdit)}
      <div style="grid-column:1/-1;font-weight:600;color:var(--text2)">聯絡資訊</div>
      ${eiField(m.id,'homeAddr','戶籍地址',ei.homeAddr,isEdit)}
      ${eiField(m.id,'mailAddr','聯絡地址',ei.mailAddr,isEdit)}
      ${eiField(m.id,'phone','手機',ei.phone,isEdit)}
      ${eiField(m.id,'emergName','緊急聯絡人姓名',ei.emergName,isEdit)}
      ${eiField(m.id,'emergRel','緊急聯絡人關係',ei.emergRel,isEdit)}
      ${eiField(m.id,'emergPhone','緊急聯絡人電話',ei.emergPhone,isEdit)}
      <div style="grid-column:1/-1;font-weight:600;color:var(--text2)">任職資訊</div>
      ${eiField(m.id,'title','職稱',ei.title,isEdit)}
      ${eiField(m.id,'department','所屬部門',ei.department,isEdit)}
      ${eiField(m.id,'hireDate','到職日',ei.hireDate,isEdit)}
      ${eiField(m.id,'resignDate','離職日',ei.resignDate,isEdit)}
      ${eiField(m.id,'insuranceDate','勞健保加保日',ei.insuranceDate,isEdit)}
      </div>
    </div>`:''}
    </div>`;
  }
  function fieldWrap(label,inner){
    return`<div><div style="color:var(--text3);font-size:11px;margin-bottom:2px">${label}</div>${inner}</div>`;
  }
  function mfField(uid,field,label,val,isEdit){
    const inner=isEdit
      ?`<input type="text" value="${escAttr(val)}" onblur="saveMemberField('${uid}','${field}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" style="width:100%;box-sizing:border-box;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit">`
      :`<div style="padding:4px 2px;font-size:12px;min-height:20px">${escAttr(val)||'—'}</div>`;
    return fieldWrap(label,inner);
  }
  const DATE_FIELDS=['birthDate','hireDate','resignDate','insuranceDate'];
  function eiField(uid,field,label,val,isEdit){
    const isDate=DATE_FIELDS.includes(field);
    const inner=isEdit
      ?`<input type="${isDate?'date':'text'}" value="${escAttr(val||'')}" onblur="saveEmployeeInfo('${uid}','${field}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" style="width:100%;box-sizing:border-box;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit">`
      :`<div style="padding:4px 2px;font-size:12px;min-height:20px">${escAttr(val||'')||'—'}</div>`;
    return fieldWrap(label,inner);
  }
  el.innerHTML=`
  <div style="font-size:15px;font-weight:600;margin-bottom:1rem">成員管理</div>
  ${pending.length?`<div style="font-size:13px;font-weight:500;margin-bottom:8px;color:var(--amber)">待審核（${pending.length}）</div>
  ${pending.map(m=>`<div class="member-card">
    <img class="member-avatar" src="${m.photoURL||''}" onerror="this.style.display='none'">
    <div class="member-info"><div class="member-name">${memberDisplayName(m)}</div><div class="member-email">${m.email}</div></div>
    <span class="role-badge role-pending">待審核</span>
    <button class="btn btn-sm btn-p" onclick="approveMember('${m.id}','staff')">核准（員工）</button>
    <button class="btn btn-sm btn-p" style="background:var(--pd)" onclick="approveMember('${m.id}','admin')">核准（主管）</button>
    <button class="btn btn-sm btn-danger" onclick="rejectMember('${m.id}')">拒絕</button>
  </div>`).join('')}`:''}
  <div style="font-size:13px;font-weight:500;margin-bottom:8px;margin-top:${pending.length?'16px':'0'}">所有成員（${active.length}）</div>
  ${active.map(m=>memberCard(m,false)).join('')}
  ${resigned.length?`<div style="font-size:13px;font-weight:500;margin-bottom:8px;margin-top:16px;color:var(--text3)">離職員工（${resigned.length}）</div>
  ${resigned.map(m=>memberCard(m,true)).join('')}`:''}`;
}
window.toggleMemberInfo=function(uid){expandedMemberInfo[uid]=!expandedMemberInfo[uid];renderMembers();}
window.toggleMemberEdit=function(uid){editingMemberInfo[uid]=!editingMemberInfo[uid];renderMembers();}
window.saveMemberField=async function(uid,field,val){
  if(!isAdmin())return;
  await updateDoc(doc(db,'members',uid),{[field]:val});
}
window.saveEmployeeInfo=async function(uid,field,val){
  if(!isAdmin())return;
  const m=S.members.find(x=>x.id===uid);
  const ei={...(m?.employeeInfo||{}),[field]:val};
  await updateDoc(doc(db,'members',uid),{employeeInfo:ei});
}
window.setMemberStatus=async function(uid,status){
  if(!isAdmin())return;
  const m=S.members.find(x=>x.id===uid);
  if(status==='resigned'&&!confirm('確定要將這位成員設為離職嗎？設定後他將無法再登入系統，但所有資料會保留。'))return;
  const patch={status};
  if(status==='resigned'){
    patch.resignedAt=serverTimestamp();
    const ei={...(m?.employeeInfo||{})};
    if(!ei.resignDate)ei.resignDate=fmtDay(today());
    patch.employeeInfo=ei;
  }
  await updateDoc(doc(db,'members',uid),patch);
}
window.approveMember=async function(uid,role){await updateDoc(doc(db,'members',uid),{role,status:'active'});}
window.rejectMember=async function(uid){if(!confirm('確定拒絕？'))return;await deleteDoc(doc(db,'members',uid));}
window.changeRole=async function(uid,role){await updateDoc(doc(db,'members',uid),{role});}

// ── Project CRUD ──
function ymdInputs(prefix,label){
  return`<div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:2px">${label}</div>
    <div style="display:flex;align-items:center;gap:3px">
      <input id="${prefix}-y" type="number" placeholder="年" style="width:70px">年
      <input id="${prefix}-m" type="number" placeholder="月" min="1" max="12" style="width:50px">月
      <input id="${prefix}-d" type="number" placeholder="日" min="1" max="31" style="width:50px">日
    </div>
  </div>`;
}
function ymdValue(prefix){
  const y=$(`${prefix}-y`).value.trim(),m=$(`${prefix}-m`).value.trim(),d=$(`${prefix}-d`).value.trim();
  if(!y||!m||!d)return'';
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function ymdSetFields(prefix,val){
  if(!val)return;
  const parts=val.split('-');
  if(parts.length!==3)return;
  if($(`${prefix}-y`))$(`${prefix}-y`).value=parts[0];
  if($(`${prefix}-m`))$(`${prefix}-m`).value=parseInt(parts[1],10);
  if($(`${prefix}-d`))$(`${prefix}-d`).value=parseInt(parts[2],10);
}
window.autoGrow=function(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
window.updateNPAmount=function(){
  const area=parseFloat($('np-area').value)||0;
  const price=parseFloat($('np-price').value)||0;
  $('np-design-amount').textContent=(area*price).toLocaleString();
}
window.showAddProject=function(){
  if(!isAdmin())return;
  showProjectForm(null);
}
window.showEditProject=function(projId){
  if(!isAdmin())return;
  showProjectForm(projId);
}
function showProjectForm(projId){
  const p=projId?S.projects.find(x=>x.id===projId):null;
  $('mo-content').classList.remove('project-detail-modal');
  $('mo-content').innerHTML=`<div class="mo-title">${p?'編輯案件':'新增案件'}</div>
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:65vh;overflow-y:auto">
      <input id="np-name" type="text" placeholder="案件名稱*" value="${escAttr(p?.name||'')}">
      <input id="np-owner" type="text" placeholder="業主姓名" value="${escAttr(p?.owner||'')}">
      <input id="np-phone" type="text" placeholder="電話" value="${escAttr(p?.phone||'')}">
      <input id="np-address" type="text" placeholder="案件地址" value="${escAttr(p?.address||'')}">
      <input id="np-type" type="text" placeholder="類型（住宅／商業…）" value="${escAttr(p?.type||'')}">
      <input id="np-designer" type="text" placeholder="設計師" value="${escAttr(p?.designer||'')}">
      <div style="display:flex;align-items:center;gap:6px">
        <input id="np-budget" type="text" placeholder="預算" value="${escAttr(p?.budget||'')}" style="flex:1">
        <span style="font-size:13px;color:var(--text2)">萬</span>
      </div>
      <div style="display:flex;gap:16px;font-size:12px;color:var(--text2);margin-top:-6px">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="np-budget-furniture" ${p?.budgetIncludeFurniture?'checked':''}> 含家具</label>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="np-budget-ac" ${p?.budgetIncludeAC?'checked':''}> 含空調</label>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <input id="np-area" type="number" placeholder="設計簽約坪數" oninput="updateNPAmount()" value="${escAttr(p?.area||'')}" style="flex:1">
        <span>×</span>
        <input id="np-price" type="number" placeholder="單坪價格" oninput="updateNPAmount()" value="${escAttr(p?.pricePerPing||'')}" style="flex:1">
      </div>
      <div style="font-size:12px;color:var(--text2)">設計合約金額（自動計算）：<span id="np-design-amount" style="font-weight:600;color:var(--text)">${p?((parseFloat(p.area)||0)*(parseFloat(p.pricePerPing)||0)).toLocaleString():'0'}</span></div>
      <input id="np-contract-amount" type="text" placeholder="工程合約金額" value="${escAttr(p?.contractAmount||'')}">
      ${ymdInputs('np-cs','合約起始日')}
      ${ymdInputs('np-ce','完工日')}
      <textarea id="np-process" placeholder="廠商施工流程…" rows="10" oninput="autoGrow(this)" style="font-family:inherit;padding:8px;border:1px solid var(--border);border-radius:var(--r);overflow-y:auto;resize:none;min-height:190px;max-height:340px">${escAttr(p?.process||'')}</textarea>
      <div style="font-size:11px;color:var(--text3);border:1px dashed var(--border);border-radius:var(--r);padding:8px;text-align:center">📷 照片上傳（尚未開通，之後啟用 Firebase Storage 後可用）</div>
      <select id="np-status">
        ${STATUS_OPTS.map(o=>`<option value="${o.v}" ${p?.status===o.v?'selected':''}>${o.l}</option>`).join('')}
      </select>
    </div>
    <div class="mo-footer"><button class="btn" onclick="closeMo()">取消</button><button class="btn btn-p" onclick="saveProjectForm(${p?`'${p.id}'`:'null'})">${p?'儲存':'新增'}</button></div>`;
  $('modal').style.display='flex';
  ymdSetFields('np-cs',p?.contractStart);
  ymdSetFields('np-ce',p?.contractEnd||(!p?.contractStart?p?.finish:''));
  requestAnimationFrame(function(){const ta=$('np-process');if(ta)autoGrow(ta);});

function projectTradeSummary(projectId){
  const saved=S.projectTradeSelections[projectId]||{};
  const lines=[];
  S.tradeCategories.forEach(function(category){
    const sel=saved[category.id];if(!sel)return;
    if(sel.none){lines.push('<strong>'+escAttr(category.name)+'</strong>：無');return;}
    const vendors=(sel.vendorIds||[]).map(function(id){
      const vendor=S.tradeVendors.find(v=>v.id===id);if(!vendor)return'';
      const note=(sel.notes||{})[id];
      return escAttr(vendor.companyName||'未命名')+(vendor.contactName?'｜'+escAttr(vendor.contactName):'')+(note?'（'+escAttr(note)+'）':'');
    }).filter(Boolean);
    if(vendors.length)lines.push('<strong>'+escAttr(category.name)+'</strong>：'+vendors.join('、'));
  });
  return lines.join('<br>');
}

// Formula bar functions
var formulaBarState=null; // {type,ds,idx,text,rowId} — selected meeting/work/personal item
// Inline HTML "oninput" attributes run in a scope that can't see this
// module's top-level variables directly, so they must go through a
// window-exposed function like this instead of touching formulaBarState.
window.pnSyncFormulaText=function(text){
  if(formulaBarState)formulaBarState.text=text;
}
var selGen=0;
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function normalizeLinkedItem(item){
  const source=String(item?.text||'');
  if(item?.link?.url)return{text:source,link:{label:item.link.label||source,url:item.link.url}};
  const legacy=source.match(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/);
  if(!legacy)return{text:source,link:null};
  return{text:source.slice(0,legacy.index)+legacy[1]+source.slice(legacy.index+legacy[0].length),link:{label:legacy[1],url:legacy[2]}};
}
function smartLinkHtml(label,url){
  let host='連結';try{host=new URL(url).hostname.replace(/^www\./,'');}catch(e){}
  const kind=/google\.[^/]+\/maps|maps\.app\.goo\.gl/i.test(url)?'Google 地圖':host;
  return'<span class="smart-link-wrap"><a class="inline-link" href="'+escAttr(url)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">'+escAttr(label)+'</a><a class="smart-link-card" href="'+escAttr(url)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"><div class="smart-link-title">📍 '+escAttr(kind)+' · '+escAttr(label)+'</div><div class="smart-link-url">'+escAttr(url)+'</div><span class="smart-link-open">開啟連結</span></a></span>';
}
function renderPlainTextWithProjects(text){
  return String(text||'').split(/(\[proj:[^\]]+\])/g).map(function(part){
    const m=part.match(/^\[proj:([^\]]+)\]$/);
    return m?'<span style="color:var(--purple);font-weight:600;background:var(--pl);padding:0 4px;border-radius:3px;font-size:10px">'+escAttr(m[1])+'</span>':escAttr(part);
  }).join('');
}
function renderItemText(item){
  const linked=normalizeLinkedItem(item),text=linked.text,link=linked.link;
  if(!link)return renderPlainTextWithProjects(text);
  const pos=text.indexOf(link.label);if(pos<0)return renderPlainTextWithProjects(text);
  return renderPlainTextWithProjects(text.slice(0,pos))+smartLinkHtml(link.label,link.url)+renderPlainTextWithProjects(text.slice(pos+link.label.length));
}
function linkFromInput(input,text){
  const url=(input.dataset.linkUrl||'').trim(),label=input.dataset.linkLabel||'';
  if(!url||!label||!String(text).includes(label))return null;
  return{url,label};
}
window.insertUrlForSelection=function(event,input){
  const start=input.selectionStart,end=input.selectionEnd;
  if(start==null||end==null||start===end)return true;
  event.preventDefault();event.stopPropagation();
  const selected=input.value.slice(start,end);
  const url=prompt('貼上網址（Google 地圖或其他 http / https 網址）','https://');
  if(url===null)return false;
  let parsed;
  try{parsed=new URL(url.trim());}catch(err){alert('網址格式不正確');return false;}
  if(parsed.protocol!=='http:'&&parsed.protocol!=='https:'){alert('只支援 http 或 https 網址');return false;}
  input.dataset.linkUrl=parsed.href;input.dataset.linkLabel=selected;
  if(formulaBarState)formulaBarState.link={url:parsed.href,label:selected};
  input.setSelectionRange(start,end);
  input.dispatchEvent(new Event('input',{bubbles:true}));
  input.focus();
  return false;
}
// Core save: always reads the live value straight off the given input element,
// identified by explicit type/ds/idx (baked into that box at render time) —
// never relies on a shared "current selection" variable that could be stale.
window.pnSaveBox=async function(el,type,ds,idx){
  if(!currentUser||!el)return;
  if(pnEditCanceled){
    pnEditCanceled=false;
    S.privateEditing=null;
    var pn0=S.privateNotes||{work:{},personal:{}};
    var items0=(pn0[type]&&pn0[type][ds])||[];
    var origText=items0[idx]?items0[idx].text||'':'';
    updateFormulaBar(type,ds,idx,origText);
    renderProgress();
    return;
  }
  var text=el.value;var link=linkFromInput(el,text);
  var pn=S.privateNotes||{work:{},personal:{}};
  var items=(pn[type]&&pn[type][ds])?[...pn[type][ds]]:[];
  while(items.length<=idx)items.push({text:'',color:''});
  items[idx]=Object.assign({},items[idx],{text:text,link:link});
  S.privateNotes=Object.assign({},pn);
  S.privateNotes[type]=Object.assign({},pn[type]||{});
  S.privateNotes[type][ds]=items;
  S.privateEditing=null;
  setSyncing();
  await setDoc(doc(db,'privateNotes',currentUser.uid),S.privateNotes);
  setSynced();
  var gen=selGen;
  setTimeout(function(){
    if(selGen===gen){
      S.privateSelected={};
      if(activePanel==='progress')renderProgress();
    }
  },150);
}
// Box (in-place chip) blur — identity is baked into the call at render time.
window.pnBoxBlur=function(el,type,ds,idx){
  pnSaveBox(el,type,ds,idx);
}
function updateFormulaBar(type,ds,idx,text,rowId,link){
  const same=formulaBarState&&formulaBarState.type===type&&formulaBarState.ds===ds&&formulaBarState.idx===idx;
  const keptLink=link===undefined&&same?formulaBarState.link:link;
  formulaBarState=(type===null)?null:{type:type,ds:ds,idx:idx,text:text||'',rowId:rowId||'',link:keptLink||null};
  var bar=document.getElementById('pn-formula-bar');
  var inp=document.getElementById('pn-formula-input');
  var lbl=document.getElementById('pn-formula-label');
  if(!bar||!inp)return;
  if(!formulaBarState){
    bar.classList.remove('active');
    inp.value='';
    return;
  }
  bar.classList.add('active');
  const meetingName=type==='meeting'?(MEETING_ROWS.find(r=>r.id===rowId)?.name||'會議 / 其他事項'):'';
  lbl.textContent=(type==='meeting'?meetingName:(type==='work'?'工地記事':'私人記事'))+' · '+ds.slice(5).replace('-','/');
  inp.value=text||'';
  inp.dataset.linkUrl=formulaBarState.link?.url||'';
  inp.dataset.linkLabel=formulaBarState.link?.label||'';
}
// Top bar blur — identity comes from formulaBarState (the top bar always
// mirrors whichever item was last selected), but the TEXT is read live
// from the input itself.
window.formulaBarSave=async function(){
  if(!formulaBarState)return;
  var inp=document.getElementById('pn-formula-input');
  if(formulaBarState.type==='meeting')await mSaveBox(inp,formulaBarState.rowId,formulaBarState.ds,formulaBarState.idx);
  else await pnSaveBox(inp,formulaBarState.type,formulaBarState.ds,formulaBarState.idx);
}

window.saveDateColor=async function(ds,color,note){

  if(!color&&!note){delete colors[ds];}
  else{colors[ds]={color:color||'',note:note||''};}
  S.dateColors=colors;
  setSyncing();
  await setDoc(doc(db,'settings','dateColors'),{colors});
  closeMo();setSynced();
}
