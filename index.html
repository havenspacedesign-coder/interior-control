<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>室內設計案件總控系統</title>
<meta name="theme-color" content="#534AB7">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=2">
<link rel="shortcut icon" type="image/png" href="./favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f5;--surface:#fff;--border:#e8e5e0;
  --text:#1a1a1a;--text2:#6b6560;--text3:#9c9690;
  --purple:#534AB7;--pl:#EEEDFE;--pd:#3C3489;
  --teal:#1D9E75;--tl:#E1F5EE;--td:#085041;
  --amber:#BA7517;--al:#FAEEDA;--ad:#633806;
  --red:#E24B4A;--rl:#FCEBEB;--rd:#791F1F;
  --green:#639922;--gl:#EAF3DE;--gd:#27500A;
  --company-1:#D6D1CA;--company-2:#968B83;--company-3:#C0B7B0;--company-4:#9A9794;--company-5:#C8C9C9;
  --r:8px;--rl2:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* Auth screens */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:40px;width:360px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-logo{font-size:22px;font-weight:700;margin-bottom:6px}.login-logo span{color:var(--purple)}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 20px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:14px;font-family:inherit;font-weight:500}
.google-btn:hover{background:var(--bg)}
.test-btn{display:none;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:11px 20px;border:1px solid var(--purple);border-radius:var(--r);background:var(--pl);color:var(--pd);cursor:pointer;font-size:14px;font-family:inherit;font-weight:600}
.test-btn:hover{background:#dedcf9}
.test-hint{display:none;margin-top:9px;font-size:11px;line-height:1.5;color:var(--text3)}
#pending-screen{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:1000}
.pending-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:40px;width:380px;text-align:center}
#app-screen{display:none}

/* App layout */
.app{display:flex;flex-direction:column;min-height:100vh}
.topnav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;gap:1rem;height:50px;position:sticky;top:0;z-index:50}
.logo{font-size:15px;font-weight:600;white-space:nowrap}.logo span{color:var(--purple)}
.nav-tabs{display:flex;gap:1px;overflow-x:auto;flex:1}
.nav-tab{padding:5px 12px;font-size:13px;border:none;background:none;cursor:pointer;border-radius:var(--r);color:var(--text2);white-space:nowrap;font-family:inherit}
.nav-tab:hover{background:var(--bg);color:var(--text)}
.nav-tab.active{background:var(--pl);color:var(--pd);font-weight:500}
.nav-tab.b1f-nav{margin-left:auto;background:#fff1f1;color:#a34141;border:1px solid #f2caca}
.b1f-shell{max-width:1180px;margin:0 auto}.b1f-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.b1f-head h1{font-size:21px;color:#7d3030}.b1f-head p{font-size:12px;color:var(--text2);margin-top:4px}.b1f-tabs{display:flex;gap:5px;padding:4px;background:#fff2f2;border-radius:9px;flex-wrap:wrap}.b1f-tabs button{border:0;border-radius:6px;background:transparent;color:#9e5757;font:inherit;font-size:12px;padding:6px 10px;cursor:pointer}.b1f-tabs button.active{background:#fff;color:#8d3030;box-shadow:0 1px 4px rgba(142,48,48,.12);font-weight:600}.b1f-list{border:1px solid #efd6d6;border-radius:10px;overflow:hidden;background:#fff}.b1f-list-head,.b1f-row{display:grid;grid-template-columns:minmax(160px,1.3fr) 110px 100px minmax(130px,1fr) minmax(125px,1fr) auto;gap:12px;align-items:center}.b1f-list-head{padding:9px 12px;background:#fff8f8;border-bottom:1px solid #efdede;color:#9a5959;font-size:11px;font-weight:600}.b1f-row{min-height:50px;padding:8px 12px;border-bottom:1px solid #f2e6e6}.b1f-item-name{font-size:14px;font-weight:650}.b1f-item-qty{font-size:14px;font-weight:700;color:#842f2f}.b1f-empty{padding:28px;text-align:center;color:var(--text3)}
.b1f-inventory-grid{grid-template-columns:minmax(180px,1.35fr) 100px 100px minmax(135px,1fr) 115px minmax(150px,1fr) 130px!important}.b1f-history-grid{grid-template-columns:100px 105px minmax(160px,1.2fr) 95px minmax(160px,1fr) 110px!important}.b1f-list-head>*,.b1f-row>*{min-width:0}.b1f-col-center{text-align:center}.b1f-col-money{text-align:right;font-variant-numeric:tabular-nums}.b1f-cell-muted{color:var(--text2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.b1f-form{max-width:640px;display:flex;flex-direction:column;gap:12px;padding:18px}.b1f-field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--text2)}.b1f-input,.b1f-field input,.b1f-field select,.b1f-field textarea{width:100%;box-sizing:border-box;min-height:42px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:9px 11px;font:inherit;font-size:13px;color:var(--text)}.b1f-field textarea{min-height:92px;resize:vertical}.b1f-input:focus,.b1f-field input:focus,.b1f-field select:focus,.b1f-field textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(91,76,196,.10)}.b1f-workflow{display:flex;flex-direction:column;gap:12px}.b1f-workflow-head{max-width:520px}.b1f-pick-list{border:1px solid #efd6d6;border-radius:10px;overflow:hidden;background:#fff}.b1f-pick-row{display:grid;grid-template-columns:28px minmax(180px,1fr) 120px 120px 155px;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid #f2e6e6}.b1f-pick-row:last-child{border-bottom:0}.b1f-pick-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--purple)}.b1f-pick-row input[type=number]{width:100%;box-sizing:border-box;min-height:36px;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font:inherit}.b1f-summary{max-width:640px;border:1px solid #e1ddf8;border-radius:10px;background:#faf9ff;padding:12px}.b1f-summary-row{display:flex;justify-content:space-between;gap:16px;padding:4px 0;font-size:13px}.b1f-summary-total{border-top:1px solid #ddd8f5;margin-top:7px;padding-top:9px;font-weight:700;color:var(--pd)}.b1f-project-group{border:1px solid #efd6d6;border-radius:10px;background:#fff;margin-bottom:12px;overflow:hidden}.b1f-project-title{padding:9px 12px;background:#fff8f8;font-weight:700;color:#7d3030}.b1f-use-row{display:grid;grid-template-columns:minmax(170px,1fr) 100px 95px minmax(180px,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid #f2e6e6}.b1f-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}.b1f-project-history{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}.b1f-project-history h3{font-size:13px;margin-bottom:7px}.b1f-project-history-row{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}.b1f-project-total{text-align:right;padding-top:8px;font-weight:700;color:var(--pd)}
.b1f-product-toolbar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}.b1f-product-toolbar input{max-width:420px}.b1f-product-toolbar span{font-size:12px;color:var(--text2);white-space:nowrap}.b1f-product-grid{grid-template-columns:minmax(170px,1.35fr) 95px 90px minmax(130px,1fr) minmax(130px,1fr) 105px 190px!important}.b1f-row-qty{width:100%;min-height:36px;box-sizing:border-box;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font:inherit;text-align:center}.b1f-cart-grid{grid-template-columns:minmax(180px,1.4fr) 190px 100px 110px 78px!important}.b1f-stepper{display:flex;align-items:center;justify-content:center;gap:5px}.b1f-stepper button{width:28px;height:28px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;font-size:16px;line-height:1}.b1f-stepper input{width:58px;min-height:30px;box-sizing:border-box;border:1px solid var(--border);border-radius:7px;padding:4px;text-align:center;font:inherit}.b1f-stepper span{font-size:12px;color:var(--text2)}.b1f-order-filter{margin-bottom:10px}.b1f-order-filter label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}.b1f-order-filter select{min-height:36px;border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:6px 8px;font:inherit}.b1f-order-totals{display:flex;flex-wrap:wrap;gap:8px 16px;padding:10px 12px;margin-bottom:12px;border:1px solid #e1ddf8;border-radius:9px;background:#faf9ff;font-size:12px}.b1f-order-totals strong{color:var(--pd)}.b1f-order-card{border:1px solid #efd6d6;border-radius:10px;background:#fff;margin-bottom:10px;overflow:hidden}.b1f-order-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:#fff8f8}.b1f-order-head span,.b1f-order-meta{font-size:12px;color:var(--text2)}.b1f-order-meta{padding:8px 12px;border-bottom:1px solid #f2e6e6}.b1f-order-line{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid #f2e6e6;font-size:12px}.b1f-order-line:last-child{border-bottom:0}
@media(max-width:760px){.nav-tab.b1f-nav{margin-left:0}.b1f-list{overflow-x:auto}.b1f-list-head,.b1f-row{min-width:850px}.b1f-pick-row{grid-template-columns:28px minmax(150px,1fr) 100px}.b1f-pick-row .b1f-pick-price{display:none}.b1f-pick-row .b1f-pick-qty{grid-column:2/4}.b1f-use-row{grid-template-columns:minmax(0,1fr) auto}.b1f-use-row .b1f-use-meta{grid-column:1/2}.b1f-actions{grid-column:1/-1;justify-content:flex-start}.b1f-form{padding:14px 0}}
.admin-only{display:none}.admin-only.show{display:inline-block}
.topnav-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
.user-avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--border)}
.user-name{font-size:12px;color:var(--text2);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-ind{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}
.main{flex:1;padding:1.25rem;width:100%}
.panel{display:none}.panel.active{display:block}

/* Company home — isolated from the existing operational panels. */
.home-nav-tab{font-size:15px;font-weight:700;color:var(--pd);padding:7px 16px;margin-right:8px;border:1px solid #d9d5f5;background:var(--pl)}
.home-nav-tab:hover,.home-nav-tab.active{background:var(--purple);color:#fff}
.home-brand-slot{display:flex;align-items:center;justify-content:center;min-width:118px;height:32px;padding:0 12px;border:1px dashed #c9c4bc;border-radius:var(--r);color:var(--text3);font-size:11px;background:#fbfaf8}
.home-shell{max-width:1480px;margin:0 auto}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.home-heading{display:flex;align-items:center;gap:12px}.home-heading h1{font-size:21px}.home-heading p{font-size:12px;color:var(--text2);margin-top:3px}
.home-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.home-view-switch{display:flex;padding:3px;background:#eeece8;border-radius:8px}.home-view-switch button{border:0;background:transparent;padding:6px 10px;border-radius:6px;color:var(--text2);font:inherit;font-size:12px;cursor:pointer}.home-view-switch button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.home-grid-wrap{position:relative;min-height:600px;border-radius:12px;padding:8px;overflow:hidden}
.home-grid-wrap.editing{background-color:#f9f8fc;background-image:linear-gradient(to right,rgba(92,83,174,.10) 1px,transparent 1px),linear-gradient(to bottom,rgba(92,83,174,.10) 1px,transparent 1px);background-size:calc((100% - 16px)/12) var(--home-unit,90px)}
.home-grid{position:relative;min-height:580px}
.home-module{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(30,27,24,.05);transition:left .16s ease,top .16s ease,width .16s ease,height .16s ease;user-select:none}
.home-grid-wrap.editing .home-module{cursor:grab;border-color:#c9c4ed;box-shadow:0 3px 12px rgba(60,52,137,.10)}.home-grid-wrap.editing .home-module.dragging{cursor:grabbing;transition:none;z-index:10;opacity:.88}.home-grid-wrap.editing .home-module.resizing{transition:none;z-index:10}
.home-module-head{height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:#fff}.home-module-title{font-size:14px;font-weight:600}.home-module-badges{display:flex;align-items:center;gap:5px}.home-module-badge{font-size:10px;color:var(--text2);background:var(--bg);border-radius:12px;padding:2px 6px}
.home-module-body{height:calc(100% - 42px);min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;color:var(--text3);font-size:12px;text-align:center;overflow:auto}.home-placeholder{border:1px dashed #d7d2ca;border-radius:8px;padding:12px 18px;background:#fbfaf8}.home-module[data-size-tier="small"] .home-module-body{font-size:11px}.home-module[data-size-tier="large"] .home-module-body{font-size:13px}
.today-news{width:100%;height:100%;display:flex;flex-direction:column;min-height:0;text-align:left}.today-news-loading,.today-news-empty{margin:auto;color:var(--text3);text-align:center}.today-news-updated{font-size:10px;color:var(--text3);margin-bottom:7px}.today-news-carousel{position:relative;min-height:0;flex:1;overflow:hidden;border-radius:9px;background:#27242d}.today-news-image-link{position:absolute;inset:0;display:block;cursor:pointer}.today-news-image{width:100%;height:100%;display:block;object-fit:cover}.today-news-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,23,.05) 30%,rgba(18,16,23,.86) 100%);pointer-events:none}.today-news-copy{position:absolute;z-index:1;left:12px;right:12px;bottom:10px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45);pointer-events:none}.today-news-source{display:block;font-size:10px;line-height:1.4;opacity:.9;margin-bottom:3px}.today-news-title{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:14px;font-weight:600;line-height:1.42}.today-news-arrow{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:30px;height:38px;border:0;border-radius:6px;background:rgba(20,18,24,.52);color:#fff;font:inherit;font-size:23px;line-height:1;cursor:pointer}.today-news-arrow.prev{left:8px}.today-news-arrow.next{right:8px}.today-news-position{position:absolute;z-index:2;top:9px;right:9px;border-radius:999px;background:rgba(20,18,24,.6);padding:3px 7px;color:#fff;font-size:10px}.today-news-detail{position:absolute;z-index:2;right:9px;bottom:9px;border:0;border-radius:6px;background:rgba(255,255,255,.95);color:var(--text);font:inherit;font-size:10px;font-weight:600;padding:5px 8px;cursor:pointer}.today-news-all-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:60vh;overflow:auto;margin-top:12px;padding:2px}.today-news-all-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:9px;background:#fff;color:inherit;text-decoration:none}.today-news-all-card:hover{border-color:var(--purple)}.today-news-all-image{width:100%;height:145px;object-fit:cover;background:var(--bg)}.today-news-all-copy{padding:8px 9px 9px}.today-news-all-title{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:12px;font-weight:600;line-height:1.45;color:var(--text)}.today-news-all-meta{font-size:10px;color:var(--text3);margin-top:5px}.home-module[data-size-tier="small"] .today-news-updated{display:none}.home-module[data-size-tier="small"] .today-news-copy{left:9px;right:9px;bottom:8px}.home-module[data-size-tier="small"] .today-news-title{font-size:11px}.home-module[data-size-tier="small"] .today-news-arrow{width:25px;height:31px;font-size:19px}.home-module[data-size-tier="small"] .today-news-arrow.prev{left:5px}.home-module[data-size-tier="small"] .today-news-arrow.next{right:5px}.home-module[data-size-tier="small"] .today-news-position{top:6px;right:6px;font-size:9px;padding:2px 5px}.home-module[data-size-tier="small"] .today-news-detail{right:6px;bottom:6px;font-size:9px;padding:4px 6px}@media(max-width:600px){.today-news-all-grid{grid-template-columns:1fr;max-height:58vh}.today-news-all-image{height:170px}}

/* Common */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:14px 16px}
.stat-n{font-size:24px;font-weight:600;line-height:1}.stat-l{font-size:12px;color:var(--text2);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);overflow:hidden;margin-bottom:1rem}
.card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:11px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.b-prog{background:var(--pl);color:var(--pd)}.b-done{background:var(--gl);color:var(--gd)}
.b-wait{background:var(--al);color:var(--ad)}.b-stop{background:var(--rl);color:var(--rd)}
.b-design{background:#F0EDFB;color:#4A3FA0}.b-new{background:var(--tl);color:var(--td)}
.pend{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:600;margin-left:3px;vertical-align:middle}
.pend-r{background:var(--rl);color:var(--rd)}.pend-g{background:var(--gl);color:var(--gd)}
.status-sel{font-size:11px;padding:2px 8px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;font-weight:500}
.btn{padding:6px 14px;border-radius:var(--r);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--purple);color:#fff;border-color:var(--purple)}.btn-p:hover{background:var(--pd)}
.btn-sm{padding:3px 9px;font-size:12px}.btn-danger{background:var(--rl);color:var(--rd);border-color:var(--rl)}
input[type=text],input[type=date],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
.flex{display:flex;align-items:center;gap:8px}
.flex-sb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:13px}
/* AI Assistant */
.ai-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--purple);color:#fff;border:none;cursor:pointer;font-size:22px;box-shadow:0 4px 16px rgba(83,74,183,.4);z-index:200;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.ai-fab:hover{transform:scale(1.08)}
.ai-panel{position:fixed;bottom:88px;right:24px;width:360px;max-height:520px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.ai-header{padding:12px 16px;background:var(--purple);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.ai-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.ai-msg-user{background:var(--pl);color:var(--pd);padding:8px 12px;border-radius:12px 12px 4px 12px;font-size:13px;align-self:flex-end;max-width:85%}

function localDelete(collectionName,id){
  if(collectionName==='projects')S.projects=S.projects.filter(x=>String(x.id)!==id);
  else if(collectionName==='members')S.members=S.members.filter(x=>String(x.id)!==id&&String(x.uid)!==id);
  else if(collectionName==='homeNotes')S.homeNotes=S.homeNotes.filter(x=>String(x.id)!==id&&String(x.uid)!==id);
  else if(collectionName==='userTodos')S.userTodos=S.userTodos.filter(x=>String(x.id)!==id);
  else if(collectionName==='checks')delete S.checks[id];
  else if(collectionName==='bible'){delete S.bible[id];S.bibleOrder=S.bibleOrder.filter(x=>x!==id);}
  else if(collectionName==='dailyLogs')delete S.dailyLogs[id];
  else if(collectionName==='meetingLogs')delete S.meetingLogs[id];
  else if(collectionName==='globalNotes')delete S.globalNotes[id];
  else if(collectionName==='projectTradeSelections')delete S.projectTradeSelections[id];
  else if(['recommendations','recommendationCategories','recommendationRegions','growthItems','tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName))S[collectionName]=S[collectionName].filter(x=>String(x.id)!==id);
}

async function setDoc(ref,data,options){

}
async function addDoc(ref,data){
  if(!localTestMode)return fbAddDoc(ref,data);

  localWrite(collectionName,id,data,false);localNotify();return{id,path:`${collectionName}/${id}`};
}
async function getDoc(ref){
  if(!localTestMode)return fbGetDoc(ref);
  const{collection:collectionName,id}=localParts(ref);const value=localRead(collectionName,id);
  return{id,ref,exists:()=>value!==undefined,data:()=>localClone(value)};
}
async function getDocs(ref){
  if(!localTestMode)return fbGetDocs(ref);
  const collectionName=localPath(ref).split('/')[0];let entries=[];
  if(collectionName==='projects')entries=S.projects.map(x=>[x.id,x]);
  else if(collectionName==='members')entries=S.members.map(x=>[x.id||x.uid,x]);
  else if(collectionName==='homeNotes')entries=S.homeNotes.map(x=>[x.id||x.uid,x]);
  else if(collectionName==='userTodos')entries=S.userTodos.map(x=>[x.id,x]);
  else if(collectionName==='checks')entries=Object.entries(S.checks).map(([id,items])=>[id,{items}]);
  else if(collectionName==='bible')entries=Object.entries(S.bible);
  else if(collectionName==='projectTradeSelections')entries=Object.entries(S.projectTradeSelections).map(([id,categories])=>[id,{categories}]);
  else if(['recommendations','recommendationCategories','recommendationRegions','growthItems','tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName))entries=S[collectionName].map(x=>[x.id,x]);
  return{docs:entries.map(([id,value])=>({id,ref:doc(db,collectionName,id),data:()=>localClone(value)}))};
}
function writeBatch(database){
  if(!localTestMode)return fbWriteBatch(database);
  const ops=[];return{
    set:(ref,data,options)=>ops.push(()=>setDoc(ref,data,options)),
    update:(ref,data)=>ops.push(()=>updateDoc(ref,data)),
    delete:(ref)=>ops.push(()=>deleteDoc(ref)),
    commit:async()=>{for(const op of ops)await op();}
  };
}

function isAdmin(){return currentRole==='admin'||currentRole==='manager'}
function canEditProjects(role=currentRole){return role==='manager'||role==='admin'||role==='staff'}
function canDeleteProjects(role=currentRole){return role==='manager'}
function memberDisplayName(m){if(!m)return'成員';return m.displayName||m.name||(m.email?m.email.split('@')[0]:'成員');}
function memberTag(m){if(!m)return'?';if(m.tagInitial)return m.tagInitial;return memberDisplayName(m).charAt(0);}
function activeMembersList(){return S.members.filter(m=>(m.role==='admin'||m.role==='staff'||m.role==='manager')&&m.status!=='resigned');}
function markableMembersList(){return activeMembersList().filter(m=>m.role!=='manager');}
// Daily work log rows exclude the "管理員" (company/manager account) role —
// that role doesn't do site work, so it shouldn't be asked to log it.
function dailyLogMembersList(){return markableMembersList();}
function orderedDailyLogMembers(){
  const members=dailyLogMembersList();
  const saved=dailyLogMemberOrder;
  const rank=new Map(saved.map((uid,i)=>[uid,i]));
  return members.slice().sort((a,b)=>{
    const ar=rank.has(a.uid)?rank.get(a.uid):Number.MAX_SAFE_INTEGER;
    const br=rank.has(b.uid)?rank.get(b.uid):Number.MAX_SAFE_INTEGER;
    return ar-br;
  });
}
let dailyLogMemberOrder=[];
let dailyMemberDragUid=null;
window.dailyMemberDragStart=function(e,uid){
  if(!isAdmin()){e.preventDefault();return;}
  dailyMemberDragUid=uid;e.dataTransfer.effectAllowed='move';
};
window.dailyMemberDragOver=function(e){if(isAdmin()&&dailyMemberDragUid){e.preventDefault();e.dataTransfer.dropEffect='move';}};
window.dailyMemberDrop=async function(e,targetUid){
  e.preventDefault();
  if(!isAdmin()||!dailyMemberDragUid||dailyMemberDragUid===targetUid)return;
  const members=orderedDailyLogMembers();
  const from=members.findIndex(m=>m.uid===dailyMemberDragUid),to=members.findIndex(m=>m.uid===targetUid);
  if(from<0||to<0)return;
  const moved=members.splice(from,1)[0];members.splice(to,0,moved);dailyMemberDragUid=null;
  dailyLogMemberOrder=members.map(m=>m.uid);
  setSyncing();
  await setDoc(doc(db,'globalNotes','dailyLogMemberOrder'),{order:dailyLogMemberOrder,uid:currentUser.uid,updatedAt:serverTimestamp()},{merge:true});
  setSynced();
  if(activePanel==='progress')renderProgress();
};
const DEFAULT_DESIGN_COL_NAMES=['會議人員','平面圖','客變圖','3D圖','施工圖','報價單'];
const DEFAULT_DESIGN_COLS=[
  ...DEFAULT_DESIGN_COL_NAMES.map(name=>({name,kind:'member',collapsible:true})),
  {name:'備註',kind:'note',collapsible:false},
  ...Array.from({length:20},(_,i)=>({name:String(i+1),kind:'text',collapsible:false}))
];
// Keep the production Firebase structure and local preview structure identical.
// Legacy columns keep their original storage key so renaming 欄位7… to 1…20
// never discards data already saved in project.designProgress.
function normalizeDesignCols(raw){
  const source=(Array.isArray(raw)&&raw.length?raw:DEFAULT_DESIGN_COLS).map(c=>{
    if(typeof c==='string')return{name:c,key:c,kind:DEFAULT_DESIGN_COL_NAMES.includes(c)?'member':'text',collapsible:DEFAULT_DESIGN_COL_NAMES.includes(c)};
    return{...c,key:c.key||c.name};
  });
  const existingBlue=source.filter(c=>c.collapsible||c.kind==='member');
  const defaultBlue=DEFAULT_DESIGN_COL_NAMES.map(name=>({name,key:name,kind:'member',collapsible:true}));
  const blue=Array.from({length:6},(_,i)=>({...defaultBlue[i],...(existingBlue[i]||{}),collapsible:true,kind:'member'}));
  const red=source.filter(c=>!c.collapsible&&c.kind!=='member');
  const oldNote=red.find(c=>c.kind==='note'||c.name==='備註');
  const legacyNumbered=red.filter(c=>c!==oldNote);
  const note={name:'備註',key:oldNote?.key||oldNote?.name||'備註',kind:'note',collapsible:false};
  const numbered=Array.from({length:20},(_,i)=>{
    const display=String(i+1);
    const exact=legacyNumbered.find(c=>c.name===display);
    const legacy=exact||legacyNumbered[i];
    return{name:display,key:legacy?.key||legacy?.name||display,kind:'text',collapsible:false};
  });
  return[...blue,note,...numbered];
}
function getDesignCols(){
  const raw=designCols||DEFAULT_DESIGN_COLS;
  return normalizeDesignCols(raw);
}

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function isSameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function fmtDate(d){return`${d.getMonth()+1}/${d.getDate()}`}
function fmtDay(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function today(){return new Date()}
function getWeekDates(){
  return getMonthDates();
}
function getMonthDates(){
  const b=today();
  const target=new Date(b.getFullYear(),b.getMonth()+monthOffset,1);
  const y=target.getFullYear(),m=target.getMonth();
  const daysInMonth=new Date(y,m+1,0).getDate();
  return Array.from({length:daysInMonth},(_,i)=>new Date(y,m,i+1));

function getBibleStages(){
  if(S.bibleOrder&&S.bibleOrder.length)return[...new Set(S.bibleOrder)];
  return Object.keys(S.bible).filter(k=>k!=='orderConfig');
}
function displayStageName(stage){
  return String(stage||'').replace(/^.*?、\s*/,'').trim();
}
function getBiblePhaseItems(stage,phase){const b=S.bible[stage];return(b&&b[phase])?b[phase]:[];}
// A bible item used to always be a plain string. It can now be an object
// {text, subs:[...]} so it can carry indented sub-items. This normalizes
// either shape so the rest of the code only has to handle one format.
function normalizeBibleItem(it){
  if(typeof it==='string')return{text:it,subs:[]};
  return{text:it?.text||'',subs:Array.isArray(it?.subs)?it.subs:[]};
}
function flattenPhaseItems(rawArr,depth){
  depth=depth||0;
  const flat=[];
  (rawArr||[]).forEach(it=>{
    const n=normalizeBibleItem(it);
    flat.push({text:n.text,depth:depth,isSub:depth>0});
    flat.push(...flattenPhaseItems(n.subs,depth+1));
  });
  return flat;
}
function flatPhaseCount(rawArr){return(rawArr||[]).reduce((s,it)=>s+1+flatPhaseCount(normalizeBibleItem(it).subs),0);}
// Path-based helpers so items can nest to any depth (item -> sub-item ->
// sub-sub-item ...). A path is an array of indices, e.g. [2] is the 3rd
// top-level item, [2,0] is its 1st sub-item, [2,0,1] its 2nd sub-sub-item.
function replaceAtPath(arr,path,newNode){
  const copy=[...arr];
  if(path.length===1){copy[path[0]]=newNode;return copy;}
  const cur=normalizeBibleItem(copy[path[0]]);
  copy[path[0]]={text:cur.text,subs:replaceAtPath(cur.subs,path.slice(1),newNode)};
  return copy;
}
function addChildAtPath(arr,path,text){
  const copy=[...arr];
  const cur=normalizeBibleItem(copy[path[0]]);
  if(path.length===1){
    copy[path[0]]={text:cur.text,subs:[...cur.subs,text]};
  }else{
    copy[path[0]]={text:cur.text,subs:addChildAtPath(cur.subs,path.slice(1),text)};
  }
  return copy;
}
function removeAtPath(arr,path){
  const copy=[...arr];
  if(path.length===1){copy.splice(path[0],1);return copy;}
  const cur=normalizeBibleItem(copy[path[0]]);
  copy[path[0]]={text:cur.text,subs:removeAtPath(cur.subs,path.slice(1))};
  return copy;
}
function getNodeAtPath(arr,path){
  let node=arr[path[0]];
  for(let k=1;k<path.length;k++)node=normalizeBibleItem(node).subs[path[k]];
  return node;
}
function flatIndexAtPath(data,phase,path){
  const before=data.before||[],during=data.during||[];
  let offset=0;
  if(phase!=='before')offset+=flatPhaseCount(before);
  if(phase==='after')offset+=flatPhaseCount(during);
  let arr=data[phase]||[];
  for(let level=0;level<path.length;level++){
    const idx=path[level];
    for(let i=0;i<idx;i++)offset+=1+flatPhaseCount(normalizeBibleItem(arr[i]).subs);
    if(level<path.length-1){
      offset+=1;
      arr=normalizeBibleItem(arr[idx]).subs;
    }
  }
  return offset;
}
function getAllBibleItemsMeta(stage){
  const b=S.bible[stage]||{before:[],during:[],after:[]};
  return[...flattenPhaseItems(b.before),...flattenPhaseItems(b.during),...flattenPhaseItems(b.after)];
}
function getAllBibleItems(stage){return getAllBibleItemsMeta(stage).map(x=>x.text);}
// For a completed project, use the frozen snapshot taken when it was marked
// done, so later edits to the live 施工寶典 template don't shift/relabel
// its already-checked items. Active projects always use the live template.
function projectBibleData(proj,stage){
  if(proj&&proj.status==='done'&&proj.bibleSnapshot&&proj.bibleSnapshot[stage])return proj.bibleSnapshot[stage];
  return S.bible[stage]||{before:[],during:[],after:[]};
}
function projectBibleItemsMeta(proj,stage){
  const b=projectBibleData(proj,stage);
  return[...flattenPhaseItems(b.before),...flattenPhaseItems(b.during),...flattenPhaseItems(b.after)];
}
function projectBibleItems(proj,stage){return projectBibleItemsMeta(proj,stage).map(x=>x.text);}
function pendingCount(projId,stage){
  if(!stage)return null;
  const proj=S.projects.find(p=>p.id===projId);
  const items=projectBibleItems(proj,stage);if(!items.length)return null;
  const stored=S.checks[`${projId}_${stage}`]||[];
  return items.length-items.filter((_,i)=>stored[i]?.done||stored[i]?.skip).length;
}
function pendBadge(n){
  if(n===null)return'';
  if(n===0)return`<span class="pend pend-g">✓</span>`;
  return`<span class="pend pend-r">${n}</span>`;
}
// Shared row renderer for a bible checklist item — ✓ means done, ✗ means
// "seen but not applicable to this site". Both count as resolved. Sub-items
// (item.isSub) render indented under their parent.
function renderCheckItemRow(projId,stage,idx,item,isEstimate){
  const cls=item.done?'done':(item.skip?'skip':'');
  const depth=item.depth||(item.isSub?1:0);
  const stageStarted=(S.checks[`${projId}_${stage}`]||[]).some(row=>row?.done||row?.skip);
  const showPending=stageStarted&&!item.done&&!item.skip;
  return`<div class="ws-cl-item ${cls}"${depth>0?` style="padding-left:${depth*26}px"`:''}>
    <div class="ck-btns">
      <span class="ck-pending-marker ${showPending?'show':''}" aria-hidden="true"></span>
      <button type="button" class="ck-btn ${item.done?'on-done':''}" title="完成" onclick="setCheckStatus('${projId}','${stage}',${idx},'done')">✓</button>
      <button type="button" class="ck-btn ${item.skip?'on-skip':''}" title="不適用" onclick="setCheckStatus('${projId}','${stage}',${idx},'skip')">✗</button>
    </div>
    <label>${depth>0?'└ ':''}${item.text}</label>
    ${isEstimate?`<input type="number" class="ck-amount" placeholder="金額" value="${item.amount||''}" onclick="event.stopPropagation()" onchange="setCheckAmount('${projId}','${stage}',${idx},this.value)">`:''}
  </div>`;
}

    const saved=snap.exists()?(snap.data().cols||DEFAULT_DESIGN_COLS):DEFAULT_DESIGN_COLS;
    const normalized=normalizeDesignCols(saved);
    designCols=normalized;
    if(!designStructureMigrationAttempted&&JSON.stringify(saved)!==JSON.stringify(normalized)){
      designStructureMigrationAttempted=true;
      setDoc(doc(db,'settings','designCols'),{cols:normalized}).catch(err=>console.warn('設計欄位結構同步失敗',err));
    }
    renderActive();
  });
  onSnapshot(doc(db,'settings','designColWidths'),snap=>{
    designColWidths=snap.exists()?(snap.data().widths||{}):{};
    if(activePanel==='design')renderDesign();
  });
  onSnapshot(doc(db,'settings','designProjectOrder'),snap=>{
    designProjectOrder=snap.exists()?(snap.data().order||[]):[];
    if(activePanel==='design')renderDesign();else if(activePanel==='overview')renderOverview();else if(activePanel==='progress')renderProgress();
  });
  onSnapshot(doc(db,'settings','dateColors'),snap=>{
    S.dateColors=snap.exists()?(snap.data().colors||{}):{};
    if(activePanel==='progress')renderProgress();
  });
  // Daily logs: shared, keyed by date
  onSnapshot(collection(db,'dailyLogs'),snap=>{
    S.dailyLogs={};
    snap.docs.forEach(d=>{S.dailyLogs[d.id]=d.data();});
    if(activePanel==='progress')renderProgress();
  });
  onSnapshot(collection(db,'meetingLogs'),snap=>{
    S.meetingLogs={};
    snap.docs.forEach(d=>{S.meetingLogs[d.id]=d.data();});
    if(activePanel==='progress')renderProgress();
  });
  onSnapshot(doc(db,'globalNotes','dailyLogMemberOrder'),snap=>{
    dailyLogMemberOrder=snap.exists()&&Array.isArray(snap.data().order)?snap.data().order:[];
    if(activePanel==='progress')renderProgress();
  });
  onSnapshot(
    query(collection(db,'globalNotes'),where('uid','==',currentUser.uid)),
    snap=>{
      S.globalNotes={};
      snap.docs.forEach(d=>{S.globalNotes[d.id]=d.data();});
      if(activePanel==='progress')renderProgress();
    }
  );
  onSnapshot(
    query(collection(db,'userTodos'),where('uid','==',currentUser.uid)),
    snap=>{
      S.userTodos=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(activePanel==='progress')renderProgress();
    }
  );
  // Private notes: per user
  if(currentUser){
    onSnapshot(doc(db,'userPrefs',currentUser.uid),snap=>{
      userPrefs=snap.exists()?snap.data():{todoProjects:[]};
      if(userPrefs.noteHeight)globalNoteBoxHeight=userPrefs.noteHeight;
      if(activePanel==='progress')renderProgress();
    });
    onSnapshot(doc(db,'privateNotes',currentUser.uid),snap=>{
      S.privateNotes=snap.exists()?snap.data():{work:{},personal:{}};
      if(activePanel==='progress')renderProgress();
      syncAllRecurringSchedules();
    });
  }
}

let b1fView='inventory',b1fIssueProjectId='',b1fReturnProjectId='',b1fHistoryFilter='all',b1fStore=null,b1fFlash='';
const B1F_STORE_VERSION=2;
function b1fId(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}

function b1fDateTime(v){const d=new Date(v);return isNaN(d)?'—':`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function b1fKey(){return `b1fStoreV2_${currentUser?.uid||'local'}`;}

  {id:'b1-silicone',name:'白色矽利康',stockQty:6,unit:'條',unitPrice:0,source:'大塊森濤5F',note:'外箱略破',createdAt:now},
  {id:'b1-hinge',name:'BLUM 鉸鍊',stockQty:110,unit:'個',unitPrice:100,source:'公司常備',note:'',createdAt:now},
  {id:'b1-toilet',name:'HCG 馬桶',stockQty:1,unit:'個',unitPrice:5000,source:'林宅剩料',note:'可再次使用',createdAt:now}
],usages:[],logs:[]};}
function b1fData(){if(b1fStore)return b1fStore;try{const saved=JSON.parse(localStorage.getItem(b1fKey())||'null');b1fStore=saved?.version===B1F_STORE_VERSION?saved:b1fSeed();}catch(error){b1fStore=b1fSeed();}return b1fStore;}

function b1fUsage(id){return b1fData().usages.find(x=>x.id===id);}

function b1fItemInUse(itemId){return b1fOpenUsages().filter(x=>x.itemId===itemId).reduce((n,x)=>n+(Number(x.inUseQty)||0),0);}
function b1fLog(type,data){b1fData().logs.push({id:b1fId('log'),type,createdAt:b1fNow(),actorId:currentUser?.uid||'',actorName:currentUser?.displayName||'',...data});}
function b1fTypeLabel(type){return({entry:'入庫',issue:'領用',charge:'計價',return:'退回',refund:'退款',used:'使用完畢',disposed:'報廢',inventory_disposed:'B1F直接報廢'})[type]||type;}
function b1fProjectOptions(selected,onlyWithUsage=false){let projects=S.projects.filter(p=>p.status==='prog');if(onlyWithUsage)projects=projects.filter(p=>b1fOpenUsages().some(r=>r.projectId===p.id));return`<option value="">請選擇案件</option>${projects.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${escAttr(p.name)}</option>`).join('')}`;}
function b1fInventoryMarkup(){const items=b1fData().items;return`<div class="b1f-list"><div class="b1f-list-head b1f-inventory-grid"><span>物品名稱</span><span class="b1f-col-center">在庫數量</span><span class="b1f-col-money">單價</span><span>來源</span><span class="b1f-col-center">使用中數量</span><span>備註</span><span class="b1f-col-center">操作</span></div>${items.length?items.map(i=>`<div class="b1f-row b1f-inventory-grid"><div class="b1f-item-name">${escAttr(i.name)}</div><div class="b1f-item-qty b1f-col-center">${i.stockQty}${escAttr(i.unit)}</div><div class="b1f-col-money">${b1fMoney(i.unitPrice)}</div><div class="b1f-cell-muted">${escAttr(i.source||'—')}</div><div class="b1f-col-center">${b1fItemInUse(i.id)?`${b1fItemInUse(i.id)}${escAttr(i.unit)}`:'—'}</div><div class="b1f-cell-muted">${escAttr(i.note||'—')}</div><div class="b1f-actions"><button class="btn btn-sm btn-p" ${i.stockQty>0?'':'disabled'} onclick="openB1FIssueFor('${i.id}')">領用</button><button class="btn btn-sm" ${i.stockQty>0?'':'disabled'} onclick="showB1FInventoryDispose('${i.id}')">報廢</button></div></div>`).join(''):'<div class="b1f-empty">目前沒有庫存物品。</div>'}</div>`;}
function b1fEntryMarkup(){return`<div class="card" style="max-width:700px"><div class="card-hdr"><span class="card-title">入庫</span></div><div class="b1f-form"><label class="b1f-field">物品名稱<input id="b1f-entry-name" placeholder="輸入物品名稱"></label><label class="b1f-field">數量<input id="b1f-entry-qty" type="number" min="0.01" step="any" placeholder="輸入數量"></label><label class="b1f-field">單位<input id="b1f-entry-unit" placeholder="例如：個、條、支" value="個"></label><label class="b1f-field">來源<input id="b1f-entry-source" placeholder="自由輸入來源"></label><label class="b1f-field">單價<input id="b1f-entry-price" type="number" min="0" step="any" placeholder="0 元物品請填 0"></label><label class="b1f-field">備註<textarea id="b1f-entry-note" placeholder="備註（選填）"></textarea></label><button class="btn btn-p" onclick="saveB1FEntry()">確認入庫</button></div></div>`;}
function b1fIssueMarkup(){const items=b1fData().items.filter(i=>Number(i.stockQty)>0);return`<div class="b1f-workflow"><label class="b1f-field b1f-workflow-head">使用工地／案件<select id="b1f-issue-project" onchange="setB1FIssueProject(this.value)">${b1fProjectOptions(b1fIssueProjectId)}</select></label><div class="b1f-pick-list">${items.length?items.map(i=>`<div class="b1f-pick-row"><input class="b1f-issue-check" type="checkbox" data-id="${i.id}" onchange="b1fTogglePick(this,'issue');b1fUpdateIssueSummary()"><div><strong>${escAttr(i.name)}</strong><div class="b1f-cell-muted">庫存 ${i.stockQty}${escAttr(i.unit)}</div></div><div class="b1f-pick-price b1f-col-money">${b1fMoney(i.unitPrice)}</div><div class="b1f-pick-price">小計 <span id="b1f-issue-sub-${i.id}">$0</span></div><label class="b1f-pick-qty">領用數量<input id="b1f-issue-qty-${i.id}" type="number" min="0" max="${i.stockQty}" step="any" value="0" disabled oninput="b1fUpdateIssueSummary()"></label></div>`).join(''):'<div class="b1f-empty">目前沒有可領用的庫存。</div>'}</div><div class="b1f-summary" id="b1f-issue-summary"><div class="b1f-cell-muted">勾選物品並輸入領用數量後，這裡會顯示摘要。</div></div><button class="btn btn-p" style="max-width:220px" onclick="confirmB1FIssue()">確認領用</button></div>`;}
function b1fReturnMarkup(){const records=b1fReturnProjectId?b1fOpenUsages().filter(r=>r.projectId===b1fReturnProjectId):[];return`<div class="b1f-workflow"><label class="b1f-field b1f-workflow-head">使用工地／案件<select onchange="setB1FReturnProject(this.value)">${b1fProjectOptions(b1fReturnProjectId,true)}</select></label>${b1fReturnProjectId?`<div class="b1f-pick-list">${records.map(r=>`<div class="b1f-pick-row"><input class="b1f-return-check" type="checkbox" data-id="${r.id}" onchange="b1fTogglePick(this,'return');b1fUpdateReturnSummary()"><div><strong>${escAttr(r.itemName)}</strong><div class="b1f-cell-muted">目前使用中 ${r.inUseQty}${escAttr(r.unit)}</div></div><div class="b1f-pick-price b1f-col-money">${b1fMoney(r.unitPrice)}</div><div class="b1f-pick-price">退款 <span id="b1f-return-sub-${r.id}">$0</span></div><label class="b1f-pick-qty">本次退回<input id="b1f-return-qty-${r.id}" type="number" min="0" max="${r.inUseQty}" step="any" value="0" disabled oninput="b1fUpdateReturnSummary()"></label></div>`).join('')||'<div class="b1f-empty">此案件目前沒有使用中物品。</div>'}</div><div class="b1f-summary" id="b1f-return-summary"><div class="b1f-cell-muted">勾選物品並輸入退回數量後，這裡會顯示退款摘要。</div></div><button class="btn btn-p" style="max-width:220px" onclick="confirmB1FReturn()">確認退回</button>`:'<div class="b1f-empty">請先選擇有 B1F 使用中物品的案件。</div>'}</div>`;}
function b1fInUseMarkup(){const records=b1fOpenUsages(),groups=[...new Set(records.map(r=>r.projectId))];if(!groups.length)return'<div class="b1f-empty">目前沒有使用中的 B1F 物品。</div>';return groups.map(pid=>{const rows=records.filter(r=>r.projectId===pid),project=S.projects.find(p=>p.id===pid);return`<section class="b1f-project-group"><div class="b1f-project-title">${escAttr(project?.name||rows[0].projectName||'未知案件')}</div>${rows.map(r=>`<div class="b1f-use-row"><div class="b1f-item-name">${escAttr(r.itemName)}</div><div class="b1f-item-qty">${r.inUseQty}${escAttr(r.unit)}</div><div class="b1f-col-money">${b1fMoney(r.unitPrice)}</div><div class="b1f-use-meta b1f-cell-muted">原始計價 ${b1fMoney(r.chargeAmount)}｜已退款 ${b1fMoney(r.refundedAmount)}</div><div class="b1f-actions"><button class="btn btn-sm btn-p" onclick="showB1FUsageAction('${r.id}','used')">使用完畢</button><button class="btn btn-sm" onclick="openB1FReturnFor('${r.projectId}')">退回</button><button class="btn btn-sm btn-danger" onclick="showB1FUsageAction('${r.id}','disposed')">報廢</button></div></div>`).join('')}</section>`;}).join('');}
function b1fHistoryMarkup(){let logs=b1fData().logs.slice().reverse();if(b1fHistoryFilter!=='all'){if(b1fHistoryFilter==='disposed')logs=logs.filter(x=>['disposed','inventory_disposed'].includes(x.type));else logs=logs.filter(x=>x.type===b1fHistoryFilter);}return`<div class="seg" style="width:max-content;margin-bottom:10px">${[['all','全部'],['entry','入庫'],['issue','領用'],['return','退回'],['used','使用完畢'],['disposed','報廢']].map(([id,label])=>`<button class="${b1fHistoryFilter===id?'on':''}" onclick="setB1FHistoryFilter('${id}')">${label}</button>`).join('')}</div><div class="b1f-list"><div class="b1f-list-head b1f-history-grid"><span>日期</span><span>類型</span><span>物品</span><span class="b1f-col-center">數量</span><span>案件／來源</span><span class="b1f-col-money">金額</span></div>${logs.length?logs.map(x=>`<div class="b1f-row b1f-history-grid"><div class="b1f-cell-muted">${b1fDateTime(x.createdAt)}</div><div>${b1fTypeLabel(x.type)}</div><div class="b1f-item-name">${escAttr(x.itemName||'—')}</div><div class="b1f-col-center">${x.quantity??'—'}${x.unit?escAttr(x.unit):''}</div><div class="b1f-cell-muted">${escAttr(x.projectName||x.source||'B1F')}</div><div class="b1f-col-money">${x.amount==null?'—':b1fMoney(x.amount)}</div></div>`).join(''):'<div class="b1f-empty">尚無異動紀錄。</div>'}</div>`;}
function renderB1F(){const el=$('panel-b1f');if(!el)return;const tabs=[['entry','入庫'],['inventory','庫存'],['issue','領用'],['return','退回'],['inuse','使用中'],['history','紀錄']],views={entry:b1fEntryMarkup,inventory:b1fInventoryMarkup,issue:b1fIssueMarkup,return:b1fReturnMarkup,inuse:b1fInUseMarkup,history:b1fHistoryMarkup};el.innerHTML=`<div class="b1f-shell"><div class="b1f-head"><div><h1>🛒 B1F 商城</h1><p>工程剩料、可再利用物品與常備五金；計價只記錄在 B1F 與工地使用紀錄。</p></div><div class="b1f-tabs">${tabs.map(([id,label])=>`<button class="${b1fView===id?'active':''}" onclick="setB1FView('${id}')">${label}</button>`).join('')}</div></div>${b1fFlash?`<div class="b1f-summary" style="margin-bottom:12px">${escAttr(b1fFlash)}</div>`:''}${views[b1fView]()}</div>`;b1fFlash='';}

window.b1fTogglePick=function(box,type){const input=$(`b1f-${type}-qty-${box.dataset.id}`);if(input){input.disabled=!box.checked;if(!box.checked)input.value=0;else if(Number(input.value)<=0)input.value=1;}};
window.b1fUpdateIssueSummary=function(){let total=0,html='';document.querySelectorAll('.b1f-issue-check:checked').forEach(box=>{const item=b1fItem(box.dataset.id),qty=Number($(`b1f-issue-qty-${item.id}`).value)||0,amount=qty*item.unitPrice;total+=amount;$(`b1f-issue-sub-${item.id}`).textContent=b1fMoney(amount);if(qty>0)html+=`<div class="b1f-summary-row"><span>${escAttr(item.name)} ×${qty}</span><strong>${b1fMoney(amount)}</strong></div>`;});$('b1f-issue-summary').innerHTML=(html||'<div class="b1f-cell-muted">尚未選擇有效數量。</div>')+`<div class="b1f-summary-row b1f-summary-total"><span>本次計價總額</span><span>${b1fMoney(total)}</span></div>`;};
window.b1fUpdateReturnSummary=function(){let total=0,html='';document.querySelectorAll('.b1f-return-check:checked').forEach(box=>{const r=b1fUsage(box.dataset.id),qty=Number($(`b1f-return-qty-${r.id}`).value)||0,amount=qty*r.unitPrice;total+=amount;$(`b1f-return-sub-${r.id}`).textContent=b1fMoney(amount);if(qty>0)html+=`<div class="b1f-summary-row"><span>${escAttr(r.itemName)} ×${qty}</span><strong>退款 ${b1fMoney(amount)}</strong></div>`;});$('b1f-return-summary').innerHTML=(html||'<div class="b1f-cell-muted">尚未選擇有效數量。</div>')+`<div class="b1f-summary-row b1f-summary-total"><span>本次退款總額</span><span>${b1fMoney(total)}</span></div>`;};
window.saveB1FEntry=function(){const name=$('b1f-entry-name').value.trim(),qty=Number($('b1f-entry-qty').value),unit=$('b1f-entry-unit').value.trim(),source=$('b1f-entry-source').value.trim(),price=Number($('b1f-entry-price').value),note=$('b1f-entry-note').value.trim();if(!name||!unit||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0)return alert('請完整填寫物品名稱、正確數量、單位與單價。');const item={id:b1fId('item'),name,stockQty:qty,unit,unitPrice:price,source,note,createdAt:b1fNow()};b1fData().items.push(item);b1fLog('entry',{itemId:item.id,itemName:name,quantity:qty,unit,source,amount:qty*price});b1fSave();b1fView='inventory';renderB1F();};
window.confirmB1FIssue=function(){const project=S.projects.find(p=>p.id===$('b1f-issue-project').value);if(!project)return alert('請選擇施工中案件。');const lines=[];document.querySelectorAll('.b1f-issue-check:checked').forEach(box=>{const item=b1fItem(box.dataset.id),qty=Number($(`b1f-issue-qty-${item.id}`).value);lines.push({item,qty});});if(!lines.length)return alert('請至少勾選一項物品。');if(lines.some(x=>!Number.isFinite(x.qty)||x.qty<=0||x.qty>x.item.stockQty))return alert('每項領用數量必須大於 0，且不得超過在庫數量。');const batchId=b1fId('batch'),now=b1fNow();lines.forEach(({item,qty})=>{item.stockQty-=qty;const amount=qty*item.unitPrice,record={id:b1fId('usage'),batchId,itemId:item.id,itemName:item.name,unit:item.unit,unitPrice:item.unitPrice,projectId:project.id,projectName:project.name,issuedQty:qty,inUseQty:qty,returnedQty:0,usedQty:0,disposedQty:0,chargeAmount:amount,refundedAmount:0,status:'in_use',issuedAt:now};b1fData().usages.push(record);b1fLog('issue',{batchId,usageId:record.id,itemId:item.id,itemName:item.name,quantity:qty,unit:item.unit,projectId:project.id,projectName:project.name,amount});if(amount>0)b1fLog('charge',{batchId,usageId:record.id,itemId:item.id,itemName:item.name,quantity:qty,unit:item.unit,projectId:project.id,projectName:project.name,amount});});b1fSave();b1fFlash=`領用完成：${lines.length} 項｜本次計價總額 ${b1fMoney(lines.reduce((n,x)=>n+x.qty*x.item.unitPrice,0))}`;b1fView='inuse';renderB1F();};
window.confirmB1FReturn=function(){const lines=[];document.querySelectorAll('.b1f-return-check:checked').forEach(box=>{const record=b1fUsage(box.dataset.id),qty=Number($(`b1f-return-qty-${record.id}`).value);lines.push({record,qty});});if(!lines.length)return alert('請至少勾選一項退回物品。');if(lines.some(x=>!Number.isFinite(x.qty)||x.qty<=0||x.qty>x.record.inUseQty))return alert('每項退回數量必須大於 0，且不得超過目前使用中數量。');lines.forEach(({record,qty})=>{const item=b1fItem(record.itemId),refund=qty*record.unitPrice;record.inUseQty-=qty;record.returnedQty+=qty;record.refundedAmount+=refund;record.status=record.inUseQty>0?'in_use':'closed';item.stockQty+=qty;b1fLog('return',{usageId:record.id,itemId:item.id,itemName:item.name,quantity:qty,unit:item.unit,projectId:record.projectId,projectName:record.projectName,amount:refund});if(refund>0)b1fLog('refund',{usageId:record.id,itemId:item.id,itemName:item.name,quantity:qty,unit:item.unit,projectId:record.projectId,projectName:record.projectName,amount:refund});});b1fSave();b1fFlash=`退回完成｜本次退款總額 ${b1fMoney(lines.reduce((n,x)=>n+x.qty*x.record.unitPrice,0))}`;b1fView='inuse';renderB1F();};
window.openB1FIssueFor=function(itemId){b1fView='issue';renderB1F();setTimeout(()=>{const box=document.querySelector(`.b1f-issue-check[data-id="${itemId}"]`);if(box){box.checked=true;b1fTogglePick(box,'issue');b1fUpdateIssueSummary();}},0);};
window.openB1FReturnFor=function(projectId){b1fReturnProjectId=projectId;b1fView='return';renderB1F();};
window.showB1FInventoryDispose=function(itemId){const item=b1fItem(itemId);if(!item)return;$('mo-content').innerHTML=`<div class="mo-title">B1F 直接報廢：${escAttr(item.name)}</div><div class="b1f-form"><label class="b1f-field">本次報廢數量<input id="b1f-action-qty" type="number" min="0.01" max="${item.stockQty}" step="any" value="1"></label><label class="b1f-field">備註<textarea id="b1f-action-note" placeholder="報廢原因（選填）"></textarea></label><div class="mo-footer"><button class="btn" onclick="closeMo()">取消</button><button class="btn btn-danger" onclick="confirmB1FInventoryDispose('${item.id}')">確認報廢</button></div></div>`;$('modal').style.display='flex';};
window.confirmB1FInventoryDispose=function(itemId){const item=b1fItem(itemId),qty=Number($('b1f-action-qty').value);if(!item||!Number.isFinite(qty)||qty<=0||qty>item.stockQty)return alert('報廢數量必須大於 0，且不得超過在庫數量。');item.stockQty-=qty;b1fLog('inventory_disposed',{itemId:item.id,itemName:item.name,quantity:qty,unit:item.unit,source:item.source,amount:null,note:$('b1f-action-note').value.trim()});b1fSave();closeMo();renderB1F();};
window.showB1FUsageAction=function(usageId,type){const r=b1fUsage(usageId),label=type==='used'?'使用完畢':'報廢';if(!r)return;$('mo-content').innerHTML=`<div class="mo-title">${label}：${escAttr(r.itemName)}</div><div class="b1f-form"><div class="mo-sub">目前使用中 ${r.inUseQty}${escAttr(r.unit)}；可處理部分數量。</div><label class="b1f-field">本次${label}數量<input id="b1f-action-qty" type="number" min="0.01" max="${r.inUseQty}" step="any" value="${r.inUseQty}"></label><label class="b1f-field">備註<textarea id="b1f-action-note" placeholder="備註（選填）"></textarea></label><div class="mo-footer"><button class="btn" onclick="closeMo()">取消</button><button class="btn ${type==='disposed'?'btn-danger':'btn-p'}" onclick="confirmB1FUsageAction('${r.id}','${type}')">確認${label}</button></div></div>`;$('modal').style.display='flex';};
window.confirmB1FUsageAction=function(usageId,type){const r=b1fUsage(usageId),qty=Number($('b1f-action-qty').value);if(!r||!Number.isFinite(qty)||qty<=0||qty>r.inUseQty)return alert('數量必須大於 0，且不得超過目前使用中數量。');r.inUseQty-=qty;if(type==='used')r.usedQty+=qty;else r.disposedQty+=qty;r.status=r.inUseQty>0?'in_use':'closed';b1fLog(type,{usageId:r.id,itemId:r.itemId,itemName:r.itemName,quantity:qty,unit:r.unit,projectId:r.projectId,projectName:r.projectName,amount:null,note:$('b1f-action-note').value.trim()});b1fSave();closeMo();renderB1F();};
function b1fProjectHistoryMarkup(projectId){const records=b1fData().usages.filter(r=>r.projectId===projectId);if(!records.length)return'';const total=records.reduce((n,r)=>n+r.chargeAmount-r.refundedAmount,0);return`<section class="b1f-project-history"><h3>🛒 B1F 商城使用紀錄</h3>${records.map(r=>{const actual=r.issuedQty-r.returnedQty,status=r.inUseQty>0?`使用中 ${r.inUseQty}${r.unit}`:r.disposedQty>0&&r.usedQty===0?'報廢':r.returnedQty===r.issuedQty?'已退回':'使用完畢';return`<div class="b1f-project-history-row"><span>${escAttr(r.itemName)}｜領用${r.issuedQty}${escAttr(r.unit)}${r.returnedQty?`｜退回${r.returnedQty}${escAttr(r.unit)}`:''}｜實際${actual}${escAttr(r.unit)}</span><strong>${status}${r.unitPrice>0?`｜${b1fMoney(r.chargeAmount-r.refundedAmount)}`:''}</strong></div>`;}).join('')}<div class="b1f-project-total">B1F 實際總計：${b1fMoney(total)}</div></section>`;}

// ── B1F 商城 V4：商品／購物車／訂單 ──
const B1F_STORE_VERSION_V3=4;
let b1fCartProjectId='',b1fHistoryTab='orders',b1fOrderProjectId='',b1fProductSearch='';
b1fView='products';
function b1fStoreKeyV3(){return `b1fStoreV3_${currentUser?.uid||'local'}`;}
function b1fLegacyStoreKey(){return `b1fStoreV2_${currentUser?.uid||'local'}`;}
function b1fSeedV3(){return{version:B1F_STORE_VERSION_V3,items:[],usages:[],logs:[],orders:[],carts:{}};}
function b1fRemoveDemoData(store){const demoIds=new Set(['b1-silicone','b1-hinge','b1-toilet']),usages=(store.usages||[]).filter(row=>!demoIds.has(row.itemId)),usageIds=new Set(usages.map(row=>row.id));return{...store,version:B1F_STORE_VERSION_V3,items:(store.items||[]).filter(item=>!demoIds.has(item.id)),usages,logs:(store.logs||[]).filter(row=>!demoIds.has(row.itemId)&&(!row.usageId||usageIds.has(row.usageId))),orders:(store.orders||[]).map(order=>({...order,usageIds:(order.usageIds||[]).filter(id=>usageIds.has(id))})).filter(order=>order.usageIds.length),carts:Object.fromEntries(Object.entries(store.carts||{}).map(([uid,rows])=>[uid,(rows||[]).filter(row=>!demoIds.has(row.itemId))]))};}
function b1fMigrateStore(raw){if(!raw||typeof raw!=='object')return b1fSeedV3();if(raw.version===B1F_STORE_VERSION_V3)return{...b1fSeedV3(),...raw,items:Array.isArray(raw.items)?raw.items:[],usages:Array.isArray(raw.usages)?raw.usages:[],logs:Array.isArray(raw.logs)?raw.logs:[],orders:Array.isArray(raw.orders)?raw.orders:[],carts:raw.carts||{}};const next={...b1fSeedV3(),items:Array.isArray(raw.items)?raw.items:[],usages:Array.isArray(raw.usages)?raw.usages:[],logs:Array.isArray(raw.logs)?raw.logs:[]},groups={};next.usages.forEach((usage,index)=>{const batchId=usage.batchId||`legacy-${index}`;(groups[batchId]||=([])).push(usage);});next.orders=Object.entries(groups).map(([batchId,rows],index)=>({id:`order-${batchId}`,batchId,orderNo:`B1F-歷史-${String(index+1).padStart(3,'0')}`,projectId:rows[0].projectId,projectName:rows[0].projectName,createdAt:rows[0].issuedAt||b1fNow(),actorId:rows[0].actorId||'',actorName:rows[0].actorName||'',usageIds:rows.map(r=>r.id)}));return b1fRemoveDemoData(next);}
function b1fDataV3(){if(b1fStore)return b1fStore;try{const raw=JSON.parse(localStorage.getItem(b1fStoreKeyV3())||localStorage.getItem(b1fLegacyStoreKey())||'null');b1fStore=b1fMigrateStore(raw);if(raw?.version!==B1F_STORE_VERSION_V3)localStorage.setItem(b1fStoreKeyV3(),JSON.stringify(b1fStore));}catch(error){b1fStore=b1fSeedV3();}return b1fStore;}
function b1fSaveV3(){localStorage.setItem(b1fStoreKeyV3(),JSON.stringify(b1fData()));}
function b1fCart(){const data=b1fData(),uid=currentUser?.uid||'local';data.carts||(data.carts={});return(data.carts[uid]||=([]));}
function b1fCartLines(){return b1fCart().map(line=>({line,item:b1fItem(line.itemId)})).filter(x=>x.item);}
function b1fCartCount(){return b1fCartLines().length;}
function b1fCanDispose(){return isAdmin();}
function b1fTypeLabelV3(type){return({entry:'新增商品',issue:'確認領用',charge:'計價',return:'退貨',refund:'退款',used:'使用完畢',disposed:'報廢',inventory_disposed:'B1F直接報廢'})[type]||type;}
function b1fProjectOptionsV3(selected,onlyWithUsage=false){let projects=S.projects.filter(p=>p.status==='prog');if(onlyWithUsage)projects=projects.filter(p=>b1fOpenUsages().some(r=>r.projectId===p.id));return`<option value="">請選擇施工中案件</option>${projects.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${escAttr(p.name)}</option>`).join('')}`;}
function b1fOrderProjectOptions(selected){const ids=[...new Set(b1fData().orders.map(o=>o.projectId))],projects=S.projects.filter(p=>ids.includes(p.id));return`<option value="">所有工地</option>${projects.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${escAttr(p.name)}</option>`).join('')}`;}
function b1fProductsMarkup(){const q=b1fProductSearch.trim().toLowerCase(),items=b1fData().items.filter(item=>!q||[item.name,item.source,item.note].join(' ').toLowerCase().includes(q));return`<div class="b1f-product-toolbar"><input class="b1f-input" value="${escAttr(b1fProductSearch)}" placeholder="搜尋商品名稱、來源或備註" oninput="filterB1FProducts(this.value)"><span>${items.length} 項商品</span></div><div class="b1f-list"><div class="b1f-list-head b1f-product-grid"><span>商品名稱</span><span>來源</span><span>備註</span><span class="b1f-col-center">庫存數量</span><span class="b1f-col-money">單價</span><span class="b1f-col-center">本次數量</span><span class="b1f-col-center">操作</span></div>${items.length?items.map(item=>`<div class="b1f-row b1f-product-grid"><div class="b1f-item-name">${escAttr(item.name)}</div><div class="b1f-cell-muted">${escAttr(item.source||'—')}</div><div class="b1f-cell-muted">${escAttr(item.note||'—')}</div><div class="b1f-item-qty b1f-col-center">${item.stockQty}${escAttr(item.unit)}</div><div class="b1f-col-money">${b1fMoney(item.unitPrice)}</div><div><input class="b1f-row-qty" id="b1f-product-qty-${item.id}" type="number" min="1" max="${item.stockQty}" step="any" value="1" ${item.stockQty>0?'':'disabled'} aria-label="${escAttr(item.name)} 本次數量"></div><div class="b1f-actions"><button class="btn btn-sm btn-p" ${item.stockQty>0?'':'disabled'} onclick="addB1FToCart('${item.id}')">加入購物車</button>${b1fCanDispose()?`<button class="btn btn-sm btn-danger" ${item.stockQty>0?'':'disabled'} onclick="showB1FInventoryDispose('${item.id}')">報廢</button>`:''}</div></div>`).join(''):'<div class="b1f-empty">找不到符合的商品。</div>'}</div>`;}
function b1fEntryMarkupV3(){return`<div class="card" style="max-width:700px"><div class="card-hdr"><span class="card-title">新增商品</span></div><div class="b1f-form"><label class="b1f-field">商品名稱<input id="b1f-entry-name" placeholder="輸入商品名稱"></label><label class="b1f-field">數量<input id="b1f-entry-qty" type="number" min="0.01" step="any" placeholder="輸入數量"></label><label class="b1f-field">單位<input id="b1f-entry-unit" placeholder="例如：個、條、支" value="個"></label><label class="b1f-field">單價<input id="b1f-entry-price" type="number" min="0" step="any" placeholder="0 元商品請填 0"></label><label class="b1f-field">來源<input id="b1f-entry-source" placeholder="自由輸入來源"></label><label class="b1f-field">備註<textarea id="b1f-entry-note" placeholder="備註（選填）"></textarea></label><button class="btn btn-p" onclick="saveB1FEntry()">確認新增商品</button></div></div>`;}
function b1fCartMarkup(){const lines=b1fCartLines(),total=lines.reduce((sum,{line,item})=>sum+line.qty*item.unitPrice,0);return`<div class="b1f-workflow"><label class="b1f-field b1f-workflow-head">使用工地／案件<select id="b1f-cart-project" onchange="setB1FCartProject(this.value)">${b1fProjectOptions(b1fCartProjectId)}</select></label>${lines.length?`<div class="b1f-list"><div class="b1f-list-head b1f-cart-grid"><span>商品</span><span class="b1f-col-center">庫存</span><span class="b1f-col-center">數量</span><span class="b1f-col-money">單價</span><span class="b1f-col-money">小計</span><span class="b1f-col-center">操作</span></div>${lines.map(({line,item})=>`<div class="b1f-row b1f-cart-grid"><div class="b1f-item-name">${escAttr(item.name)}</div><div class="b1f-item-qty b1f-col-center">${item.stockQty}${escAttr(item.unit)}</div><div class="b1f-stepper"><button aria-label="減少 ${escAttr(item.name)}" onclick="changeB1FCartQty('${item.id}',-1)">−</button><input type="number" min="1" max="${item.stockQty}" value="${line.qty}" aria-label="${escAttr(item.name)} 購物車數量" onchange="setB1FCartQty('${item.id}',this.value)"><button aria-label="增加 ${escAttr(item.name)}" onclick="changeB1FCartQty('${item.id}',1)">＋</button><span>${escAttr(item.unit)}</span></div><div class="b1f-col-money">${b1fMoney(item.unitPrice)}</div><div class="b1f-col-money">${b1fMoney(line.qty*item.unitPrice)}</div><div class="b1f-actions"><button class="btn btn-sm" onclick="removeB1FCartItem('${item.id}')">刪除</button></div></div>`).join('')}</div><div class="b1f-summary"><div class="b1f-summary-row b1f-summary-total"><span>本次總金額</span><span>${b1fMoney(total)}</span></div></div><button class="btn btn-p" style="max-width:220px" onclick="confirmB1FCart()">確認領用</button>`:'<div class="b1f-empty">購物車目前沒有商品。請先到「商品」頁加入需要的項目。</div>'}</div>`;}
function b1fReturnMarkupV3(){const records=b1fReturnProjectId?b1fOpenUsages().filter(r=>r.projectId===b1fReturnProjectId):[];return`<div class="b1f-workflow"><label class="b1f-field b1f-workflow-head">退貨工地／案件<select onchange="setB1FReturnProject(this.value)">${b1fProjectOptions(b1fReturnProjectId,true)}</select></label>${b1fReturnProjectId?`<div class="b1f-return-head"><span>選取</span><span>商品／目前待結案</span><span>單價</span><span>退款</span><span>本次退貨數量</span></div><div class="b1f-pick-list">${records.map(r=>`<div class="b1f-pick-row"><input class="b1f-return-check" type="checkbox" data-id="${r.id}" onchange="b1fTogglePick(this,'return');b1fUpdateReturnSummary()"><div class="b1f-return-item"><strong>${escAttr(r.itemName)}</strong><span class="b1f-cell-muted">目前待結案 ${r.inUseQty}${escAttr(r.unit)}</span></div><div class="b1f-pick-price b1f-col-money">${b1fMoney(r.unitPrice)}</div><div class="b1f-pick-price"><span id="b1f-return-sub-${r.id}">$0</span></div><label class="b1f-pick-qty"><input id="b1f-return-qty-${r.id}" type="number" min="0" max="${r.inUseQty}" step="any" value="0" disabled oninput="b1fUpdateReturnSummary()" aria-label="${escAttr(r.itemName)} 本次退貨數量"></label></div>`).join('')||'<div class="b1f-empty">此案件目前沒有待結案商品。</div>'}</div><div class="b1f-summary" id="b1f-return-summary"><div class="b1f-cell-muted">勾選商品並輸入退貨數量後，這裡會顯示退款摘要。</div></div><button class="btn btn-p" style="max-width:220px" onclick="confirmB1FReturn()">確認退貨</button>`:'<div class="b1f-empty">請先選擇有待結案商品的施工中案件。</div>'}</div>`;}
function b1fPendingMarkup(){const records=b1fOpenUsages(),groups=[...new Set(records.map(r=>r.projectId))];if(!groups.length)return'<div class="b1f-empty">目前沒有待結案的 B1F 商品。</div>';return groups.map(pid=>{const rows=records.filter(r=>r.projectId===pid),project=S.projects.find(p=>p.id===pid);return`<section class="b1f-project-group"><div class="b1f-project-title">${escAttr(project?.name||rows[0].projectName||'未知案件')}</div>${rows.map(r=>`<div class="b1f-pending-row"><input class="b1f-used-check" type="checkbox" data-project="${pid}" data-id="${r.id}" aria-label="選取 ${escAttr(r.itemName)} 使用完畢"><div class="b1f-item-name">${escAttr(r.itemName)}</div><div class="b1f-item-qty">${r.inUseQty}${escAttr(r.unit)}</div><div class="b1f-col-money">${b1fMoney(r.unitPrice)}</div><div class="b1f-use-meta b1f-cell-muted">原始計價 ${b1fMoney(r.chargeAmount)}｜已退款 ${b1fMoney(r.refundedAmount)}</div><div class="b1f-actions"><button class="btn btn-sm" onclick="openB1FReturnFor('${r.projectId}')">退貨</button>${b1fCanDispose()?`<button class="btn btn-sm btn-danger" onclick="showB1FUsageAction('${r.id}','disposed')">報廢</button>`:''}</div></div>`).join('')}<div class="b1f-group-actions"><button class="btn btn-sm btn-p" onclick="bulkB1FUseFinished('${pid}')">使用完畢（已選）</button></div></section>`;}).join('');}
function b1fOrderNo(){const day=new Date().toISOString().slice(0,10).replaceAll('-',''),count=b1fData().orders.filter(o=>String(o.orderNo||'').startsWith(`B1F-${day}-`)).length+1;return`B1F-${day}-${String(count).padStart(3,'0')}`;}
function b1fOrderMarkup(){let orders=b1fData().orders.slice().reverse();if(b1fOrderProjectId)orders=orders.filter(order=>order.projectId===b1fOrderProjectId);const totals=orders.reduce((sum,order)=>{const rows=(order.usageIds||[]).map(b1fUsage).filter(Boolean);sum.charge+=rows.reduce((n,r)=>n+(Number(r.chargeAmount)||0),0);sum.refund+=rows.reduce((n,r)=>n+(Number(r.refundedAmount)||0),0);return sum;},{charge:0,refund:0});return`<div class="b1f-order-filter"><label>工地篩選<select onchange="setB1FOrderProject(this.value)">${b1fOrderProjectOptions(b1fOrderProjectId)}</select></label></div><div class="b1f-order-totals"><span>原始領用總額 ${b1fMoney(totals.charge)}</span><span>退貨退款總額 −${b1fMoney(totals.refund)}</span><strong>最終消費總額 ${b1fMoney(totals.charge-totals.refund)}</strong></div>${orders.length?orders.map(order=>{const rows=(order.usageIds||[]).map(b1fUsage).filter(Boolean),charge=rows.reduce((n,r)=>n+r.chargeAmount,0),refund=rows.reduce((n,r)=>n+r.refundedAmount,0);return`<article class="b1f-order-card"><div class="b1f-order-head"><strong>${escAttr(order.orderNo)}</strong><span>${escAttr(order.projectName||'—')}｜${b1fDateTime(order.createdAt)}</span></div><div class="b1f-order-meta">領用人：${escAttr(order.actorName||'—')}｜原始計價 ${b1fMoney(charge)}｜退貨退款 −${b1fMoney(refund)}｜<strong>最終消費 ${b1fMoney(charge-refund)}</strong></div>${rows.map(r=>`<div class="b1f-order-line"><span>${escAttr(r.itemName)}｜領用${r.issuedQty}${escAttr(r.unit)}${r.returnedQty?`｜退貨${r.returnedQty}${escAttr(r.unit)}`:''}${r.usedQty?`｜使用完畢${r.usedQty}${escAttr(r.unit)}`:''}${r.disposedQty?`｜報廢${r.disposedQty}${escAttr(r.unit)}`:''}</span><strong>${r.unitPrice>0?b1fMoney(r.chargeAmount-r.refundedAmount):'0 元'}</strong></div>`).join('')}</article>`;}).join(''):'<div class="b1f-empty">尚無符合條件的訂單。</div>'}`;}
function b1fLogMarkup(){let logs=b1fData().logs.slice().reverse();if(b1fHistoryFilter!=='all'){if(b1fHistoryFilter==='disposed')logs=logs.filter(x=>['disposed','inventory_disposed'].includes(x.type));else logs=logs.filter(x=>x.type===b1fHistoryFilter);}return`<div class="seg" style="width:max-content;margin-bottom:10px">${[['all','全部'],['entry','新增商品'],['issue','確認領用'],['return','退貨'],['used','使用完畢'],['disposed','報廢']].map(([id,label])=>`<button class="${b1fHistoryFilter===id?'on':''}" onclick="setB1FHistoryFilter('${id}')">${label}</button>`).join('')}</div><div class="b1f-list"><div class="b1f-list-head b1f-history-grid"><span>日期</span><span>類型</span><span>商品</span><span class="b1f-col-center">數量</span><span>案件／來源</span><span class="b1f-col-money">金額</span></div>${logs.length?logs.map(x=>`<div class="b1f-row b1f-history-grid"><div class="b1f-cell-muted">${b1fDateTime(x.createdAt)}</div><div>${b1fTypeLabel(x.type)}</div><div class="b1f-item-name">${escAttr(x.itemName||'—')}</div><div class="b1f-col-center">${x.quantity??'—'}${x.unit?escAttr(x.unit):''}</div><div class="b1f-cell-muted">${escAttr(x.projectName||x.source||'B1F')}</div><div class="b1f-col-money">${x.amount==null?'—':b1fMoney(x.amount)}</div></div>`).join(''):'<div class="b1f-empty">尚無異動紀錄。</div>'}</div>`;}
function b1fHistoryMarkupV3(){return`<div class="seg b1f-history-tabs"><button class="${b1fHistoryTab==='orders'?'on':''}" onclick="setB1FHistoryTab('orders')">訂單</button><button class="${b1fHistoryTab==='logs'?'on':''}" onclick="setB1FHistoryTab('logs')">異動紀錄</button></div>${b1fHistoryTab==='orders'?b1fOrderMarkup():b1fLogMarkup()}`;}
function renderB1FV3(){const el=$('panel-b1f');if(!el)return;const cartLabel=`購物車${b1fCartCount()?` ${b1fCartCount()}`:''}`,tabs=[['entry','新增商品'],['products','商品'],['cart',cartLabel],['return','退貨'],['pending','待結案'],['history','紀錄']],views={entry:b1fEntryMarkup,products:b1fProductsMarkup,cart:b1fCartMarkup,return:b1fReturnMarkup,pending:b1fPendingMarkup,history:b1fHistoryMarkup};el.innerHTML=`<div class="b1f-shell"><div class="b1f-head"><div><h1>🛒 B1F 商城</h1><p>工程剩料、可再利用商品與常備五金；計價只記錄在 B1F 與工地使用紀錄。</p></div><div class="b1f-tabs">${tabs.map(([id,label])=>`<button class="${b1fView===id?'active':''}" onclick="setB1FView('${id}')">${label}</button>`).join('')}</div></div>${b1fFlash?`<div class="b1f-summary" style="margin-bottom:12px">${escAttr(b1fFlash)}</div>`:''}${views[b1fView]()}</div>`;b1fFlash='';}

window.confirmB1FCart=function(){const project=S.projects.find(p=>p.id===$('b1f-cart-project')?.value);const lines=b1fCartLines();if(!project)return alert('請選擇施工中案件。');if(!lines.length)return alert('購物車目前沒有商品。');const shortage=lines.find(({line,item})=>!Number.isFinite(line.qty)||line.qty<=0||line.qty>item.stockQty);if(shortage)return alert(`${shortage.item.name} 目前庫存不足，請調整數量後再確認。`);const batchId=b1fId('batch'),now=b1fNow(),order={id:b1fId('order'),batchId,orderNo:b1fOrderNo(),projectId:project.id,projectName:project.name,createdAt:now,actorId:currentUser?.uid||'',actorName:currentUser?.displayName||'',usageIds:[]};lines.forEach(({line,item})=>{item.stockQty-=line.qty;const amount=line.qty*item.unitPrice,record={id:b1fId('usage'),batchId,orderId:order.id,orderNo:order.orderNo,itemId:item.id,itemName:item.name,unit:item.unit,unitPrice:item.unitPrice,projectId:project.id,projectName:project.name,issuedQty:line.qty,inUseQty:line.qty,returnedQty:0,usedQty:0,disposedQty:0,chargeAmount:amount,refundedAmount:0,status:'pending',issuedAt:now};b1fData().usages.push(record);order.usageIds.push(record.id);b1fLog('issue',{batchId,orderId:order.id,usageId:record.id,itemId:item.id,itemName:item.name,quantity:line.qty,unit:item.unit,projectId:project.id,projectName:project.name,amount});if(amount>0)b1fLog('charge',{batchId,orderId:order.id,usageId:record.id,itemId:item.id,itemName:item.name,quantity:line.qty,unit:item.unit,projectId:project.id,projectName:project.name,amount});});b1fData().orders.push(order);b1fData().carts[currentUser?.uid||'local']=[];b1fSave();b1fFlash=`訂單 ${order.orderNo} 已完成｜本次總金額 ${b1fMoney(lines.reduce((n,x)=>n+x.line.qty*x.item.unitPrice,0))}`;b1fView='pending';renderB1F();};
window.setB1FReturnProject=function(projectId){b1fReturnProjectId=projectId;renderB1F();};
window.confirmB1FReturn=function(){const lines=[];document.querySelectorAll('.b1f-return-check:checked').forEach(box=>{const record=b1fUsage(box.dataset.id),qty=Number($(`b1f-return-qty-${record.id}`).value);lines.push({record,qty});});if(!lines.length)return alert('請至少勾選一項退貨商品。');if(lines.some(x=>!Number.isFinite(x.qty)||x.qty<=0||x.qty>x.record.inUseQty))return alert('每項退貨數量必須大於 0，且不得超過目前待結案數量。');lines.forEach(({record,qty})=>{const item=b1fItem(record.itemId),refund=qty*record.unitPrice;record.inUseQty-=qty;record.returnedQty+=qty;record.refundedAmount+=refund;record.status=record.inUseQty>0?'pending':'closed';item.stockQty+=qty;b1fLog('return',{orderId:record.orderId,usageId:record.id,itemId:item.id,itemName:item.name,quantity:qty,unit:item.unit,projectId:record.projectId,projectName:record.projectName,amount:refund});if(refund>0)b1fLog('refund',{orderId:record.orderId,usageId:record.id,itemId:item.id,itemName:item.name,quantity:qty,unit:item.unit,projectId:record.projectId,projectName:record.projectName,amount:refund});});b1fSave();b1fFlash=`退貨完成｜本次退款總額 ${b1fMoney(lines.reduce((n,x)=>n+x.qty*x.record.unitPrice,0))}`;b1fView='pending';renderB1F();};

function normalizeHomeModule(raw,index){

function homeSizeTier(m){const area=m.w*m.h;return area<=6?'small':area<=15?'medium':'large';}
function homeCellsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function homeCanPlace(item,placed){return item.x>=0&&item.x+item.w<=HOME_COLS&&item.y>=0&&!placed.some(other=>homeCellsOverlap(item,other));}
function homeFindSpace(item,placed,startY){
  for(let y=Math.max(0,startY||0);y<200;y++)for(let x=0;x<=HOME_COLS-item.w;x++){const candidate={...item,x,y};if(homeCanPlace(candidate,placed))return candidate;}
  return{...item,x:0,y:0};

function homeReflow(modules,targetId,targetRect){
  const target=modules.find(m=>m.id===targetId);if(!target)return modules;
  const first={...target,...targetRect,x:Math.max(0,Math.min(HOME_COLS-targetRect.w,targetRect.x)),y:Math.max(0,targetRect.y)};
  const placed=[first];
  modules.filter(m=>m.id!==targetId).sort((a,b)=>a.y-b.y||a.x-b.x).forEach(m=>{placed.push(homeCanPlace(m,placed)?{...m}:homeFindSpace(m,placed,m.y));});
  return placed;
}
function homePack(modules){

let growthManagerTab='active';
function growthProjectIds(item){return [...new Set((Array.isArray(item?.projectIds)?item.projectIds:[]).map(String).filter(Boolean))];}

function growthIsComplete(item){return growthCount(item)>=3;}

function growthDate(value){if(!value)return'';const date=value?.toDate?value.toDate():new Date(value);return Number.isNaN(date.getTime())?'':date.toLocaleDateString('zh-TW');}

window.saveGrowthItem=async function(id){const name=$('growth-name').value.trim(),rawUrl=$('growth-url').value.trim(),rawUrl2=$('growth-url-2').value.trim();if(!name)return alert('請輸入項目名稱。');if(rawUrl&&!growthSafeUrl(rawUrl))return alert('參考連結 1 格式不正確。');if(rawUrl2&&!growthSafeUrl(rawUrl2))return alert('參考連結 2 格式不正確。');const old=id?S.growthItems.find(x=>x.id===id):null,stamp=growthStamp(),data={name,url:rawUrl,url2:rawUrl2,updatedBy:currentUser.uid,updatedAt:stamp};if(old){await updateDoc(doc(db,'growthItems',id),data);if(!localTestMode)Object.assign(old,data);}else{const created={...data,projectIds:[],createdBy:currentUser.uid,createdAt:stamp,completedAt:null},ref=await addDoc(collection(db,'growthItems'),created);if(!localTestMode)S.growthItems.push({id:ref.id,...created});}if(localTestMode){closeMo();renderHome();}else{showAllGrowthItems();renderHome();}}
window.showGrowthUseForm=function(id){const item=S.growthItems.find(x=>x.id===id);if(!item)return;const used=new Set(growthProjectIds(item)),projects=S.projects.filter(p=>!used.has(String(p.id))).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'zh-TW'));$('mo-content').className='mo-box growth-modal';$('mo-content').innerHTML=`<div class="mo-title">新增使用紀錄</div><div class="mo-sub">${escAttr(item.name)}　目前 ${Math.min(used.size,3)} / 3</div><div class="growth-form"><select id="growth-project"><option value="">請選擇案件／工地</option>${projects.map(p=>`<option value="${escAttr(p.id)}">${escAttr(p.name)}</option>`).join('')}</select></div>${projects.length?'':'<div class="empty">目前沒有其他可選擇的案件</div>'}<div class="mo-footer"><button class="btn" onclick="closeMo()">取消</button><button class="btn btn-p" ${projects.length?'':'disabled'} onclick="addGrowthUsage('${escAttr(id)}')">確認使用</button></div>`;$('modal').style.display='flex';}
window.addGrowthUsage=async function(id){const item=S.growthItems.find(x=>x.id===id),projectId=$('growth-project')?.value;if(!item||!projectId)return alert('請選擇案件／工地。');const ids=growthProjectIds(item);if(ids.includes(projectId))return alert('同一個案件只能計算一次。');ids.push(projectId);const patch={projectIds:ids,completedAt:ids.length>=3?(item.completedAt||growthStamp()):null,updatedBy:currentUser.uid,updatedAt:growthStamp()};await updateDoc(doc(db,'growthItems',id),patch);if(!localTestMode)Object.assign(item,patch);closeMo();renderHome();}
