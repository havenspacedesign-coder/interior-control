// ── Shared recommendations ──
let recommendationRegionFilter='all',recommendationCategoryFilter='all',recommendationImageData='';
function recommendationTime(value){if(!value)return 0;if(typeof value?.toMillis==='function')return value.toMillis();if(typeof value?.seconds==='number')return value.seconds*1000;const parsed=new Date(value).getTime();return Number.isFinite(parsed)?parsed:0;}
function sortedRecommendations(){return S.recommendations.slice().sort((a,b)=>recommendationTime(b.createdAt)-recommendationTime(a.createdAt));}
function sortedRecommendationCategories(includeDisabled=true){return S.recommendationCategories.filter(c=>includeDisabled||c.enabled!==false).slice().sort((a,b)=>(Number(a.sortOrder)||0)-(Number(b.sortOrder)||0)||(a.name||'').localeCompare(b.name||'','zh-Hant'));}
function sortedRecommendationRegions(includeDisabled=true){return S.recommendationRegions.filter(r=>includeDisabled||r.enabled!==false).slice().sort((a,b)=>(Number(a.sortOrder)||0)-(Number(b.sortOrder)||0)||(a.name||'').localeCompare(b.name||'','zh-Hant'));}
function recommendationRegions(){return sortedRecommendationRegions(false);}
function recommendationCategory(id){return S.recommendationCategories.find(c=>c.id===id);}
function recommendationRegion(id){return S.recommendationRegions.find(r=>r.id===id);}
function recommendationLabels(item){return{region:item.regionId?(recommendationRegion(item.regionId)?.name||'未知地區'):'尚未分類',category:item.categoryId?(recommendationCategory(item.categoryId)?.name||'未知類別'):'尚未分類'};}
function recommendationCanEdit(item){return isAdmin()||item.authorUid===currentUser?.uid;}
function safeRecommendationUrl(value){try{const url=new URL(String(value||'').trim());return ['http:','https:'].includes(url.protocol)?url.href:'';}catch{return'';}}
function renderRecommendationTags(item){const labels=recommendationLabels(item);return`<div class="recommend-tags"><span class="recommend-tag region">${escAttr(labels.region)}</span><span class="recommend-tag category">${escAttr(labels.category)}</span></div>`;}
function renderRecommendationHomeTags(item){const region=item.regionId?recommendationRegion(item.regionId):null,category=item.categoryId?recommendationCategory(item.categoryId):null;return`<span class="recommend-preview-tags">${region?`<span class="recommend-tag region">${escAttr(region.name)}</span>`:''}${category?`<span class="recommend-tag category">${escAttr(category.name)}</span>`:''}</span>`;}
function renderRecommendationModule(){const items=sortedRecommendations();return`<div class="recommend-preview"><div class="recommend-preview-list">${items.length?items.map(item=>`<button type="button" class="recommend-preview-row" onclick="event.stopPropagation();showRecommendationDetail('${item.id}')"><span class="recommend-preview-title">${escAttr(item.title||'未命名推薦')}</span>${renderRecommendationHomeTags(item)}</button>`).join(''):'<div class="daily-joke-empty">目前還沒有推薦</div>'}</div><div class="recommend-preview-actions"><button class="btn" onclick="event.stopPropagation();showRecommendationForm()">＋新增</button><button class="btn btn-p" onclick="event.stopPropagation();showAllRecommendations()">查看全部</button></div></div>`;}
function recommendationFilterOptions(){const regions=recommendationRegions(),categories=sortedRecommendationCategories(false);return{regions,categories};}
function filteredRecommendations(){return sortedRecommendations().filter(item=>(recommendationRegionFilter==='all'||item.regionId===recommendationRegionFilter)&&(recommendationCategoryFilter==='all'||item.categoryId===recommendationCategoryFilter));}
function renderRecommendationCard(item){const url=safeRecommendationUrl(item.url),canEdit=recommendationCanEdit(item);return`<article class="recommend-card">${item.imageUrl?`<img class="recommend-image" src="${escAttr(item.imageUrl)}" alt="${escAttr(item.title||'推薦圖片')}">`:'<div class="recommend-image empty">✦</div>'}<div class="recommend-card-body"><div class="recommend-title">${escAttr(item.title||'未命名推薦')}</div>${renderRecommendationTags(item)}<div class="recommend-description">${escAttr(item.description||'')}</div><div class="recommend-meta">分享者：${escAttr(item.authorName||'同事')}</div><div class="recommend-card-actions">${url?`<button class="btn btn-sm" onclick="openRecommendationUrl('${escAttr(url)}')">開啟網址</button>`:''}${canEdit?`<button class="btn btn-sm" onclick="showRecommendationForm('${item.id}')">編輯</button>`:''}${isAdmin()?`<button class="btn btn-sm btn-danger" onclick="deleteRecommendation('${item.id}')">刪除</button>`:''}</div></div></article>`;}
function recommendationDateText(item){const ms=recommendationTime(item.createdAt);return ms?new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ms)):'';}
window.showRecommendationDetail=function(id){const item=S.recommendations.find(x=>x.id===id);if(!item)return;const url=safeRecommendationUrl(item.url),canEdit=recommendationCanEdit(item),dateText=recommendationDateText(item);$('mo-content').classList.remove('module-manager-modal','recommend-modal');$('mo-content').innerHTML=`<div class="mo-title">${escAttr(item.title||'未命名推薦')}</div>${renderRecommendationTags(item)}${item.imageUrl?`<img class="recommend-detail-image" src="${escAttr(item.imageUrl)}" alt="${escAttr(item.title||'推薦圖片')}">`:''}<div class="recommend-description" style="margin-top:12px">${escAttr(item.description||'')}</div><div class="recommend-meta" style="margin-top:12px">分享者：${escAttr(item.authorName||'同事')}${dateText?`　新增時間：${escAttr(dateText)}`:''}</div><div class="mo-footer">${url?`<button class="btn" onclick="openRecommendationUrl('${escAttr(url)}')">開啟網址</button>`:''}${canEdit?`<button class="btn" onclick="showRecommendationForm('${item.id}')">編輯</button>`:''}<button class="btn btn-p" onclick="closeMo()">關閉</button></div>`;$('modal').style.display='flex';};
window.showAllRecommendations=function(){const options=recommendationFilterOptions(),items=filteredRecommendations();$('mo-content').classList.remove('module-manager-modal');$('mo-content').classList.add('recommend-modal');$('mo-content').innerHTML=`<div class="mo-title">推薦分享</div><div class="recommend-toolbar"><select aria-label="地區篩選" onchange="setRecommendationRegionFilter(this.value)"><option value="all">全部地區</option>${options.regions.map(r=>`<option value="${r.id}" ${recommendationRegionFilter===r.id?'selected':''}>${escAttr(r.name)}</option>`).join('')}</select><select aria-label="類別篩選" onchange="setRecommendationCategoryFilter(this.value)"><option value="all">全部類別</option>${options.categories.map(c=>`<option value="${c.id}" ${recommendationCategoryFilter===c.id?'selected':''}>${escAttr(c.name)}</option>`).join('')}</select><button class="btn btn-p" onclick="showRecommendationForm()">＋新增推薦</button>${isAdmin()?'<button class="btn" onclick="showRecommendationCategoryManager()">管理設定</button>':''}</div><div class="recommend-grid">${items.length?items.map(renderRecommendationCard).join(''):'<div class="empty" style="grid-column:1/-1">沒有符合目前篩選條件的推薦</div>'}</div><div class="mo-footer"><button class="btn" onclick="closeMo()">關閉</button></div>`;$('modal').style.display='flex';}
window.setRecommendationRegionFilter=function(value){recommendationRegionFilter=value;showAllRecommendations();};
window.setRecommendationCategoryFilter=function(value){recommendationCategoryFilter=value;showAllRecommendations();};
window.openRecommendationUrl=function(value){const url=safeRecommendationUrl(value);if(url)window.open(url,'_blank','noopener');};
window.showRecommendationForm=function(id){const item=id?S.recommendations.find(x=>x.id===id):null;if(item&&!recommendationCanEdit(item))return;const activeRegions=recommendationRegions(),currentRegion=recommendationRegion(item?.regionId),regions=currentRegion&&currentRegion.enabled===false?[...activeRegions,currentRegion]:activeRegions,activeCategories=sortedRecommendationCategories(false),currentCategory=recommendationCategory(item?.categoryId),categories=currentCategory&&currentCategory.enabled===false?[...activeCategories,currentCategory]:activeCategories;recommendationImageData=item?.imageUrl||'';$('mo-content').classList.remove('module-manager-modal','recommend-modal');$('mo-content').innerHTML=`<div class="mo-title">${item?'編輯推薦':'新增推薦'}</div>${!regions.length?'<div class="mo-sub" style="color:var(--red)">目前尚無啟用中的地區，請先請管理員或主管至「管理設定」新增。</div>':''}<div class="recommend-form-grid" style="margin-top:12px"><input class="full" id="recommend-title" maxlength="80" placeholder="推薦名稱*" value="${escAttr(item?.title||'')}"><textarea class="full" id="recommend-description" rows="4" maxlength="500" placeholder="簡短介紹*">${escAttr(item?.description||'')}</textarea><select id="recommend-region"><option value="">選擇地區*</option>${regions.map(r=>`<option value="${r.id}" ${item?.regionId===r.id?'selected':''} ${r.enabled===false?'disabled':''}>${escAttr(r.name)}${r.enabled===false?'（已停用）':''}</option>`).join('')}</select><select id="recommend-category"><option value="">選擇類別*</option>${categories.map(c=>`<option value="${c.id}" ${item?.categoryId===c.id?'selected':''} ${c.enabled===false?'disabled':''}>${escAttr(c.name)}${c.enabled===false?'（已停用）':''}</option>`).join('')}</select><input class="full" id="recommend-url" inputmode="url" placeholder="網址（選填，https://…）" value="${escAttr(item?.url||'')}"><label class="full" style="font-size:12px;color:var(--text2)">圖片（選填，JPG／PNG／WebP，最大 5MB）<input id="recommend-image" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewRecommendationImage(this.files[0])"></label><div class="full" id="recommend-image-wrap">${recommendationImageData?`<img class="recommend-image-preview" src="${escAttr(recommendationImageData)}" alt="圖片預覽"><button class="btn btn-sm" style="margin-top:5px" onclick="removeRecommendationImage()">移除圖片</button>`:''}</div></div><div class="mo-footer"><button class="btn" onclick="showAllRecommendations()">取消</button><button class="btn btn-p" onclick="saveRecommendation(${item?`'${item.id}'`:'null'})">儲存</button></div>`;$('modal').style.display='flex';}
window.previewRecommendationImage=async function(file){if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){$('recommend-image').value='';return alert('請選擇 5MB 以下的 JPG、PNG 或 WebP 圖片。');}recommendationImageData=localTestMode?await fileAsDataUrl(file):'';$('recommend-image-wrap').innerHTML=localTestMode?`<img class="recommend-image-preview" src="${recommendationImageData}" alt="圖片預覽"><button class="btn btn-sm" style="margin-top:5px" onclick="removeRecommendationImage()">移除圖片</button>`:'<div style="font-size:11px;color:var(--text3)">已選擇圖片，儲存後上傳。</div>';};
window.removeRecommendationImage=function(){recommendationImageData='';const input=$('recommend-image');if(input)input.value='';$('recommend-image-wrap').innerHTML='';};
window.saveRecommendation=async function(id){const old=id?S.recommendations.find(x=>x.id===id):null;if(old&&!recommendationCanEdit(old))return;const title=$('recommend-title').value.trim(),description=$('recommend-description').value.trim(),regionId=$('recommend-region').value,categoryId=$('recommend-category').value,rawUrl=$('recommend-url').value.trim(),url=rawUrl?safeRecommendationUrl(rawUrl):'';if(!title||!description||!regionId||!categoryId)return alert('請填寫名稱、簡短介紹、地區與類別。');if(rawUrl&&!url)return alert('網址格式不正確，請輸入 http:// 或 https:// 開頭的網址。');const region=recommendationRegion(regionId),category=recommendationCategory(categoryId);if(!region||region.enabled===false)return alert('此地區目前未啟用，請改選其他地區。');if(!category||category.enabled===false)return alert('此類別目前未啟用，請改選其他類別。');let imageUrl=recommendationImageData||old?.imageUrl||'',imagePath=old?.imagePath||'';const file=$('recommend-image')?.files?.[0];try{if(file&&!localTestMode){imagePath=`recommendations/${currentUser.uid}/${Date.now()}-${safePhotoFileName(file.name)}`;const imageRef=storageRef(storage,imagePath);await uploadBytes(imageRef,file);imageUrl=await getDownloadURL(imageRef);}const stamp=localTestMode?new Date().toISOString():serverTimestamp(),data={title,description,url,imageUrl,imagePath,regionId,categoryId,authorUid:old?.authorUid||currentUser.uid,authorName:old?.authorName||currentUser.displayName||currentUser.email||'同事',updatedBy:currentUser.uid,updatedAt:stamp};if(id)await updateDoc(doc(db,'recommendations',id),data);else await addDoc(collection(db,'recommendations'),{...data,createdAt:stamp});showAllRecommendations();if(activePanel==='home')renderHome();}catch(error){console.error('recommendation save failed',error);alert('推薦暫時無法儲存，請確認連線及圖片權限後再試。');}};
window.deleteRecommendation=async function(id){if(!isAdmin())return;const item=S.recommendations.find(x=>x.id===id);if(!item||!confirm(`確定刪除「${item.title||'這則推薦'}」？`))return;await deleteDoc(doc(db,'recommendations',id));showAllRecommendations();};
function normalizeRecommendationName(value){return String(value||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('zh-Hant');}
function renderRecommendationSettingRows(type,items){const field=type==='region'?'regionId':'categoryId',move=type==='region'?'moveRecommendationRegion':'moveRecommendationCategory',toggle=type==='region'?'toggleRecommendationRegion':'toggleRecommendationCategory',remove=type==='region'?'deleteRecommendationRegion':'deleteRecommendationCategory';return items.length?items.map((item,index)=>{const used=S.recommendations.filter(r=>r[field]===item.id).length;return`<div class="recommend-category-row ${item.enabled===false?'off':''}"><span>${index+1}</span><span>${escAttr(item.name)} <small style="color:var(--text3)">使用中 ${used}</small></span><button class="btn btn-sm category-secondary" ${index===0?'disabled':''} onclick="${move}('${item.id}',-1)">↑</button><button class="btn btn-sm category-secondary" ${index===items.length-1?'disabled':''} onclick="${move}('${item.id}',1)">↓</button><span style="display:flex;gap:4px"><button class="btn btn-sm" onclick="showRecommendationNameEditor('${type}','${item.id}')">編輯</button><button class="btn btn-sm" onclick="${toggle}('${item.id}')">${item.enabled===false?'啟用':'停用'}</button><button class="btn btn-sm btn-danger" ${used?'disabled':''} onclick="${remove}('${item.id}')">刪除</button></span></div>`;}).join(''):'<div class="empty">尚未新增任何項目</div>';}
window.showRecommendationCategoryManager=function(){if(!isAdmin())return;const regions=sortedRecommendationRegions(true),categories=sortedRecommendationCategories(true);$('mo-content').classList.remove('recommend-modal');$('mo-content').innerHTML=`<div class="mo-title">推薦分享管理設定</div><div class="mo-sub">地區與類別皆為全公司共用；停用後既有推薦仍保留，新建與編輯時不可再選。</div><div style="font-weight:600;margin-top:14px">地區</div><div style="display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:7px"><input id="recommend-region-name" maxlength="30" placeholder="新增地區（例如：不限地區／線上）"><button class="btn btn-p" onclick="addRecommendationRegion()">新增地區</button></div><div style="margin-top:8px">${renderRecommendationSettingRows('region',regions)}</div><div style="font-weight:600;margin-top:18px">類別</div><div style="display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:7px"><input id="recommend-category-name" maxlength="30" placeholder="新增類別名稱"><button class="btn btn-p" onclick="addRecommendationCategory()">新增類別</button></div><div style="margin-top:8px">${renderRecommendationSettingRows('category',categories)}</div><div class="mo-footer"><button class="btn" onclick="showAllRecommendations()">返回推薦</button></div>`;$('modal').style.display='flex';};
window.addRecommendationRegion=async function(){if(!isAdmin())return;const name=$('recommend-region-name').value.trim(),key=normalizeRecommendationName(name);if(!key)return alert('請輸入地區名稱。');if(S.recommendationRegions.some(r=>normalizeRecommendationName(r.name)===key))return alert('已有相同或過於相近的地區名稱。');const regions=sortedRecommendationRegions(true),stamp=localTestMode?new Date().toISOString():serverTimestamp();await addDoc(collection(db,'recommendationRegions'),{name,normalizedName:key,sortOrder:regions.length,enabled:true,createdBy:currentUser.uid,createdAt:stamp,updatedAt:stamp});showRecommendationCategoryManager();};

window.openStickyWall=function(){const cards=homeStickyCards(),mine=S.homeNotes.find(note=>note.uid===currentUser?.uid&&note.status!=='removed'&&note.status!=='disabled'&&note.text);homeNoteDraftBg=mine?.backgroundColor||mine?.color||HOME_NOTE_DEFAULT_BG;homeNoteDraftText=mine?.textColor||HOME_NOTE_DEFAULT_TEXT;$('mo-content').className='mo-box sticky-wall-modal';$('mo-content').innerHTML=`<div class="mo-title">便條紙留言牆</div><div class="mo-sub">這裡只是一面輕鬆的公共便條牆，不作為公告、工作指派或緊急聯絡。</div><div class="sticky-wall-grid">${cards.map(card=>renderStickyNote(card,true)).join('')}</div><div class="sticky-wall-editor" id="sticky-wall-editor" style="background:${escAttr(homeNoteDraftBg)};--sticky-text:${escAttr(homeNoteDraftText)}"><div style="font-weight:600;margin-bottom:6px">${mine?'編輯我的便條':'隨便留點什麼吧～'}</div><textarea id="home-note-text" maxlength="${HOME_NOTE_LIMIT}" placeholder="一句話或一個表情符號都可以" oninput="updateHomeNoteCount()">${escAttr(mine?.text||'')}</textarea><div class="sticky-note-format meeting-color-controls" aria-label="便條紙文字與底色">${homeNoteColorButton('text',homeNoteDraftText)}${homeNoteColorButton('bg',homeNoteDraftBg)}</div><div class="sticky-wall-editor-foot"><span class="sticky-wall-count" id="home-note-count">${(mine?.text||'').length} / ${HOME_NOTE_LIMIT}</span>${mine?'<button class="btn btn-danger" onclick="removeMyHomeNote()">移除</button>':''}<button class="btn btn-p" onclick="saveMyHomeNote()">${mine?'儲存':'貼上'}</button></div></div><div class="mo-footer"><button class="btn" onclick="closeMo()">關閉</button></div>`;$('modal').style.display='flex';}
window.openHomeNoteColorPalette=function(e,kind){e.stopPropagation();closeMeetingColorPalette();const current=kind==='text'?homeNoteDraftText:homeNoteDraftBg,palette=document.createElement('div');palette.id='meeting-color-palette';palette.className='meeting-color-palette';const swatch=color=>`<button type="button" class="meeting-palette-swatch ${current.toLowerCase()===color.toLowerCase()?'selected':''}" style="background:${color}" title="${color}" aria-label="選擇 ${color}" onclick="pickHomeNoteColor('${kind}','${color}')"></button>`;palette.innerHTML=MEETING_COLOR_ROWS.map(row=>`<div class="meeting-palette-grid">${row.map(swatch).join('')}</div>`).join('')+`<div class="meeting-palette-standard">標準</div><div class="meeting-palette-grid">${MEETING_STANDARD_COLORS.map(swatch).join('')}</div><label class="meeting-palette-custom"><span>自訂</span><input type="color" value="${current}" aria-label="自訂顏色" onchange="pickHomeNoteColor('${kind}',this.value)"></label>`;document.body.appendChild(palette);const rect=e.currentTarget.getBoundingClientRect(),pr=palette.getBoundingClientRect();palette.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-pr.width-8))+'px';palette.style.top=Math.max(8,Math.min(rect.bottom+6,window.innerHeight-pr.height-8))+'px';}

// ── Company cleaning duty module ──
function dutyMonthKey(date=new Date()){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;}
function dutyGroupLabel(index){let n=index+1,label='';while(n>0){n--;label=String.fromCharCode(65+n%26)+label;n=Math.floor(n/26);}return label;}
function normalizeCompanyDutyConfig(raw){const groups=Array.isArray(raw?.groups)?raw.groups.map((g,i)=>({id:String(g.id||`group-${i+1}`),weekly:String(g.weekly||''),monthly:String(g.monthly||'')})):[],memberOrder=Array.isArray(raw?.memberOrder)?[...new Set(raw.memberOrder.map(String).filter(Boolean))]:[];return{groups,memberOrder,anchorMonth:/^\d{4}-\d{2}$/.test(raw?.anchorMonth||'')?raw.anchorMonth:dutyMonthKey()};}
function makeLocalCompanyDutyConfig(){return normalizeCompanyDutyConfig({anchorMonth:dutyMonthKey(),memberOrder:S.members.map(m=>m.uid),groups:[{weekly:'B1 地下室＋樓梯',monthly:'展示層板／窗台'},{weekly:'1F 門面＋地面',monthly:'冰箱整理補貨'},{weekly:'會議室＋茶水區',monthly:'公共櫃體整理'}]});}
function dutyEligibleMembers(){return activeMembersList();}
function dutyConfigMembers(config=companyDutyConfig){return config.memberOrder.map(uid=>S.members.find(m=>String(m.uid||m.id)===uid)).filter(Boolean);}
function dutyMonthOffset(anchor,current=dutyMonthKey()){const[aY,aM]=String(anchor||current).split('-').map(Number),[cY,cM]=current.split('-').map(Number);return(cY-aY)*12+(cM-aM);}
function companyDutyAssignments(){const config=normalizeCompanyDutyConfig(companyDutyConfig),members=dutyConfigMembers(config),n=config.groups.length;if(!n||members.length!==n)return[];const shift=((dutyMonthOffset(config.anchorMonth)%n)+n)%n;return config.groups.map((group,index)=>({group,label:dutyGroupLabel(index),member:members[(index-shift+n)%n]}));}
function isCompanyDutyFinalWeek(date=new Date()){const lastDay=new Date(date.getFullYear(),date.getMonth()+1,0),lastFriday=new Date(lastDay);lastFriday.setDate(lastDay.getDate()-((lastDay.getDay()+2)%7));const monday=new Date(date);monday.setHours(0,0,0,0);monday.setDate(date.getDate()-((date.getDay()+6)%7));const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);return lastFriday>=monday&&lastFriday<=sunday;}
function renderCompanyDutyModule(){const config=normalizeCompanyDutyConfig(companyDutyConfig),members=dutyConfigMembers(config),assignments=companyDutyAssignments(),countOk=config.groups.length>0&&config.groups.length===members.length,settings=isAdmin()?`<button class="btn btn-sm company-duty-settings-button" onclick="event.stopPropagation();openCompanyDutySettings()">值日設定</button>`:'';if(!countOk)return`<div class="company-duty"><div class="company-duty-top"><span class="company-duty-month">🧹 ${new Date().getMonth()+1} 月公司值日</span>${settings}</div><div class="company-duty-status">⚠️ 工作組 ${config.groups.length} 組｜值日人員 ${members.length} 人<br>數量不一致，請補足設定後再啟用輪替。</div></div>`;return`<div class="company-duty"><div class="company-duty-top"><span class="company-duty-month">🧹 ${new Date().getMonth()+1} 月公司值日</span>${isCompanyDutyFinalWeek()?'<span class="company-duty-alert">本週需完成月底清潔</span>':''}${settings}</div><div class="company-duty-list">${assignments.map(a=>`<div class="company-duty-person"><div class="company-duty-name">${escAttr(memberDisplayName(a.member))} <span style="color:var(--text3);font-weight:400">${a.label} 組</span></div><div class="company-duty-task"><span>每週清潔：</span>${escAttr(a.group.weekly||'尚未設定')}</div><div class="company-duty-task"><span>月底清潔：</span>${escAttr(a.group.monthly||'尚未設定')}</div></div>`).join('')}</div></div>`;}
function renderCompanyDutySettings(){if(!isAdmin()||!companyDutyDraft)return;const config=companyDutyDraft,members=dutyConfigMembers(config),available=dutyEligibleMembers().filter(m=>!config.memberOrder.includes(String(m.uid||m.id))),ok=config.groups.length>0&&config.groups.length===members.length,workRows=config.groups.map((g,i)=>`<div class="duty-work-row"><strong>${dutyGroupLabel(i)}</strong><input value="${escAttr(g.weekly)}" placeholder="每週清潔內容" oninput="updateDutyGroup(${i},'weekly',this.value)"><input value="${escAttr(g.monthly)}" placeholder="每月最後一週清潔內容" oninput="updateDutyGroup(${i},'monthly',this.value)"><div class="duty-row-tools"><button class="btn btn-sm" ${i===0?'disabled':''} onclick="moveDutyGroup(${i},-1)">↑</button><button class="btn btn-sm" ${i===config.groups.length-1?'disabled':''} onclick="moveDutyGroup(${i},1)">↓</button><button class="btn btn-sm btn-danger" onclick="removeDutyGroup(${i})">刪除</button></div></div>`).join(''),memberRows=members.map((m,i)=>`<div class="duty-person-row"><strong>${i+1}</strong><span>${escAttr(memberDisplayName(m))}</span><div class="duty-row-tools"><button class="btn btn-sm" ${i===0?'disabled':''} onclick="moveDutyMember(${i},-1)">↑</button><button class="btn btn-sm" ${i===members.length-1?'disabled':''} onclick="moveDutyMember(${i},1)">↓</button><button class="btn btn-sm btn-danger" onclick="removeDutyMember(${i})">移除</button></div></div>`).join('');$('mo-content').className='mo-box company-duty-settings';$('mo-content').innerHTML=`<div class="mo-title">值日生清潔設定</div><div class="mo-sub">工作組固定，人員依此順序每月往下一組輪替；移除人員只會取消值日安排，不影響成員帳號。</div><div class="duty-count-status ${ok?'ok':'warn'}">工作組 ${config.groups.length} 組｜值日人員 ${members.length} 人　${ok?'✅ 可正常輪替':'⚠️ 數量不一致，補足設定前不會分配'}</div><div class="duty-settings-grid"><section class="duty-setting-card"><div class="duty-setting-head"><span>清潔工作設定</span><button class="btn btn-sm btn-p" onclick="addDutyGroup()">＋ 新增工作組</button></div><div class="duty-setting-body"><div class="duty-work-row head"><span>組別</span><span>每週清潔</span><span>每月最後一週</span><span>操作</span></div>${workRows||'<div class="empty">尚未建立工作組</div>'}</div></section><section class="duty-setting-card"><div class="duty-setting-head"><span>值日人員設定</span></div><div class="duty-setting-body"><div class="duty-person-row head"><span>順序</span><span>人員</span><span>操作</span></div>${memberRows||'<div class="empty">尚未加入值日人員</div>'}</div><div class="duty-person-add"><select id="duty-member-select"><option value="">選擇既有成員</option>${available.map(m=>`<option value="${escAttr(String(m.uid||m.id))}">${escAttr(memberDisplayName(m))}</option>`).join('')}</select><button class="btn btn-sm btn-p" ${available.length?'':'disabled'} onclick="addDutyMember()">加入</button></div></section></div><div class="mo-footer"><button class="btn" onclick="closeMo()">取消</button><button class="btn btn-p" onclick="saveCompanyDutySettings()">儲存設定</button></div>`;$('modal').style.display='flex';}
window.openCompanyDutySettings=function(){if(!isAdmin())return;companyDutyDraft=normalizeCompanyDutyConfig(companyDutyConfig);renderCompanyDutySettings();};window.updateDutyGroup=function(index,field,value){if(companyDutyDraft?.groups[index]&&['weekly','monthly'].includes(field))companyDutyDraft.groups[index][field]=value;};window.addDutyGroup=function(){if(!companyDutyDraft)return;companyDutyDraft.groups.push({id:`group-${Date.now()}`,weekly:'',monthly:''});renderCompanyDutySettings();};window.removeDutyGroup=function(index){if(!companyDutyDraft||!confirm(`確定刪除 ${dutyGroupLabel(index)} 組清潔工作？`))return;companyDutyDraft.groups.splice(index,1);renderCompanyDutySettings();};window.moveDutyGroup=function(index,delta){if(!companyDutyDraft)return;const to=index+delta;if(to<0||to>=companyDutyDraft.groups.length)return;[companyDutyDraft.groups[index],companyDutyDraft.groups[to]]=[companyDutyDraft.groups[to],companyDutyDraft.groups[index]];renderCompanyDutySettings();};window.addDutyMember=function(){const select=$('duty-member-select'),uid=select?.value;if(!companyDutyDraft||!uid||companyDutyDraft.memberOrder.includes(uid))return;companyDutyDraft.memberOrder.push(uid);renderCompanyDutySettings();};window.removeDutyMember=function(index){if(!companyDutyDraft)return;companyDutyDraft.memberOrder.splice(index,1);renderCompanyDutySettings();};window.moveDutyMember=function(index,delta){if(!companyDutyDraft)return;const to=index+delta;if(to<0||to>=companyDutyDraft.memberOrder.length)return;[companyDutyDraft.memberOrder[index],companyDutyDraft.memberOrder[to]]=[companyDutyDraft.memberOrder[to],companyDutyDraft.memberOrder[index]];renderCompanyDutySettings();};window.saveCompanyDutySettings=async function(){if(!isAdmin()||!companyDutyDraft)return;const normalized=normalizeCompanyDutyConfig(companyDutyDraft);try{await setDoc(doc(db,'settings','companyDuty'),{...normalized,updatedBy:currentUser.uid,updatedAt:serverTimestamp()});companyDutyConfig=normalized;companyDutyDraft=null;close async function initTodayNews(){if(todayNewsLoading||todayNews)return;todayNewsLoading=true;try{const response=await fetch('news.json',{cache:'no-store'});if(!response.ok)throw new Error(`news ${response.status}`);const data=await response.json();todayNews={...data,news:Array.isArray(data?.news)?data.news.filter(item=>safeNewsUrl(item?.url)&&safeNewsUrl(item?.imageUrl)):[]};todayNewsSlide=Math.min(todayNewsSlide,Math.max(0,todayNews.news.length-1));}catch(error){console.warn('today news unavailable',error);todayNews={news:[]};}finally{todayNewsLoading=false;if(activePanel==='home')renderHome();}}
function todayNewsUpdateLabel(value){const date=new Date(value);if(Number.isNaN(date.valueOf()))return'每日早晨更新';return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(date)+' 更新';}
function safeNewsUrl(value){try{const url=new URL(String(value||''));return['http:','https:'].includes(url.protocol)?url.href:'';}catch{return'';}}
function renderTodayNewsModule(){if(todayNewsLoading&&!todayNews)return'<div class="today-news-loading">今日新聞載入中…</div>';const items=Array.isArray(todayNews?.news)?todayNews.news:[];if(!items.length)return'<div class="today-news-empty">今日新聞準備中<br><small>每日早晨更新</small></div>';const index=((todayNewsSlide%items.length)+items.length)%items.length,item=items[index],imageUrl=safeNewsUrl(item.imageUrl);return`<div class="today-news"><div class="today-news-updated">${escAttr(todayNewsUpdateLabel(todayNews.updatedAt))} · 每日早晨更新</div><div class="today-news-carousel"><a class="today-news-image-link" href="${escAttr(safeNewsUrl(item.url))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"><img class="today-news-image" src="${escAttr(imageUrl)}" alt="${escAttr(item.title)}"></a><div class="today-news-shade"></div><button class="today-news-arrow prev" aria-label="上一則新聞" onclick="event.stopPropagation();moveTodayNews(-1)">‹</button><button class="today-news-arrow next" aria-label="下一則新聞" onclick="event.stopPropagation();moveTodayNews(1)">›</button><span class="today-news-position">${index+1} / ${items.length}</span><div class="today-news-copy"><span class="today-news-source">${escAttr(item.source)} · ${escAttr(item.category)}</span><span class="today-news-title">${escAttr(item.title)}</span></div><button class="today-news-detail" onclick="event.stopPropagation();showTodayNewsGallery()">詳細資訊</button></div></div>`;}
window.moveTodayNews=function(delta){const count=Array.isArray(todayNews?.news)?todayNews.news.length:0;if(!count)return;todayNewsSlide=(todayNewsSlide+delta+count)%count;renderHome();}
window.showTodayNewsGallery=function(){const items=Array.isArray(todayNews?.news)?todayNews.news:[];$('mo-content').classList.remove('module-manager-modal');$('mo-content').style.maxWidth='860px';$('mo-content').innerHTML=`<div class="mo-title">今日新聞</div><div class="mo-sub">${items.length} 則新聞 · 點擊照片或標題可開啟原文</div><div class="today-news-all-grid">${items.map((item,index)=>`<a class="today-news-all-card" href="${escAttr(safeNewsUrl(item.url))}" target="_blank" rel="noopener noreferrer"><img class="today-news-all-image" src="${escAttr(safeNewsUrl(item.imageUrl))}" alt="${escAttr(item.title)}"><span class="today-news-all-copy"><span class="today-news-all-title">${String(index+1).padStart(2,'0')}　${escAttr(item.title)}</span><span class="today-news-all-meta">${escAttr(item.source)} · ${escAttr(item.category)}</span></span></a>`).join('')}</div><div class="mo-footer"><button class="btn" onclick="closeMo()">關閉</button></div>`;$('modal').style.display='flex';}
function jokeDayKey(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function jokeReactionOptions(){return[{id:'laugh',emoji:'🤣',label:'超好笑'},{id:'cold',emoji:'🥶',label:'好冷'},{id:'bad',emoji:'😑',label:'超難笑'}];}
function jokeCurrentVote(){return currentUser?jokeVotes.find(v=>v.uid===currentUser.uid):null;}
function jokeVoteCount(reaction){return jokeVotes.filter(v=>v.reaction===reaction).length;}
function renderDailyJokeModule(tier){
  if(jokeLoading&&!todayJoke)return'<div class="daily-joke-loading">今日笑話載入中…</div>';
  if(!todayJoke)return`<div class="daily-joke-empty">今日笑話準備中${isSystemAdmin()?'<br><button class="btn btn-sm" style="margin-top:8px" onclick="event.stopPropagation();replaceTodayJoke()">取得一則</button>':''}</div>`;
  const mine=jokeCurrentVote();
  return`<div class="daily-joke"><div class="daily-joke-title">${escAttr(todayJoke.title||'今日笑話')}</div><div class="daily-joke-content">${escAttr(todayJoke.content||'')}</div><div class="daily-joke-reactions">${jokeReactionOptions().map(r=>`<button class="joke-reaction ${mine?.reaction===r.id?'active':''}" onclick="event.stopPropagation();voteDailyJoke('${r.id}')"><span>${r.emoji}</span><span class="joke-reaction-label">${r.label}</span><span class="joke-vote-count" onclick="event.stopPropagation();showJokeVoters('${r.id}')">${jokeVoteCount(r.id)}</span></button>`).join('')}${isSystemAdmin()?`<span class="daily-joke-admin"><button class="btn" onclick="event.stopPropagation();replaceTodayJoke()">換一則</button><button class="btn" onclick="event.stopPropagation();showCustomJokeLibrary()">笑話庫</button></span>`:''}</div></div>`;
}
function pickDifferentJoke(pool){const alternatives=pool.filter(item=>item.content!==todayJoke?.content),choices=alternatives.length?alternatives:pool;return choices[Math.floor(Math.random()*choices.length)];}
function localJokePick(){const pool=customJokes.length?customJokes:LOCAL_JOKE_FALLBACKS,pick=pickDifferentJoke(pool);return{title:pick.title||'今日笑話',content:pick.content,source:customJokes.length?'custom':'local-fallback',sourceRef:pick.id||''};}
async function fetchTianJoke(){
  const response=await fetch('/api/joke',{headers:{accept:'application/json'}});if(!response.ok)throw new Error(`joke api ${response.status}`);
  const data=await response.json();if(!data?.content)throw new Error(data?.message||'joke api empty');return{title:data.title||'今日笑話',content:data.content,source:'tianapi',sourceRef:data.sourceRef||''};
}
async function chooseNewJoke(){
  if(localTestMode)return localJokePick();
  try{return await fetchTianJoke();}catch(error){console.warn('TianAPI unavailable, using shared joke library',error);if(customJokes.length){const pick=pickDifferentJoke(customJokes);return{title:pick.title||'今日笑話',content:pick.content,source:'custom',sourceRef:pick.id};}return{...pickDifferentJoke(LOCAL_JOKE_FALLBACKS),source:'fallback',sourceRef:''};}
}
function makeJokeRecord(joke,reason){const day=jokeDayKey(),id=`joke-${day}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;return{id,day,title:joke.title||'今日笑話',content:joke.content,source:joke.source||'fallback',sourceRef:joke.sourceRef||'',reason,createdBy:currentUser?.uid||'',createdByName:currentUser?.displayName||currentUser?.email||'',createdAt:serverTimestamp()};}
async function ensureTodayJoke(){
  if(jokeLoading||todayJoke)return;jokeLoading=true;if(activePanel==='home')renderHome();
  try{
    const day=jokeDayKey();
    if(localTestMode){const record=makeJokeRecord(localJokePick(),'daily');record.createdAt=new Date().toISOString();todayJoke=record;jokeVotes=[];return;}
    const dailyRef=doc(db,'dailyJokes',day),existing=await getDoc(dailyRef);if(existing.exists())return;
    const chosen=await chooseNewJoke(),record=makeJokeRecord(chosen,'daily'),jokeRef=doc(db,'jokes',record.id);
    await fbRunTransaction(db,async tx=>{const latest=await tx.get(dailyRef);if(latest.exists())return;tx.set(jokeRef,record);tx.set(dailyRef,{day,currentJokeId:record.id,updatedAt:serverTimestamp(),reason:'daily'});});
  }catch(error){console.error('daily joke creation failed',error);}finally{jokeLoading=false;if(activePanel==='home')renderHome();}
}
function subscribeJokeRecord(jokeId){
  if(jokeDocUnsub)jokeDocUnsub();if(jokeVotesUnsub)jokeVotesUnsub();todayJoke=null;jokeVotes=[];
  if(!jokeId){ensureTodayJoke();return;}
  jokeDocUnsub=onSnapshot(doc(db,'jokes',jokeId),snap=>{todayJoke=snap.exists()?{id:snap.id,...snap.data()}:null;if(activePanel==='home')renderHome();});
  jokeVotesUnsub=onSnapshot(query(collection(db,'jokeVotes'),where('jokeId','==',jokeId)),snap=>{jokeVotes=snap.docs.map(d=>({id:d.id,...d.data()}));if(activePanel==='home')renderHome();});
}
function initDailyJoke(){
  if(localTestMode){if(!todayJoke)ensureTodayJoke();return;}
  const day=jokeDayKey();if(jokeDailyUnsub)jokeDailyUnsub();jokeDailyUnsub=onSnapshot(doc(db,'dailyJokes',day),snap=>{if(snap.exists())subscribeJokeRecord(snap.data().currentJokeId);else ensureTodayJoke();},error=>{console.error('daily joke listener failed',error);});
  if(jokeCustomUnsub)jokeCustomUnsub();jokeCustomUnsub=onSnapshot(collection(db,'customJokes'),snap=>{customJokes=snap.docs.map(d=>({id:d.id,...d.data()}));});
}
window.replaceTodayJoke=async function(){
  if(!isSystemAdmin()||jokeLoading)return;jokeLoading=true;if(activePanel==='home')renderHome();
  try{const chosen=await chooseNewJoke(),record=makeJokeRecord(chosen,'manual');if(localTestMode){todayJoke={...record,createdAt:new Date().toISOString()};jokeVotes=[];}else{await setDoc(doc(db,'jokes',record.id),record);await setDoc(doc(db,'dailyJokes',jokeDayKey()),{day:jokeDayKey(),currentJokeId:record.id,updatedAt:serverTimestamp(),reason:'manual',changedBy:currentUser.uid});}}catch(error){console.error(error);alert('暫時無法更換笑話，請稍後再試。');}finally{jokeLoading=false;if(activePanel==='home')renderHome();}
}
window.voteDailyJoke=async function(reaction){
  if(!currentUser||!todayJoke||!jokeReactionOptions().some(r=>r.id===reaction))return;const vote={jokeId:todayJoke.id,uid:currentUser.uid,userName:currentUser.displayName||currentUser.email||memberDisplayName(S.members.find(m=>m.uid===currentUser.uid)),reaction,updatedAt:serverTimestamp()};
  if(localTestMode){const old=jokeVotes.find(v=>v.uid===currentUser.uid);if(old)Object.assign(old,vote);else jokeVotes.push({...vote,id:`${todayJoke.id}_${currentUser.uid}`});renderHome();return;}
  await setDoc(doc(db,'jokeVotes',`${todayJoke.id}_${currentUser.uid}`),vote);

window.showJokeVoters=function(reaction){
  const option=jokeReactionOptions().find(r=>r.id===reaction),voters=jokeVotes.filter(v=>v.reaction===reaction);$('mo-content').classList.remove('module-manager-modal');$('mo-content').innerHTML=`<div class="mo-title">${option.emoji} ${option.label}（${voters.length}）</div><div class="joke-voter-list">${voters.length?voters.map(v=>`<div class="joke-voter">${escAttr(v.userName||'未命名成員')}</div>`).join(''):'<div class="empty">目前還沒有人選擇這個反應</div>'}</div><div class="mo-footer"><button class="btn" onclick="closeMo()">關閉</button></div>`;$('modal').style.display='flex';
}
window.showCustomJokeLibrary=async function(){
  if(!isSystemAdmin())return;if(!localTestMode){try{const snap=await getDocs(collection(db,'customJokes'));customJokes=snap.docs.map(d=>({id:d.id,...d.data()}));}catch(error){console.error(error);}}
  $('mo-content').classList.remove('module-manager-modal');$('mo-content').style.maxWidth='700px';$('mo-content').innerHTML=`<div class="mo-title">自建笑話庫</div><div class="mo-sub">作為 TianAPI 無法使用時的備援來源</div><div style="display:grid;gap:7px;margin-top:12px"><input id="custom-joke-title" placeholder="笑話標題（可留白）"><textarea id="custom-joke-content" rows="4" placeholder="輸入笑話內容"></textarea><input id="custom-joke-id" type="hidden"><div style="display:flex;justify-content:flex-end;gap:7px"><button class="btn" onclick="resetCustomJokeForm()">清除</button><button class="btn btn-p" onclick="saveCustomJoke()">儲存笑話</button></div></div><div class="joke-library-list">${customJokes.length?customJokes.map(j=>`<div class="joke-library-row"><div class="joke-library-text"><strong>${escAttr(j.title||'未命名笑話')}</strong><br>${escAttr(j.content||'')}</div><div class="joke-library-actions"><button class="btn btn-sm" onclick="editCustomJoke('${j.id}')">編輯</button><button class="btn btn-sm btn-danger" onclick="deleteCustomJoke('${j.id}')">刪除</button></div></div>`).join(''):'<div class="empty">尚未建立自建笑話</div>'}</div><div class="mo-footer"><button class="btn" onclick="closeMo()">關閉</button></div>`;$('modal').style.display='flex';
}

window.editCustomJoke=function(id){const j=customJokes.find(x=>x.id===id);if(!j)return;$('custom-joke-id').value=id;$('custom-joke-title').value=j.title||'';$('custom-joke-content').value=j.content||'';$('custom-joke-content').focus();}
window.saveCustomJoke=async function(){if(!isSystemAdmin())return;const id=$('custom-joke-id').value||`custom-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,title=$('custom-joke-title').value.trim(),content=$('custom-joke-content').value.trim();if(!content)return alert('請輸入笑話內容。');const data={title:title||'未命名笑話',content,updatedBy:currentUser.uid,updatedAt:serverTimestamp()};if(localTestMode){const old=customJokes.find(x=>x.id===id);if(old)Object.assign(old,data);else customJokes.push({id,...data});}else await setDoc(doc(db,'customJokes',id),data);showCustomJokeLibrary();}
window.deleteCustomJoke=async function(id){if(!isSystemAdmin()||!confirm('確定刪除這則自建笑話？'))return;if(localTestMode)customJokes=customJokes.filter(x=>x.id!==id);else await deleteDoc(doc(db,'customJokes',id));showCustomJokeLibrary();}

// ── Daily quiz ──
function quizMonthKey(day=jokeDayKey()){return day.slice(0,7);}
function quizMine(){return quizAnswers.find(a=>a.uid===currentUser?.uid);}
function quizStats(){const correct=quizAnswers.filter(a=>a.correct).length,total=quizAnswers.length;return{total,correct,wrong:total-correct,rate:total?Math.round(correct/total*100):0};}
function quizDayNumber(day){return Math.floor(Date.parse(day+'T00:00:00Z')/86400000);}
function uniqueQuizDays(rows){const days={};rows.forEach(a=>{if(!days[a.day]||a.quizId===todayQuiz?.id)days[a.day]=a;});return Object.values(days);}
function currentQuizStreak(){
  const mine=uniqueQuizDays(quizUserAnswers).sort((a,b)=>a.day.localeCompare(b.day)),last=mine.at(-1);if(!last||!last.correct)return 0;
  const todayN=quizDayNumber(jokeDayKey()),lastN=quizDayNumber(last.day);if(todayN-lastN>1)return 0;
  let streak=1;for(let i=mine.length-2;i>=0;i--){if(!mine[i].correct||quizDayNumber(mine[i+1].day)-quizDayNumber(mine[i].day)!==1)break;streak++;}return streak;
}
function quizMonthBest(){
  const byUser={};quizMonthAnswers.forEach(a=>(byUser[a.uid]||(byUser[a.uid]=[])).push(a));let best=0,names=[];
  Object.values(byUser).forEach(raw=>{const rows=uniqueQuizDays(raw).sort((a,b)=>a.day.localeCompare(b.day));let run=0,peak=0,prev=null;rows.forEach(a=>{run=a.correct&&(!prev||quizDayNumber(a.day)-quizDayNumber(prev)===1)?run+1:a.correct?1:0;peak=Math.max(peak,run);prev=a.day;});const name=rows.at(-1)?.userName||'同事';if(peak>best){best=peak;names=[name];}else if(peak&&peak===best&&!names.includes(name))names.push(name);});return{best,names};
}
function renderLegacyDailyQuizModule(){
  if(quizLoading&&!todayQuiz)return'<div class="quiz-loading">今日題目載入中…</div>';if(!todayQuiz)return'<div class="quiz-loading">今日題目準備中…</div>';
  const mine=quizMine(),stats=quizStats(),best=quizMonthBest(),letters=['A','B','C','D'];
  const options=letters.map(letter=>{let cls=quizSelected===letter?'selected':'';if(mine){if(letter===todayQuiz.answer)cls='correct';else if(letter===mine.selectedAnswer)cls='wrong';}return`<button class="quiz-option ${cls}" ${mine?'disabled':''} onclick="event.stopPropagation();selectDailyQuizAnswer('${letter}')"><strong>${letter}.</strong> ${escAttr(todayQuiz.options?.[letter]||'')}</button>`;}).join('');
  return`<div class="daily-quiz"><div class="quiz-question">${escAttr(todayQuiz.question)}</div><div class="quiz-options">${options}</div>${mine?`<div class="quiz-result"><strong class="${mine.correct?'ok':'bad'}">${mine.correct?'答對了！':'答錯了'}</strong>　正確答案：${todayQuiz.answer}<span class="quiz-result-explain">${todayQuiz.analytic?`<br>${escAttr(todayQuiz.analytic)}`:''}</span><div class="quiz-stats">今日 ${stats.total} 人作答　<button class="quiz-stat-button" onclick="event.stopPropagation();showQuizAnswerUsers(true)">答對 ${stats.correct}</button>　<button class="quiz-stat-button" onclick="event.stopPropagation();showQuizAnswerUsers(false)">答錯 ${stats.wrong}</button>　正確率 ${stats.rate}%</div></div>`:''}<div class="quiz-actions"><span class="quiz-streak">🔥 目前連勝 ${currentQuizStreak()} 天 <span class="quiz-month-best">${best.best?`・🏆 本月最高：${escAttr(best.names.join('、'))} ${best.best} 天`:''}</span></span>${!mine?`<button class="btn btn-p" ${quizSelected?'':'disabled'} onclick="event.stopPropagation();submitDailyQuizAnswer()">送出答案</button>`:''}${isSystemAdmin()?'<button class="btn" onclick="event.stopPropagation();replaceTodayQuiz()">換一題</button>':''}</div></div>`;
}
function localQuizPick(){const pool=LOCAL_QUIZ_FALLBACKS.filter(q=>q.question!==todayQuiz?.question),pick=(pool.length?pool:LOCAL_QUIZ_FALLBACKS)[Math.floor(Math.random()*(pool.length||LOCAL_QUIZ_FALLBACKS.length))];return{...pick,type:'multiple-choice',source:'local-fallback'};}
async function fetchTianQuiz(){const response=await fetch('/api/quiz',{headers:{accept:'application/json'}});if(!response.ok)throw new Error(`quiz api ${response.status}`);const data=await response.json();if(!data?.question||!data?.answer)throw new Error('quiz api empty');return data;}
async function chooseNewQuiz(){if(localTestMode)return localQuizPick();try{return await fetchTianQuiz();}catch(error){console.warn('TianAPI quiz unavailable, using fallback',error);return localQuizPick();}}
function makeLegacyQuizRecord(item,reason){const day=jokeDayKey();return{id:`quiz-${day}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,day,month:quizMonthKey(day),type:item.type||'multiple-choice',question:item.question,options:item.options,answer:item.answer,analytic:item.analytic||'',source:item.source||'fallback',sourceRef:item.sourceRef||'',reason,createdBy:currentUser?.uid||'',createdAt:serverTimestamp()};}
async function ensureLegacyTodayQuiz(){
  if(quizLoading||todayQuiz)return;quizLoading=true;if(activePanel==='home')renderHome();try{const day=jokeDayKey();if(localTestMode){todayQuiz={...makeLegacyQuizRecord(localQuizPick(),'daily'),createdAt:new Date().toISOString()};quizAnswers=[];quizMonthAnswers=[];quizUserAnswers=[];return;}const dailyRef=doc(db,'dailyQuizzes',day),existing=await getDoc(dailyRef);if(existing.exists())return;const record=makeLegacyQuizRecord(await chooseNewQuiz(),'daily');await fbRunTransaction(db,async tx=>{const latest=await tx.get(dailyRef);if(latest.exists())return;tx.set(doc(db,'quizzes',record.id),record);tx.set(dailyRef,{day,currentQuizId:record.id,updatedAt:serverTimestamp(),reason:'daily'});});}catch(error){console.error('daily quiz creation failed',error);}finally{quizLoading=false;if(activePanel==='home')renderHome();}

function subscribeQuizRecord(quizId){if(quizDocUnsub)quizDocUnsub();if(quizAnswersUnsub)quizAnswersUnsub();todayQuiz=null;quizAnswers=[];quizSelected='';if(!quizId){ensureTodayQuiz();return;}quizDocUnsub=onSnapshot(doc(db,'quizzes',quizId),snap=>{todayQuiz=snap.exists()?{id:snap.id,...snap.data()}:null;if(activePanel==='home')renderHome();});quizAnswersUnsub=onSnapshot(query(collection(db,'quizAnswers'),where('quizId','==',quizId)),snap=>{quizAnswers=snap.docs.map(d=>({id:d.id,...d.data()}));if(activePanel==='home')renderHome();});}
function initDailyQuiz(){if(localTestMode){if(!todayQuiz)ensureTodayQuiz();return;}const day=jokeDayKey();if(quizDailyUnsub)quizDailyUnsub();quizDailyUnsub=onSnapshot(doc(db,'dailyQuizzes',day),snap=>snap.exists()?subscribeQuizRecord(snap.data().currentQuizId):ensureTodayQuiz(),error=>console.error('daily quiz listener failed',error));if(quizMonthUnsub)quizMonthUnsub();quizMonthUnsub=onSnapshot(query(collection(db,'quizAnswers'),where('month','==',quizMonthKey(day))),snap=>{quizMonthAnswers=snap.docs.map(d=>({id:d.id,...d.data()}));if(activePanel==='home')renderHome();});if(quizUserUnsub)quizUserUnsub();quizUserUnsub=onSnapshot(query(collection(db,'quizAnswers'),where('uid','==',currentUser.uid)),snap=>{quizUserAnswers=snap.docs.map(d=>({id:d.id,...d.data()}));if(activePanel==='home')renderHome();});}

let overviewStatusFilter=null;

function renderOverview(){
  const el=$('panel-overview');
  if(overviewReportProjId){el.innerHTML=renderSiteReport(overviewReportProjId);return;}
  const inContact=S.projects.filter(p=>p.status==='contact').length;
  const inCv=S.projects.filter(p=>p.status==='cv').length;
  const inDesign=S.projects.filter(p=>p.status==='design').length;

  const shown=sortDesignProjs(overviewStatusFilter?S.projects.filter(p=>p.status===overviewStatusFilter):S.projects);

  <div class="stats">
    ${statCard('contact',inContact,'#6B6558','接洽中')}
    ${statCard('cv',inCv,'var(--red)','客變案')}
    ${statCard('design',inDesign,'#4A3FA0','設計中')}

      </div>
      ${canEditProjects()?`<button class="btn btn-sm" onclick="toggleOverviewEditMode()">${overviewEditMode?'完成':'編輯'}</button>`:''}

    ${shown.length===0?`<div class="empty">尚無案件</div>`:`

      <thead><tr>${isAdmin()&&overviewEditMode?'<th style="width:34px"></th>':''}<th>案件名稱</th><th>狀態</th><th>業主姓名</th><th>類型</th><th>設計師</th><th>預算</th><th>完工日</th>${canEditProjects()&&overviewEditMode?'<th>操作</th>':''}</tr></thead>

        return`<tr ${isAdmin()&&overviewEditMode?`draggable="true" ondragstart="overviewRowDragStart(event,'${p.id}')" ondragover="overviewRowDragOver(event)" ondrop="overviewRowDrop(event,'${p.id}')"`:''}>${isAdmin()&&overviewEditMode?'<td style="text-align:center;cursor:grab;color:var(--text3)">⠿</td>':''}
          <td><strong style="font-weight:500;cursor:pointer;color:var(--purple)" onclick="${p.status==='done'?`showSiteReport('${p.id}')`:`showProjectDetail('${p.id}')`}">${p.name}</strong>${p.status==='done'?' <span style="font-size:10px;color:var(--text3)">(查看總報告表)</span>':''}</td>
          <td>${isAdmin()?`<select class="status-sel" style="background:${si.bg};color:${si.color}" onchange="handleStatusChange('${p.id}',this)">
            ${STATUS_OPTS.map(o=>`<option value="${o.v}" ${p.status===o.v?'selected':''}>${o.l}</option>`).join('')}
          </select>`:`<span class="badge" style="background:${si.bg};color:${si.color}">${si.l}</span>`}</td>
          <td>${p.owner||''}</td><td style="color:var(--text2)">${p.type||''}</td>
          <td>${p.designer||''}</td><td>${p.budget||''}</td>

function renderSiteReport(projId){
  const p=S.projects.find(x=>x.id===projId);
  if(!p)return`<div class="empty">找不到這個案件</div><button class="btn" onclick="closeSiteReport()">← 返回</button>`;
  const stages=getBibleStages();
  const schedule=[...(p.schedule||[])].sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
  const meetingEntries=getMeetingEntriesForProject(p.name);
  return`
  <button class="btn btn-sm" onclick="closeSiteReport()">← 返回案件總覽</button>
  <div class="card" style="margin-top:12px">
    <div class="card-hdr"><span class="card-title">${p.name} — 工地總報告表</span></div>
    <div style="font-size:13px;line-height:2;color:var(--text2)">
      業主姓名：${p.owner||'—'}　類型：${p.type||'—'}　設計師：${p.designer||'—'}<br>
      預算：${p.budget||'—'}　完工日：${p.contractEnd||p.finish||'—'}　初驗日：${p.initialInspectionDate||'—'}<br>
      完工類型：${p.completionTypes&&p.completionTypes.length?p.completionTypes.join('、'):'—'}
    </div>
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-title">📖 施工寶典勾選結果</span></div>
    ${(()=>{
      const touchedStages=stages.filter(s=>{
        const stored=S.checks[`${p.id}_${s}`]||[];
        return stored.some(x=>x&&(x.done||x.skip));
      });
      if(!touchedStages.length)return'<div class="empty">尚無勾選紀錄</div>';
      return touchedStages.map(s=>{
        const metaItems=projectBibleItemsMeta(p,s);
        if(!metaItems.length)return'';
        const stored=S.checks[`${p.id}_${s}`]||[];
        const done=metaItems.filter((_,i)=>stored[i]?.done||stored[i]?.skip).length;
        return`<div style="margin-bottom:14px">
          <div style="font-size:13px;font-weight:600;margin-bottom:4px">${s}（${done}/${metaItems.length}）</div>
          ${metaItems.map((m,i)=>{
            const st=stored[i]||{};
            const icon=st.done?'✓':(st.skip?'✗':'○');
            const color=st.done?'var(--teal)':'var(--text3)';
            const depth=m.depth||(m.isSub?1:0);
            return`<div style="font-size:12px;padding:3px 0 3px ${depth*26}px;display:flex;gap:6px"><span style="color:${color};font-weight:600;width:14px">${icon}</span>${depth>0?'└ ':''}${m.text}</div>`;
          }).join('')}
        </div>`;
      }).join('');
    })()}
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-title">🏗 工地進度</span></div>
    ${schedule.length?schedule.map(ev=>`<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">
      <strong>${ev.date}</strong>　${ev.time||''}　${ev.label||ev.stage||''}${ev.note?'　— '+ev.note:''}
    </div>`).join(''):'<div class="empty">尚無工地進度紀錄</div>'}
  </div>
  <div class="card">
    <div class="card-hdr"><span class="card-title">🗓 會議 / 其他事項</span></div>
    ${meetingEntries.length?meetingEntries.map(e=>`<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">
      <strong>${e.date}</strong>　［${e.rowLabel}］　${e.text}
    </div>`).join(''):'<div class="empty">沒有標記這個工地的會議/其他事項紀錄</div>'}
  </div>`;
}
function getMeetingEntriesForProject(projName){
  const out=[];
  Object.keys(S.meetingLogs||{}).forEach(key=>{
    const log=S.meetingLogs[key];
    if(!log||!log.items)return;
    const rowInfo=MEETING_ROWS.find(r=>r.id===log.rowId);
    (log.items||[]).forEach(item=>{
      const m=(item.text||'').match(/\[proj:([^\]]+)\]/);
      if(m&&m[1]===projName){
        out.push({date:log.date,rowLabel:rowInfo?rowInfo.name:(log.rowId||''),text:(item.text||'').replace(/\[proj:[^\]]+\]/g,'').trim()});
      }
    });
  });
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return out;
}
window.updateStatus=async function(projId,v,completionTypes,inspDate){
  setSyncing();
  const patch={status:v};
  if(v==='done'){
    if(completionTypes)patch.completionTypes=completionTypes;
    if(inspDate)patch.initialInspectionDate=inspDate;
    const proj=S.projects.find(p=>p.id===projId);
    if(!proj||!proj.bibleSnapshot){
      const snap={};
      getBibleStages().forEach(s=>{
        const b=S.bible[s]||{before:[],during:[],after:[]};
        snap[s]={before:[...(b.before||[])],during:[...(b.during||[])],after:[...(b.after||[])]};
      });
      patch.bibleSnapshot=snap;
    }
  }
  await updateDoc(doc(db,'projects',projId),patch);
  setSynced();
}

let designRowDragInProgress=false,designRowDragSrc=null,pendingDesignRender=false;
function sortDesignProjs(projs){
  if(!designProjectOrder.length)return projs;
  const order=designProjectOrder;
  return[...projs].sort((a,b)=>{
    const ia=order.indexOf(a.id),ib=order.indexOf(b.id);
    const ra=ia<0?Infinity:ia,rb=ib<0?Infinity:ib;
    return ra-rb;
  });
}

// Shift + mouse wheel scrolls the design table horizontally from anywhere
// on the design-progress screen, not only while hovering over the table.
document.addEventListener('wheel',function(e){
  if(activePanel!=='design'||!e.shiftKey)return;
  const wrap=$('design-scroll-wrap');
  if(!wrap||wrap.scrollWidth<=wrap.clientWidth)return;
  const delta=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  if(!delta)return;
  e.preventDefault();
  wrap.scrollLeft+=delta;
},{passive:false});

function renderDesignCell(p,col){
  const dp=p.designProgress||{};
  const colKey=col.key||col.name;
  const val=dp[colKey]||'';
  if(col.kind==='member'){
    const memberIds=Array.isArray(val)?val:(val?[val]:[]);
    const selectedMembers=memberIds.map(uid=>S.members.find(x=>x.uid===uid)).filter(m=>m&&m.role!=='manager');

  // re-render will remove it from the DOM, and removing a focused element
  // fires a native blur on it — which would otherwise re-save whatever

// Global sticky notepad — visible only to the current user. One text box,
// like 每日施工日誌. Whatever you type is saved under the month you're
// currently viewing; a month with no edit of its own just inherits the
// text from the nearest earlier month that has one, so editing "forks"
// forward from that point without touching earlier months' saved text.
function getGlobalNoteText(viewMonth){
  if(!currentUser)return'';
  const prefix=currentUser.uid+'_';
  const months=Object.keys(S.globalNotes||{})
    .filter(k=>k.indexOf(prefix)===0)
    .map(k=>k.slice(prefix.length))
    .filter(m=>m<=viewMonth)
    .sort();
  if(!months.length)return'';
  return S.globalNotes[prefix+months[months.length-1]].text||'';
}

window.saveGlobalNote=async function(viewMonth,text){

let dailyAssignMemberUids=[];
function renderDailyAssignBar(days){
  if(!currentUser||!days.length)return'';
  const base=days[Math.floor(days.length/2)];
  const yyyy=base.getFullYear(),mm=String(base.getMonth()+1).padStart(2,'0');
  const monthStart=`${yyyy}-${mm}-01`;
  const monthEnd=`${yyyy}-${mm}-${String(new Date(yyyy,base.getMonth()+1,0).getDate()).padStart(2,'0')}`;
  const td=today();
  const defaultDate=(td.getFullYear()===yyyy&&td.getMonth()===base.getMonth())?fmtDay(td):monthStart;
  const members=dailyLogMembersList();
  return`<div style="display:flex;align-items:center;gap:6px;position:relative;font-weight:400">
    <input type="date" id="daily-assign-date" min="${monthStart}" max="${monthEnd}" value="${defaultDate}" style="width:128px;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:11px">
    <input type="text" id="daily-assign-text" placeholder="輸入指派任務" style="width:180px;padding:4px 7px;border:1px solid var(--border);border-radius:5px;font-size:11px">
    <button class="btn btn-sm" type="button" onclick="toggleDailyAssignPicker(event)">標記（可複選）</button>
    <span id="daily-assign-summary" style="font-size:10px;color:var(--purple);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
    <button class="btn btn-sm btn-p" type="button" onclick="submitDailyAssignment()">新增</button>
    <div id="daily-assign-picker" style="display:none;position:absolute;right:42px;top:32px;width:190px;max-height:230px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:7px;box-shadow:0 5px 18px rgba(0,0,0,.15);padding:7px;z-index:80">
      ${members.map(m=>`<label style="display:flex;align-items:center;gap:7px;padding:5px 4px;font-size:11px;cursor:pointer"><input type="checkbox" value="${m.uid}" ${dailyAssignMemberUids.includes(m.uid)?'checked':''} onchange="toggleDailyAssignMember('${m.uid}',this.checked)">${memberDisplayName(m)}</label>`).join('')}
    </div>
  </div>`;
}
window.toggleDailyAssignPicker=function(event){
  event.stopPropagation();
  const el=$('daily-assign-picker');if(el)el.style.display=el.style.display==='block'?'none':'block';
}
window.toggleDailyAssignMember=function(uid,checked){
  if(checked&&!dailyAssignMemberUids.includes(uid))dailyAssignMemberUids.push(uid);
  if(!checked)dailyAssignMemberUids=dailyAssignMemberUids.filter(x=>x!==uid);
  const names=dailyAssignMemberUids.map(uid=>memberDisplayName(S.members.find(m=>m.uid===uid))).filter(Boolean);
  const el=$('daily-assign-summary');if(el)el.textContent=names.join('、');
}
window.submitDailyAssignment=async function(){
  if(!currentUser)return;
  const dateEl=$('daily-assign-date'),textEl=$('daily-assign-text');
  const ds=dateEl?dateEl.value:'';const task=textEl?textEl.value.trim():'';
  if(!ds||!task){alert('請先選擇日期並輸入指派任務');return;}
  if(!dailyAssignMemberUids.length){alert('請至少標記一位成員');return;}
  setSyncing();
  for(const uid of dailyAssignMemberUids){
    const key=uid+'_'+ds;const cur=S.dailyLogs[key]||{};
    const list=(cur.assigned||[]).slice();
    list.push({id:'a'+Date.now()+'_'+uid,text:task,authorUid:currentUser.uid});
    await setDoc(doc(db,'dailyLogs',key),Object.assign({},cur,{uid,date:ds,assigned:list}));
  }
  dailyAssignMemberUids=[];
  setSynced();
  if(activePanel==='progress')renderProgress();
}

  const td=today();

      <span class="daily-section-title">每日施工日誌</span>

// One cell = the owner's own free-text log (only they can edit it), plus
// any number of "assigned" notes from other people — each assigned note
// can only be edited/removed by whoever wrote it, or by the cell's owner.
function renderDailyLogCell(m,d,td){
  const ds=fmtDay(d);
  const isT=isSameDay(d,td);
  const logKey=`${m.uid}_${ds}`;
  const cur=S.dailyLogs[logKey]||{};
  const logVal=cur.text||'';
  const canEditOwn=currentUser&&m.uid===currentUser.uid;
  const assigned=cur.assigned||[];
  const meetingAssigned=assigned.filter(function(e){return e.sourceType==='meeting';});
  const regularAssigned=assigned.filter(function(e){return e.sourceType!=='meeting';});
  let h=`<td style="${isT?'background:#faf9ff':''};vertical-align:top">`;
  meetingAssigned.forEach(function(e){
    const entryColor=/^#[0-9a-f]{6}$/i.test(e.color||'')?e.color:'var(--text)';
    const entryBg=/^#[0-9a-f]{6}$/i.test(e.bg||'')?e.bg:'var(--surface)';
    h+=`<div title="由上方會議／其他事項同步" style="margin:0 0 3px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;background:${entryBg};color:${entryColor}">${escAttr(e.text||'')}</div>`;
  });
  h+=`<textarea class="log-textarea${isT?' today':''}"
      ${canEditOwn?`onblur="saveDailyLog('${m.uid}','${ds}',this.value)"
      onkeydown="if(event.key==='Tab'){event.preventDefault();this.blur()}"
      placeholder=""`:' readonly'}
    >${logVal}</textarea>`;
  regularAssigned.forEach(function(e){
    const canManage=currentUser&&(currentUser.uid===e.authorUid||currentUser.uid===m.uid);
    const author=S.members.find(function(x){return x.uid===e.authorUid;});
    const authorName=memberDisplayName(author);
    const entryColor='var(--pd)';
    const entryBg='var(--pl)';
    const entryBorder='var(--purple)';
    if(canManage){
      h+=`<div style="margin-top:3px;position:relative">
        <input type="text" id="assign-${m.uid}-${ds}-${e.id}" value="${escAttr(e.text||'')}" title="${authorName} 指派"
          onblur="saveAssignedEntry('${m.uid}','${ds}','${e.id}',this.value)"
          onkeydown="if(event.key==='Enter')this.blur()"
          style="width:100%;box-sizing:border-box;padding:3px 20px 3px 6px;border:1px solid ${entryBorder};border-radius:4px;font-size:11px;font-family:inherit;background:${entryBg};color:${entryColor}">
        <span onclick="deleteAssignedEntry('${m.uid}','${ds}','${e.id}')" title="刪除" style="position:absolute;top:2px;right:3px;cursor:pointer;color:${entryColor};font-weight:700;font-size:11px">×</span>
      </div>`;
    }else{
      h+=`<div style="margin-top:3px;padding:3px 6px;border:1px solid ${entryBorder};border-radius:4px;font-size:11px;background:${entryBg};color:${entryColor}">${escAttr(authorName)}：${escAttr(e.text||'')}</div>`;
    }
  });
  h+='</td>';
  return h;
}

window.mToggleMention=async function(rowId,ds,idx,uid){
  if(!currentUser)return;
  if(!markableMembersList().some(m=>m.uid===uid))return;
  const key=rowId+'_'+ds;
  const items=(S.meetingLogs[key]&&S.meetingLogs[key].items)?[...S.meetingLogs[key].items]:[];
  if(idx<0||idx>=items.length)return;
  const mentions=(items[idx].mentions||[]).slice();
  const pos=mentions.indexOf(uid);
  const adding=pos<0;
  if(adding)mentions.push(uid);else mentions.splice(pos,1);
  items[idx]=Object.assign({},items[idx],{mentions});
  S.meetingLogs=Object.assign({},S.meetingLogs);
  S.meetingLogs[key]=Object.assign({},S.meetingLogs[key],{items});
  if(localTestMode){
    if(adding)await mSyncDailyLog(rowId,ds,idx,uid,items[idx]);
    else await mRemoveFromDailyLog(rowId,ds,idx,uid);
    setSynced();
    const menuEl=document.getElementById('meet-mention-'+rowId+'-'+ds);
    if(menuEl&&menuEl.style.display==='block')menuEl.innerHTML=mMentionMenuHTML(rowId,ds,idx);
    if(activePanel==='progress')renderProgress();
    return;
  }
  setSyncing();
  await setDoc(doc(db,'meetingLogs',key),{rowId,date:ds,items,updatedAt:serverTimestamp()});
  setSynced();
  if(adding)await mSyncDailyLog(rowId,ds,idx,uid,items[idx]);
  else await mRemoveFromDailyLog(rowId,ds,idx,uid);
  // Refresh just the checklist (keep it open) instead of a full re-render,
  // so tagging several people doesn't require re-hovering each time.
  const menuEl=document.getElementById('meet-mention-'+rowId+'-'+ds);
  if(menuEl&&menuEl.style.display==='block')menuEl.innerHTML=mMentionMenuHTML(rowId,ds,idx);
}
// Upsert this meeting entry's own text as one line in the member's daily
// log, remembering exactly which line came from this entry (so editing the
// text later replaces the same line, and untagging removes the same line).
async function mSyncDailyLog(rowId,ds,idx,uid,item){
  const m=S.members.find(x=>x.uid===uid);
  if(!m)return;
  const logKey=`${m.uid}_${ds}`;
  const cur=S.dailyLogs[logKey]||{};
  const autoLines=Object.assign({},cur.autoLines||{});
  const trackKey=rowId+'_'+idx;
  const oldLine=autoLines[trackKey];
  let lines=(cur.text||'').split('\n').filter(l=>l!=='');
  if(oldLine!=null){
    const pos=lines.indexOf(oldLine);
    if(pos>=0)lines.splice(pos,1);
    delete autoLines[trackKey];
  }
  const sourceId='meeting:'+rowId+':'+idx;
  const assigned=(cur.assigned||[]).slice();
  const existingIndex=assigned.findIndex(function(entry){return entry.id===sourceId||(entry.sourceType==='meeting'&&entry.sourceRowId===rowId&&entry.sourceIndex===idx);});
  const existing=existingIndex>=0?assigned[existingIndex]:{};
  const synced=Object.assign({},existing,{id:sourceId,text:(item&&item.text)||'',authorUid:existing.authorUid||(currentUser&&currentUser.uid)||'',sourceType:'meeting',sourceRowId:rowId,sourceIndex:idx,color:(item&&item.color)||'',bg:(item&&item.bg)||''});
  if(existingIndex>=0)assigned[existingIndex]=synced;else assigned.push(synced);
  try{
    await setDoc(doc(db,'dailyLogs',logKey),Object.assign({},cur,{uid:m.uid,date:ds,text:lines.join('\n'),autoLines,assigned,updatedAt:serverTimestamp()}));
  }catch(err){
    console.error('無法自動寫入 '+memberDisplayName(m)+' 的每日日誌（可能需要調整 Firebase 權限規則）',err);
  }
}
async function mRemoveFromDailyLog(rowId,ds,idx,uid){
  const m=S.members.find(x=>x.uid===uid);
  if(!m)return;
  const logKey=`${m.uid}_${ds}`;
  const cur=S.dailyLogs[logKey]||{};
  const autoLines=Object.assign({},cur.autoLines||{});
  const trackKey=rowId+'_'+idx;
  const oldLine=autoLines[trackKey];
  let lines=(cur.text||'').split('\n').filter(l=>l!=='');
  if(oldLine!=null){const pos=lines.indexOf(oldLine);if(pos>=0)lines.splice(pos,1);delete autoLines[trackKey];}
  const sourceId='meeting:'+rowId+':'+idx;
  const assigned=(cur.assigned||[]).filter(function(entry){return entry.id!==sourceId&&!(entry.sourceType==='meeting'&&entry.sourceRowId===rowId&&entry.sourceIndex===idx);});
  try{
    await setDoc(doc(db,'dailyLogs',logKey),Object.assign({},cur,{uid:m.uid,date:ds,text:lines.join('\n'),autoLines,assigned,updatedAt:serverTimestamp()}));
  }catch(err){
    console.error('無法自動移除 '+memberDisplayName(m)+' 的每日日誌（可能需要調整 Firebase 權限規則）',err);
  }
}

window.mSaveBox=async function(el,rowId,ds,idx){
  if(!currentUser||!el)return;
  if(meetingEditCanceled){meetingEditCanceled=false;meetingEditing=null;if(activePanel==='progress')renderProgress();return;}
  const text=el.value;const link=linkFromInput(el,text);
  const key=rowId+'_'+ds;
  const items=(S.meetingLogs[key]&&S.meetingLogs[key].items)?[...S.meetingLogs[key].items]:[];
  while(items.length<=idx)items.push({text:'',color:'',bg:'',mentions:[]});
  items[idx]=Object.assign({},items[idx],{text,link});
  setSyncing();
  await setDoc(doc(db,'meetingLogs',key),{rowId,date:ds,items,updatedAt:serverTimestamp()});
  // keep already-tagged members' daily logs in sync with the latest text
  const mentions=items[idx].mentions||[];
  for(const uid of mentions){
    await mSyncDailyLog(rowId,ds,idx,uid,items[idx]);
  }
  setSynced();
  meetingEditing=null;
  if(activePanel==='progress')renderProgress();
}

function getNoteTodosForProject(projName){
  const pn=S.privateNotes||{work:{},personal:{}};
  const out=[];
  ['work','personal'].forEach(function(type){
    const byDate=pn[type]||{};
    Object.keys(byDate).forEach(function(ds){
      (byDate[ds]||[]).forEach(function(item,idx){
        const m=(item.text||'').match(/\[proj:([^\]]+)\]/);
        if(m&&m[1]===projName){
          out.push({source:'note',type:type,ds:ds,idx:idx,text:(item.text||'').replace(/\[proj:[^\]]+\]/g,'').trim(),completed:!!item.completed});
        }
      });
    });
  });
  return out;
}
function renderTodoPanel(){
  if(!currentUser)return'';

  const projs=projIds.map(id=>S.projects.find(p=>p.id===id)).filter(p=>p&&p.status!=='done');
  return`<div style="border:1px solid var(--border);border-radius:var(--rl2);padding:10px;margin-bottom:12px;background:var(--surface)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

let selectedTodoId=null;
window.selectTodoItem=function(id){
  selectedTodoId=(selectedTodoId===id)?null:id;
  // Direct style toggle instead of a full renderProgress() — a full
  // re-render on every single click destroys and recreates these row
  // elements, which breaks the browser's double-click detection (the
  // dblclick event ends up targeting an already-detached old node).
  document.querySelectorAll('.todo-item-row').forEach(function(row){
    var match=row.getAttribute('data-todo-key')===selectedTodoId;
    row.style.background=match?'var(--pl)':'';
    row.style.borderRadius=match?'4px':'';
  });
}
function renderTodoItem(t){
  const doneStyle=t.completed?'text-decoration:line-through;color:var(--text3)':'';
  const toggleOnclick=t.source==='note'
    ?`pnToggleComplete('${t.type}','${t.ds}',${t.idx})`
    :`toggleManualTodo('${t.id}',${!t.completed})`;
  const key=t.source==='manual'?('m:'+t.id):('n:'+t.type+':'+t.ds+':'+t.idx);
  const isSel=selectedTodoId===key;
  const dblclick=`event.stopPropagation();startEditTodoItem('${key}',this)`;
  return`<div class="todo-item-row" data-todo-key="${key}" onclick="event.stopPropagation();selectTodoItem('${key}')" style="display:flex;align-items:flex-start;gap:5px;font-size:11px;padding:4px 4px;border-bottom:1px solid var(--border);${isSel?'background:var(--pl);border-radius:4px':''}">
    <span onclick="event.stopPropagation();${toggleOnclick}" style="cursor:pointer;flex-shrink:0">${t.completed?'✅':'⬜'}</span>
    <span ondblclick="${dblclick}" style="flex:1;word-break:break-word;${doneStyle}">${escAttr(t.text)}</span>

}
window.startEditTodoItem=function(key,el){
  const current=el.textContent;

  const inp=el.querySelector('input');
  inp.focus();inp.select();
}
window.saveTodoItemEdit=async function(key,text){
  text=(text||'').trim();
  if(!text)return renderProgress();
  if(key.indexOf('m:')===0){
    const id=key.slice(2);
    S.userTodos=(S.userTodos||[]).map(function(t){return t.id===id?Object.assign({},t,{text:text}):t;});
    renderProgress();
    setSyncing();
    await updateDoc(doc(db,'userTodos',id),{text});
    setSynced();
  }else if(key.indexOf('n:')===0&&currentUser){
    const parts=key.slice(2).split(':');
    const type=parts[0],ds=parts[1],idx=parseInt(parts[2]);
    const pn=S.privateNotes||{work:{},personal:{}};
    const items=(pn[type]&&pn[type][ds])?[...pn[type][ds]]:[];
    if(idx<0||idx>=items.length)return renderProgress();
    const oldText=items[idx].text||'';
    const m=oldText.match(/\[proj:[^\]]+\]/);
    const tag=m?m[0]:'';
    items[idx]=Object.assign({},items[idx],{text:tag?tag+' '+text:text});
    S.privateNotes=Object.assign({},pn);
    S.privateNotes[type]=Object.assign({},pn[type]||{});
    S.privateNotes[type][ds]=items;
    renderProgress();
    setSyncing();
    await setDoc(doc(db,'privateNotes',currentUser.uid),S.privateNotes);
    setSynced();
  }
}
window.deleteNoteTodoByKey=async function(key){
  if(key.indexOf('n:')!==0||!currentUser)return;
  const parts=key.slice(2).split(':');
  const type=parts[0],ds=parts[1],idx=parseInt(parts[2]);
  const pn=S.privateNotes||{work:{},personal:{}};
  const items=(pn[type]&&pn[type][ds])?[...pn[type][ds]]:[];
  if(idx<0||idx>=items.length)return;
  items.splice(idx,1);
  S.privateNotes=Object.assign({},pn);
  S.privateNotes[type]=Object.assign({},pn[type]||{});
  S.privateNotes[type][ds]=items;
  setSyncing();
  await setDoc(doc(db,'privateNotes',currentUser.uid),S.privateNotes);
  setSynced();
}

let recurringSyncQueue=Promise.resolve();
function recurringSchedules(){return Array.isArray(S.privateNotes?.recurringSchedules)?S.privateNotes.recurringSchedules:[];}
function recurringSyncThroughDate(baseDate=today()){
  const base=new Date(baseDate);
  return fmtDay(new Date(base.getFullYear()+1,11,31));
}
function recurringMatches(rule,ds){
  const d=new Date(ds+'T00:00:00'),start=new Date(rule.startDate+'T00:00:00');
  if(ds<rule.startDate||rule.endDate&&ds>rule.endDate)return false;
  if(rule.frequency==='daily')return true;
  if(rule.frequency==='weekly')return d.getDay()===Number(rule.weekday);
  if(rule.frequency==='monthly')return d.getDate()===Number(rule.monthDay);
  if(rule.frequency==='yearly')return d.getMonth()+1===Number(rule.yearMonth||start.getMonth()+1)&&d.getDate()===Number(rule.yearDay||start.getDate());
  if(rule.frequency==='custom')return Math.floor((d-start)/86400000)%Math.max(1,Number(rule.intervalDays)||1)===0;
  return false;
}
async function syncRecurringRule(rule,removeOnly,throughDate,deferSave){
  if(!currentUser)return;
  const td=today(),todayDs=fmtDay(td),pn=S.privateNotes||{work:{},personal:{}};
  const next=Object.assign({},pn,{work:Object.assign({},pn.work||{}),personal:Object.assign({},pn.personal||{})});
  let changed=false;
  // 啟用中的排程不重建已存在的項目：使用者可自行修改、刪除、拖拉與排序。
  // 只有停用／刪除排程時，才移除未完成的未來自動項目。
  if(removeOnly)['work','personal'].forEach(type=>{
    Object.keys(next[type]).forEach(ds=>{
      const old=next[type][ds]||[];
      const kept=old.filter(item=>!(item.recurringId===rule.id&&ds>=todayDs&&!item.completed));
      if(kept.length!==old.length){next[type][ds]=kept;changed=true;}
    });
  });
  if(!removeOnly&&rule.enabled){
    const startFloor=[todayDs,rule.startDate,rule.enabledFrom||rule.startDate].sort().pop();
    const start=new Date(startFloor+'T00:00:00'),end=new Date(start);end.setDate(end.getDate()+120);
    if(throughDate){const requestedEnd=new Date(throughDate+'T00:00:00');if(requestedEnd>end)end.setTime(requestedEnd.getTime());}
    if(rule.endDate&&new Date(rule.endDate+'T00:00:00')<end)end.setTime(new Date(rule.endDate+'T00:00:00').getTime());
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const ds=fmtDay(d);if(!recurringMatches(rule,ds))continue;
      const type=rule.target==='personal'?'personal':'work';
      const arr=(next[type][ds]||[]).slice();
      const skipped=(rule.skippedDates||[]).includes(ds);
      const existsAnywhere=['work','personal'].some(t=>Object.values(next[t]||{}).some(items=>(items||[]).some(item=>item.recurringId===rule.id&&item.recurringDate===ds)));
      if(skipped||existsAnywhere)continue;
      arr.push({text:rule.name,note:rule.note||'',color:'',completed:false,recurringId:rule.id,recurringDate:ds,autoGenerated:true});
      next[type][ds]=arr;changed=true;
    }
  }
  if(changed){S.privateNotes=next;if(!deferSave)await setDoc(doc(db,'privateNotes',currentUser.uid),next);}
  return changed;
}
function syncAllRecurringSchedules(throughDate){
  if(!currentUser)return Promise.resolve();
  const yearlyThrough=recurringSyncThroughDate();
  if(!throughDate||throughDate<yearlyThrough)throughDate=yearlyThrough;
  const run=async function(){
    let changed=false;
    for(const rule of recurringSchedules())changed=(await syncRecurringRule(rule,!rule.enabled,throughDate,true))||changed;
    if(changed)await setDoc(doc(db,'privateNotes',currentUser.uid),S.privateNotes);
  };
  recurringSyncQueue=recurringSyncQueue.then(run,run);
  return recurringSyncQueue;
}
function recurringFreqLabel(r){
  if(r.frequency==='daily')return'每天';
  if(r.frequency==='weekly')return`每週${['日','一','二','三','四','五','六'][Number(r.weekday)||0]}`;
  if(r.frequency==='monthly')return`每月 ${r.monthDay} 日`;
  if(r.frequency==='yearly'){const p=(r.startDate||'').split('-');return`每年 ${Number(r.yearMonth||p[1])}/${Number(r.yearDay||p[2])}`;}
  return`每 ${r.intervalDays||1} 天`;
}
function recurringEndLabel(r){return r.endDate?`至 ${String(r.endDate).replace(/-/g,'/')}`:'無期限';}

window.saveRecurringRule=async function(){
  if(!currentUser)return;const name=$('rr-name').value.trim(),startDate=$('rr-start').value;if(!name||!startDate)return alert('請填寫項目名稱與開始日期');
  const endDate=$('rr-end-mode').value==='limited'?$('rr-end').value:'';if($('rr-end-mode').value==='limited'&&!endDate)return alert('請選擇結束日期');

var pnDragSrc=null;
var pnDragPreview=null;
var pnDragLayout=null;
function pnClearDragPreview(){
  document.querySelectorAll('.pn-chip.pn-dragging').forEach(function(el){el.classList.remove('pn-dragging');});
  document.querySelectorAll('[data-pn-cell] .pn-chip[draggable="true"]').forEach(function(el){el.style.transform='';});
  pnDragPreview=null;
  pnDragLayout=null;
}
function pnApplyDragPreview(type,ds,previewIndex){
  if(!pnDragSrc||pnDragSrc.type!==type||pnDragSrc.ds!==ds)return;
  var cell=document.querySelector('[data-pn-cell="'+type+'|'+ds+'"]');
  if(!cell)return;
  var chips=[...cell.querySelectorAll('.pn-chip[draggable="true"]')];
  var source=pnDragSrc.idx;
  var sourceEl=chips[source];
  if(!sourceEl)return;
  var shift=sourceEl.getBoundingClientRect().height+4;
  chips.forEach(function(el,i){
    el.style.transform='';
    if(i===source){el.classList.add('pn-dragging');return;}
    if(previewIndex<source&&i>=previewIndex&&i<source)el.style.transform='translateY('+shift+'px)';
    if(previewIndex>source&&i>source&&i<=previewIndex)el.style.transform='translateY(-'+shift+'px)';
  });
}
function pnSetDropEffect(e){
  if(e.dataTransfer)e.dataTransfer.dropEffect=e.ctrlKey?'copy':'move';
}
function pnPreviewAtY(e,type,ds){
  if(!pnDragSrc||pnDragSrc.type!==type||pnDragSrc.ds!==ds||!pnDragLayout)return;
  // 用拖曳開始時的中心線判定，避免已讓位的 transform 反過來改變門檻而閃爍。
  var previewIndex=0;
  pnDragLayout.forEach(function(item,i){if(i!==pnDragSrc.idx&&e.clientY>item.center)previewIndex++;});
  if(pnDragPreview&&pnDragPreview.type===type&&pnDragPreview.ds===ds&&pnDragPreview.index===previewIndex)return;
  pnDragPreview={type:type,ds:ds,index:previewIndex};
  pnApplyDragPreview(type,ds,previewIndex);
}
window.pnPreviewReorder=function(e,type,ds){
  e.preventDefault();e.stopPropagation();
  pnSetDropEffect(e);
  pnPreviewAtY(e,type,ds);
}
window.pnPreviewCell=function(e,type,ds){
  e.preventDefault();

// 第一格上方也保留一段有效放置區，讓往上拖出框線時仍可預覽／放到最上方。
function pnAllowNativeDrop(e){
  if(!pnDragSrc)return false;
  // 原生 HTML5 拖曳若沒有明確 preventDefault，瀏覽器就會顯示禁止游標。
  e.preventDefault();pnSetDropEffect(e);
  return true;
}
document.addEventListener('dragenter',function(e){pnAllowNativeDrop(e);},true);
document.addEventListener('dragover',function(e){
  if(!pnAllowNativeDrop(e))return;
  var cell=document.querySelector('[data-pn-cell="'+pnDragSrc.type+'|'+pnDragSrc.ds+'"]');
  var targetCell=e.target.closest?.('[data-pn-cell]');
  if(!cell||(targetCell&&targetCell!==cell))return;
  var rect=cell.getBoundingClientRect();
  if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top-96||e.clientY>rect.bottom+20)return;
  pnPreviewAtY(e,pnDragSrc.type,pnDragSrc.ds);
},true);
document.addEventListener('drop',function(e){
  if(!pnDragSrc||e.target.closest?.('[data-pn-cell]'))return;
  var cell=document.querySelector('[data-pn-cell="'+pnDragSrc.type+'|'+pnDragSrc.ds+'"]');
  if(!cell)return;
  var rect=cell.getBoundingClientRect();
  if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top-72||e.clientY>rect.bottom)return;
  e.preventDefault();window.pnDrop(e,pnDragSrc.type,pnDragSrc.ds,0);
});
