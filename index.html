<title>摰文閮剛?獢辣蝮賣蝟餌絞</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f5;--surface:#fff;--border:#e8e5e0;
  --text:#1a1a1a;--text2:#6b6560;--text3:#9c9690;
  --purple:#534AB7;--pl:#EEEDFE;--pd:#3C3489;
  --teal:#1D9E75;--tl:#E1F5EE;--td:#085041;
  --amber:#BA7517;--al:#FAEEDA;--ad:#633806;
  --red:#E24B4A;--rl:#FCEBEB;--rd:#791F1F;
  --green:#639922;--gl:#EAF3DE;--gd:#27500A;
  --company-1:#D6D1CA;--company-2:#968B83;--company-3:#C0B7B0;--company-4:#9A9794;--company-5:#C8C9C9;
  --r:8px;--rl2:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* Auth screens */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:40px;width:360px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-logo{font-size:22px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}.login-logo img{width:32px;height:32px;object-fit:contain;border-radius:6px}.login-logo span{color:var(--purple)}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 20px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:14px;font-family:inherit;font-weight:500}
.google-btn:hover{background:var(--bg)}
.test-btn{display:none;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:11px 20px;border:1px solid var(--purple);border-radius:var(--r);background:var(--pl);color:var(--pd);cursor:pointer;font-size:14px;font-family:inherit;font-weight:600}
.test-btn:hover{background:#dedcf9}
.test-hint{display:none;margin-top:9px;font-size:11px;line-height:1.5;color:var(--text3)}
#pending-screen{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:1000}
.pending-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:40px;width:380px;text-align:center}
#app-screen{display:none}

/* App layout */
.app{display:flex;flex-direction:column;min-height:100vh}
.topnav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;gap:1rem;height:50px;position:sticky;top:0;z-index:50}
.logo{font-size:15px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}.logo img{width:22px;height:22px;object-fit:contain;border-radius:4px}.logo span{color:var(--purple)}
.nav-tabs{display:flex;gap:1px;overflow-x:auto;flex:1}
.nav-tab{padding:5px 12px;font-size:13px;border:none;background:none;cursor:pointer;border-radius:var(--r);color:var(--text2);white-space:nowrap;font-family:inherit}
.nav-tab:hover{background:var(--bg);color:var(--text)}
.nav-tab.active{background:var(--pl);color:var(--pd);font-weight:500}
.admin-only{display:none}.admin-only.show{display:inline-block}
.topnav-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
.user-avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--border)}
.user-name{font-size:12px;color:var(--text2);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-ind{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}
.main{flex:1;padding:1.25rem;width:100%}
.panel{display:none}.panel.active{display:block}

/* Common */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:14px 16px}
.stat-n{font-size:24px;font-weight:600;line-height:1}.stat-l{font-size:12px;color:var(--text2);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);overflow:hidden;margin-bottom:1rem}
.card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:11px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.b-prog{background:var(--pl);color:var(--pd)}.b-done{background:var(--gl);color:var(--gd)}
.b-wait{background:var(--al);color:var(--ad)}.b-stop{background:var(--rl);color:var(--rd)}
.b-design{background:#F0EDFB;color:#4A3FA0}.b-new{background:var(--tl);color:var(--td)}
.pend{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:600;margin-left:3px;vertical-align:middle}
.pend-r{background:var(--rl);color:var(--rd)}.pend-g{background:var(--gl);color:var(--gd)}
.status-sel{font-size:11px;padding:2px 8px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;font-weight:500}
.btn{padding:6px 14px;border-radius:var(--r);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--purple);color:#fff;border-color:var(--purple)}.btn-p:hover{background:var(--pd)}
.btn-sm{padding:3px 9px;font-size:12px}.btn-danger{background:var(--rl);color:var(--rd);border-color:var(--rl)}
input[type=text],input[type=date],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
.flex{display:flex;align-items:center;gap:8px}
.flex-sb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:13px}
/* AI Assistant */
.ai-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--purple);color:#fff;border:none;cursor:pointer;font-size:22px;box-shadow:0 4px 16px rgba(83,74,183,.4);z-index:200;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.ai-fab:hover{transform:scale(1.08)}
.ai-panel{position:fixed;bottom:88px;right:24px;width:360px;max-height:520px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.ai-header{padding:12px 16px;background:var(--purple);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.ai-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.ai-msg-user{background:var(--pl);color:var(--pd);padding:8px 12px;border-radius:12px 12px 4px 12px;font-size:13px;align-self:flex-end;max-width:85%}
.ai-msg-ai{background:var(--bg);padding:8px 12px;border-radius:12px 12px 12px 4px;font-size:13px;align-self:flex-start;max-width:85%;line-height:1.5}
.ai-input-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px}
.ai-input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;resize:none;outline:none}
.ai-input:focus{border-color:var(--purple)}
.ai-send{padding:7px 14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r);cursor:pointer;font-size:13px;font-family:inherit;font-weight:500}
.ai-send:hover{background:var(--pd)}
.ai-send:disabled{opacity:.5;cursor:not-allowed}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.rr-choice-group{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.rr-choice{border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:999px;padding:7px 14px;font:500 12px inherit;cursor:pointer;transition:.15s}
.rr-choice:hover{border-color:var(--purple);color:var(--purple)}
.rr-choice.on{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 1px 4px rgba(83,74,183,.25)}
.rr-toggle{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:2px;cursor:pointer;color:var(--text2);font:500 12px inherit;white-space:nowrap}
.rr-toggle-track{position:relative;width:42px;height:23px;border-radius:999px;background:#c9c6c2;transition:.18s;flex:none}

/* Vendor information */

.vendor-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.vendor-toolbar input,.vendor-toolbar select{width:auto;min-width:180px}.vendor-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);margin-bottom:10px;overflow:hidden}.vendor-group-hdr{padding:10px 14px;background:var(--company-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}.vendor-group-title{font-size:14px;font-weight:600;flex:1}

.vendor-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);max-height:210px;overflow:auto}.vendor-check{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}.vendor-check input{width:auto}.vendor-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.vendor-tag{font-size:10px;padding:2px 7px;border-radius:12px;background:var(--tl);color:var(--td)}.qr-box{text-align:center;padding-top:12px}.qr-box img{width:220px;height:220px;max-width:100%;border:8px solid #fff;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.site-vendor-project{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);margin-bottom:12px;overflow:hidden}.site-vendor-project-hdr{padding:12px 15px;background:var(--company-1);color:var(--text);font-size:14px;font-weight:600}.site-vendor-category{padding:12px 15px;border-top:1px solid var(--border)}.site-vendor-category-title{font-size:14px;font-weight:600;margin:-12px -15px 8px;padding:10px 15px;background:var(--company-1)}.site-vendor-option{display:grid;grid-template-columns:minmax(180px,280px) minmax(200px,1fr);align-items:center;gap:10px;padding:6px 0}.site-vendor-option label{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}.site-vendor-option input[type=checkbox]{width:auto}.site-vendor-option input[type=text]{padding:6px 9px}.site-vendor-none{border-top:1px dashed var(--border);margin-top:4px;padding-top:9px}.site-vendor-hint{font-size:11px;color:var(--text3);margin:-4px 0 12px}
@media(max-width:700px){.vendor-head{display:flex;flex-direction:column;align-items:stretch}.vendor-head-info{text-align:left}.vendor-tabs{align-self:center;max-width:100%;overflow-x:auto}.vendor-head-actions{align-self:flex-end}.vendor-tab{padding:6px 10px;white-space:nowrap}.vendor-row{align-items:flex-start;flex-direction:column}.vendor-actions{justify-content:flex-start}.vendor-toolbar input,.vendor-toolbar select{width:100%}.site-vendor-option{grid-template-columns:1fr}.topnav{gap:.5rem}.nav-tab{padding:5px 9px}}

import{initializeApp}from"https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
import{getFirestore,collection,doc,addDoc as fbAddDoc,updateDoc as fbUpdateDoc,deleteDoc as fbDeleteDoc,setDoc as fbSetDoc,getDoc as fbGetDoc,onSnapshot,serverTimestamp,getDocs as fbGetDocs,writeBatch as fbWriteBatch,query,where}from"https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";

const FC={apiKey:"AIzaSyA6W_C2H84heiVwDe_a6ElMwuEjvbR0aRo",authDomain:"have000.firebaseapp.com",projectId:"have000",storageBucket:"have000.firebasestorage.app",messagingSenderId:"758420593792",appId:"1:758420593792:web:29f485e949eca0ce031a65"};
const app=initializeApp(FC);

let currentUser=null,currentRole=null;
const IS_LOCAL_PREVIEW=location.protocol==='file:'||['127.0.0.1','localhost'].includes(location.hostname);
let localTestMode=false;
let S={projects:[],checks:{},bible:{},bibleOrder:[],members:[],dailyLogs:{},privateNotes:{work:{},personal:{}},dateColors:{},meetingLogs:{},globalNotes:{},userTodos:[],tradeCategories:[],tradeVendors:[],otherVendorCategories:[],otherVendors:[],projectTradeSelections:{}};
let userPrefs={todoProjects:[]};
let localRenderTimer=null;
function localClone(v){return v===undefined?v:JSON.parse(JSON.stringify(v));}
function localPath(ref){return String(ref?.path||'').replace(/^\/+|\/+$/g,'');}
function localParts(ref){const p=localPath(ref).split('/');return{collection:p[0]||'',id:p.slice(1).join('/')};}
function localFindArray(collectionName,id){
  const arr=collectionName==='projects'?S.projects:collectionName==='members'?S.members:collectionName==='userTodos'?S.userTodos:collectionName==='tradeCategories'?S.tradeCategories:collectionName==='tradeVendors'?S.tradeVendors:collectionName==='otherVendorCategories'?S.otherVendorCategories:collectionName==='otherVendors'?S.otherVendors:null;
  if(!arr)return null;
  return arr.find(x=>String(x.id)===id||String(x.uid)===id)||null;
}
function localRead(collectionName,id){
  if(['projects','members','userTodos','tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName))return localFindArray(collectionName,id);
  if(collectionName==='checks')return S.checks[id];
  if(collectionName==='bible')return id==='orderConfig'?{order:S.bibleOrder}:S.bible[id];
  if(collectionName==='dailyLogs')return S.dailyLogs[id];
  if(collectionName==='meetingLogs')return S.meetingLogs[id];
  if(collectionName==='globalNotes')return S.globalNotes[id];
  if(collectionName==='projectTradeSelections')return{categories:S.projectTradeSelections[id]||{}};
  if(collectionName==='privateNotes')return S.privateNotes;
  if(collectionName==='userPrefs')return userPrefs;
  if(collectionName==='settings'){
    if(id==='designCols')return{cols:designCols||DEFAULT_DESIGN_COLS};
    if(id==='designColWidths')return{widths:designColWidths};
    if(id==='designProjectOrder')return{order:designProjectOrder};
    if(id==='dateColors')return{colors:S.dateColors};
  }
  return undefined;
}
function localWrite(collectionName,id,data,merge=false){
  const value=localClone(data)||{};
  if(['projects','members','userTodos','tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName)){
    const arr=collectionName==='projects'?S.projects:collectionName==='members'?S.members:collectionName==='userTodos'?S.userTodos:collectionName==='tradeCategories'?S.tradeCategories:collectionName==='tradeVendors'?S.tradeVendors:collectionName==='otherVendorCategories'?S.otherVendorCategories:S.otherVendors;
    const existing=localFindArray(collectionName,id);
    if(existing)Object.assign(existing,merge?value:{...value,id:existing.id||id});
    else arr.push({...value,id,uid:collectionName==='members'?(value.uid||id):value.uid});
  }else if(collectionName==='checks')S.checks[id]=merge?{...(S.checks[id]||{}),...value}:value;
  else if(collectionName==='bible'){
    if(id==='orderConfig')S.bibleOrder=[...(value.order||[])];
    else S.bible[id]=merge?{...(S.bible[id]||{}),...value}:value;
  }else if(collectionName==='dailyLogs')S.dailyLogs[id]=merge?{...(S.dailyLogs[id]||{}),...value}:value;
  else if(collectionName==='meetingLogs')S.meetingLogs[id]=merge?{...(S.meetingLogs[id]||{}),...value}:value;
  else if(collectionName==='globalNotes')S.globalNotes[id]=merge?{...(S.globalNotes[id]||{}),...value}:value;
  else if(collectionName==='projectTradeSelections')S.projectTradeSelections[id]=localClone(value.categories||{});
  else if(collectionName==='privateNotes')S.privateNotes=merge?{...(S.privateNotes||{}),...value}:value;
  else if(collectionName==='userPrefs')userPrefs=merge?{...userPrefs,...value}:value;
  else if(collectionName==='settings'){
    if(id==='designCols')designCols=value.cols||DEFAULT_DESIGN_COLS;
    else if(id==='designColWidths')designColWidths=value.widths||{};
    else if(id==='designProjectOrder')designProjectOrder=value.order||[];
    else if(id==='dateColors')S.dateColors=value.colors||{};
  }
}
function localDelete(collectionName,id){
  if(collectionName==='projects')S.projects=S.projects.filter(x=>String(x.id)!==id);
  else if(collectionName==='members')S.members=S.members.filter(x=>String(x.id)!==id&&String(x.uid)!==id);
  else if(collectionName==='userTodos')S.userTodos=S.userTodos.filter(x=>String(x.id)!==id);
  else if(collectionName==='checks')delete S.checks[id];
  else if(collectionName==='bible'){delete S.bible[id];S.bibleOrder=S.bibleOrder.filter(x=>x!==id);}
  else if(collectionName==='dailyLogs')delete S.dailyLogs[id];
  else if(collectionName==='meetingLogs')delete S.meetingLogs[id];
  else if(collectionName==='globalNotes')delete S.globalNotes[id];
  else if(collectionName==='projectTradeSelections')delete S.projectTradeSelections[id];
  else if(['tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName))S[collectionName]=S[collectionName].filter(x=>String(x.id)!==id);
}
function localNotify(){
  clearTimeout(localRenderTimer);
  localRenderTimer=setTimeout(()=>{if(localTestMode&&typeof renderActive==='function')renderActive();},0);
}
async function setDoc(ref,data,options){
  if(!localTestMode)return fbSetDoc(ref,data,options);
  const{collection:collectionName,id}=localParts(ref);localWrite(collectionName,id,data,!!options?.merge);localNotify();return;
}
async function updateDoc(ref,data){
  if(!localTestMode)return fbUpdateDoc(ref,data);
  const{collection:collectionName,id}=localParts(ref);localWrite(collectionName,id,data,true);localNotify();return;
}
async function deleteDoc(ref){
  if(!localTestMode)return fbDeleteDoc(ref);
  const{collection:collectionName,id}=localParts(ref);localDelete(collectionName,id);localNotify();return;
}
async function addDoc(ref,data){
  if(!localTestMode)return fbAddDoc(ref,data);
  const collectionName=localPath(ref).split('/')[0];const id=`local-${collectionName}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
  localWrite(collectionName,id,data,false);localNotify();return{id,path:`${collectionName}/${id}`};
}
async function getDoc(ref){
  if(!localTestMode)return fbGetDoc(ref);
  const{collection:collectionName,id}=localParts(ref);const value=localRead(collectionName,id);
  return{id,ref,exists:()=>value!==undefined,data:()=>localClone(value)};
}
async function getDocs(ref){
  if(!localTestMode)return fbGetDocs(ref);
  const collectionName=localPath(ref).split('/')[0];let entries=[];
  if(collectionName==='projects')entries=S.projects.map(x=>[x.id,x]);
  else if(collectionName==='members')entries=S.members.map(x=>[x.id||x.uid,x]);
  else if(collectionName==='userTodos')entries=S.userTodos.map(x=>[x.id,x]);
  else if(collectionName==='checks')entries=Object.entries(S.checks);
  else if(collectionName==='bible')entries=Object.entries(S.bible);
  else if(collectionName==='projectTradeSelections')entries=Object.entries(S.projectTradeSelections).map(([id,categories])=>[id,{categories}]);
  else if(['tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName))entries=S[collectionName].map(x=>[x.id,x]);
  return{docs:entries.map(([id,value])=>({id,ref:doc(db,collectionName,id),data:()=>localClone(value)}))};
}
function writeBatch(database){
  if(!localTestMode)return fbWriteBatch(database);
  const ops=[];return{
    set:(ref,data,options)=>ops.push(()=>setDoc(ref,data,options)),
    update:(ref,data)=>ops.push(()=>updateDoc(ref,data)),
    delete:(ref)=>ops.push(()=>deleteDoc(ref)),
    commit:async()=>{for(const op of ops)await op();}
  };
}

// top-level item, [2,0] is its 1st sub-item, [2,0,1] its 2nd sub-sub-item.
function replaceAtPath(arr,path,newNode){
  const copy=[...arr];
  if(path.length===1){copy[path[0]]=newNode;return copy;}
  const cur=normalizeBibleItem(copy[path[0]]);
  copy[path[0]]={text:cur.text,subs:replaceAtPath(cur.subs,path.slice(1),newNode)};
  return copy;
}
function addChildAtPath(arr,path,text){
  const copy=[...arr];
  const cur=normalizeBibleItem(copy[path[0]]);
  if(path.length===1){
    copy[path[0]]={text:cur.text,subs:[...cur.subs,text]};
  }else{
    copy[path[0]]={text:cur.text,subs:addChildAtPath(cur.subs,path.slice(1),text)};
  }
  return copy;
}
function removeAtPath(arr,path){
  const copy=[...arr];
  if(path.length===1){copy.splice(path[0],1);return copy;}
  const cur=normalizeBibleItem(copy[path[0]]);
  copy[path[0]]={text:cur.text,subs:removeAtPath(cur.subs,path.slice(1))};
  return copy;
}
function getNodeAtPath(arr,path){
  let node=arr[path[0]];
  for(let k=1;k<path.length;k++)node=normalizeBibleItem(node).subs[path[k]];
  return node;
}
function flatIndexAtPath(data,phase,path){
  const before=data.before||[],during=data.during||[];
  let offset=0;
  if(phase!=='before')offset+=flatPhaseCount(before);
  if(phase==='after')offset+=flatPhaseCount(during);
  let arr=data[phase]||[];
  for(let level=0;level<path.length;level++){
    const idx=path[level];
    for(let i=0;i<idx;i++)offset+=1+flatPhaseCount(normalizeBibleItem(arr[i]).subs);
    if(level<path.length-1){
      offset+=1;
      arr=normalizeBibleItem(arr[idx]).subs;
    }
  }
  return offset;
}
function getAllBibleItemsMeta(stage){
  const b=S.bible[stage]||{before:[],during:[],after:[]};
  return[...flattenPhaseItems(b.before),...flattenPhaseItems(b.during),...flattenPhaseItems(b.after)];
}
function getAllBibleItems(stage){return getAllBibleItemsMeta(stage).map(x=>x.text);}
// For a completed project, use the frozen snapshot taken when it was marked
// done, so later edits to the live ?賢極撖嗅 template don't shift/relabel
// its already-checked items. Active projects always use the live template.
function projectBibleData(proj,stage){
  if(proj&&proj.status==='done'&&proj.bibleSnapshot&&proj.bibleSnapshot[stage])return proj.bibleSnapshot[stage];
  return S.bible[stage]||{before:[],during:[],after:[]};
}
function projectBibleItemsMeta(proj,stage){
  const b=projectBibleData(proj,stage);
  return[...flattenPhaseItems(b.before),...flattenPhaseItems(b.during),...flattenPhaseItems(b.after)];
}
function projectBibleItems(proj,stage){return projectBibleItemsMeta(proj,stage).map(x=>x.text);}
function pendingCount(projId,stage){
  if(!stage)return null;
  const proj=S.projects.find(p=>p.id===projId);
  const items=projectBibleItems(proj,stage);if(!items.length)return null;
  const stored=S.checks[`${projId}_${stage}`]||[];
  return items.length-items.filter((_,i)=>stored[i]?.done||stored[i]?.skip).length;
}

}

function getMeetingEntriesForProject(projName){
  const out=[];
  Object.keys(S.meetingLogs||{}).forEach(key=>{
    const log=S.meetingLogs[key];
    if(!log||!log.items)return;
    const rowInfo=MEETING_ROWS.find(r=>r.id===log.rowId);
    (log.items||[]).forEach(item=>{
      const m=(item.text||'').match(/\[proj:([^\]]+)\]/);
      if(m&&m[1]===projName){
        out.push({date:log.date,rowLabel:rowInfo?rowInfo.name:(log.rowId||''),text:(item.text||'').replace(/\[proj:[^\]]+\]/g,'').trim()});
      }
    });
  });
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return out;

// currently viewing; a month with no edit of its own just inherits the
// text from the nearest earlier month that has one, so editing "forks"
// forward from that point without touching earlier months' saved text.
function getGlobalNoteText(viewMonth){
  if(!currentUser)return'';
  const prefix=currentUser.uid+'_';
  const months=Object.keys(S.globalNotes||{})
    .filter(k=>k.indexOf(prefix)===0)
    .map(k=>k.slice(prefix.length))
    .filter(m=>m<=viewMonth)
    .sort();
  if(!months.length)return'';
  return S.globalNotes[prefix+months[months.length-1]].text||'';
}

// Upsert this meeting entry's own text as one line in the member's daily
// log, remembering exactly which line came from this entry (so editing the
// text later replaces the same line, and untagging removes the same line).
async function mSyncDailyLog(rowId,ds,idx,uid,newText){
  const m=S.members.find(x=>x.uid===uid);
  if(!m)return;
  const logKey=`${m.uid}_${ds}`;
  const cur=S.dailyLogs[logKey]||{};
  const autoLines=Object.assign({},cur.autoLines||{});
  const trackKey=rowId+'_'+idx;
  const oldLine=autoLines[trackKey];
  let lines=(cur.text||'').split('\n').filter(l=>l!=='');
  if(oldLine!=null){
    const pos=lines.indexOf(oldLine);
    if(pos>=0)lines[pos]=newText;else lines.push(newText);
  }else{
    lines.push(newText);
  }
  autoLines[trackKey]=newText;
  try{
    await setDoc(doc(db,'dailyLogs',logKey),Object.assign({},cur,{uid:m.uid,date:ds,text:lines.join('\n'),autoLines,updatedAt:serverTimestamp()}));
  }catch(err){

async function mRemoveFromDailyLog(rowId,ds,idx,uid){

  const oldLine=autoLines[trackKey];

let recurringSyncRunning=false;
function recurringSchedules(){return Array.isArray(S.privateNotes?.recurringSchedules)?S.privateNotes.recurringSchedules:[];}
function recurringMatches(rule,ds){
  const d=new Date(ds+'T00:00:00'),start=new Date(rule.startDate+'T00:00:00');
  if(ds<rule.startDate||rule.endDate&&ds>rule.endDate)return false;
  if(rule.frequency==='daily')return true;
  if(rule.frequency==='weekly')return d.getDay()===Number(rule.weekday);
  if(rule.frequency==='monthly')return d.getDate()===Number(rule.monthDay);
  if(rule.frequency==='yearly')return d.getMonth()+1===Number(rule.yearMonth||start.getMonth()+1)&&d.getDate()===Number(rule.yearDay||start.getDate());
  if(rule.frequency==='custom')return Math.floor((d-start)/86400000)%Math.max(1,Number(rule.intervalDays)||1)===0;
  return false;
}
async function syncRecurringRule(rule,removeOnly){
  if(!currentUser)return;
  const td=today(),todayDs=fmtDay(td),pn=S.privateNotes||{work:{},personal:{}};
  const next=Object.assign({},pn,{work:Object.assign({},pn.work||{}),personal:Object.assign({},pn.personal||{})});
  let changed=false;
  ['work','personal'].forEach(type=>{
    Object.keys(next[type]).forEach(ds=>{
      const old=next[type][ds]||[];
      const kept=old.filter(item=>!(item.recurringId===rule.id&&ds>=todayDs&&!item.completed));
      if(kept.length!==old.length){next[type][ds]=kept;changed=true;}
    });
  });
  if(!removeOnly&&rule.enabled){
    const startFloor=[todayDs,rule.startDate,rule.enabledFrom||rule.startDate].sort().pop();
    const start=new Date(startFloor+'T00:00:00'),end=new Date(start);end.setDate(end.getDate()+120);
    if(rule.endDate&&new Date(rule.endDate+'T00:00:00')<end)end.setTime(new Date(rule.endDate+'T00:00:00').getTime());
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const ds=fmtDay(d);if(!recurringMatches(rule,ds))continue;
      const type=rule.target==='personal'?'personal':'work';
      const arr=(next[type][ds]||[]).slice();
      const existsAnywhere=['work','personal'].some(t=>(next[t][ds]||[]).some(item=>item.recurringId===rule.id&&item.recurringDate===ds));
      if(existsAnywhere)continue;
      arr.push({text:rule.name,note:rule.note||'',color:'',completed:false,recurringId:rule.id,recurringDate:ds,autoGenerated:true});
      next[type][ds]=arr;changed=true;
    }
  }
  if(changed){S.privateNotes=next;await setDoc(doc(db,'privateNotes',currentUser.uid),next);}
}
async function syncAllRecurringSchedules(){
  if(recurringSyncRunning||!currentUser)return;recurringSyncRunning=true;
  try{for(const rule of recurringSchedules())await syncRecurringRule(rule,!rule.enabled);}finally{recurringSyncRunning=false;}
}

window.pnInput=function(e,type,ds,idx){
  var inp=e.target;
  var val=inp.value||'';
  var pos=inp.selectionStart||0;
  var textBefore=val.substring(0,pos);
  var atIdx=textBefore.lastIndexOf('@');
  var menuEl=document.getElementById('pn-global-mention');
  if(atIdx>=0&&textBefore.indexOf(' ',atIdx)<0){
    var q=textBefore.substring(atIdx+1).toLowerCase();
    var projs=S.projects.filter(function(p){return p.status!=='done'&&p.name.toLowerCase().includes(q);});
    if(projs.length){
      pnMentionActive={type:type,ds:ds,idx:idx,atIdx:atIdx};

      menuEl.style.cssText='display:block;position:fixed;top:'+(rect.bottom+4)+'px;left:'+rect.left+'px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:9999;min-width:150px;max-height:180px;overflow-y:auto';

          +'onmousedown="pnInsertMention(event,\''+type+'\',\''+ds+'\','+idx+',\''+p.name+'\')">'
          +p.name+'</div>';
      }).join('');
      return;
    }
  }
  if(menuEl){menuEl.style.display='none';}
  pnMentionActive=null;
}

window.pnInsertMention=function(e,type,ds,idx,projName){
  e.preventDefault();
  var inp=document.getElementById('pnbox-'+type+'-'+ds+'-'+idx);
  if(!inp)return;
  var menuEl=document.getElementById('pn-global-mention');
  if(menuEl)menuEl.style.display='none';
  pnMentionActive=null;
  // Replace @query with [proj:name] in input value
  var val=inp.value;
  var pos=inp.selectionStart||val.length;
  var textBefore=val.substring(0,pos);
  var atIdx=textBefore.lastIndexOf('@');
  if(atIdx>=0){
    var tag='[proj:'+projName+']';
    var newVal=val.substring(0,atIdx)+tag+val.substring(pos);
    inp.value=newVal;
    if(formulaBarState)formulaBarState.text=newVal;
    var newPos=atIdx+tag.length;
    inp.setSelectionRange(newPos,newPos);
  }
  // Stay in edit mode ??the person may want to keep typing right after
  // the inserted tag, rather than the field immediately closing.
  inp.focus();
}

// scrolling left/right together, since they're visually one continuous
// timeline even though they're separate <table> elements.
let hscrollSyncing=false;
let lastHScrollLeft=0;
document.addEventListener('scroll',function(e){
  if(hscrollSyncing)return;
  const el=e.target;
  if(!el.classList||!el.classList.contains('hscroll-sync'))return;
  hscrollSyncing=true;
  lastHScrollLeft=el.scrollLeft;
  document.querySelectorAll('.hscroll-sync').forEach(function(other){
    if(other!==el)other.scrollLeft=el.scrollLeft;
  });
  hscrollSyncing=false;
},true);
function restoreHScroll(){
  if(!lastHScrollLeft)return;
  document.querySelectorAll('.hscroll-sync').forEach(function(el){el.scrollLeft=lastHScrollLeft;});
}
// Shift + mouse wheel scrolls sideways instead of down, for any of the
// horizontally-scrollable table wrappers in the app.
document.addEventListener('wheel',function(e){
  if(!e.shiftKey)return;
  let el=e.target;
  while(el&&el!==document.body){
    if(el.scrollWidth>el.clientWidth){
      const ov=getComputedStyle(el).overflowX;
      if(ov==='auto'||ov==='scroll'){
        el.scrollLeft+=e.deltaY;
        e.preventDefault();
        return;
      }
    }
    el=el.parentElement;
  }
  const progressPanel=$('panel-progress');
  if(activePanel==='progress'&&progressPanel&&progressPanel.contains(e.target)){
    const scroller=Array.from(document.querySelectorAll('.hscroll-sync')).find(function(node){return node.scrollWidth>node.clientWidth;});
    if(scroller){
      scroller.scrollLeft+=e.deltaY||e.deltaX;
      lastHScrollLeft=scroller.scrollLeft;
      document.querySelectorAll('.hscroll-sync').forEach(function(other){if(other!==scroller)other.scrollLeft=lastHScrollLeft;});
      e.preventDefault();
    }
  }
},{passive:false});

// Parses a leading Chinese numeral (銝..??鈭?style) off a stage name like
// "???鼓鋆賣撌亙?" so stages can be sorted by their intended order even
// if a drag-reorder or import accidentally left them out of sequence.
function chineseNumPrefix(s){
  const digits={'??:0,'銝':1,'鈭?:2,'銝?:3,'??:4,'鈭?:5,'??:6,'銝?:7,'??:8,'銋?:9};
  const m=(s||'').match(/^[銝鈭????凋??思???]+/);
  if(!m)return null;
  const str=m[0];
  let total=0,section=0,num=0;
  for(const ch of str){
    if(ch==='??){section+=(num||1)*10;num=0;}
    else if(ch==='??){section+=(num||1)*100;num=0;}
    else{num=digits[ch];if(num===undefined)return null;section+=0;}
  }
  total=section+num;
  return total;
}

window.saveBibleStageTitle=async function(oldName,newName){
  newName=(newName||'').trim();
  if(!newName||newName===oldName)return renderBible();
  if(getBibleStages().includes(newName)){alert('甇日?畾萄?蝔勗歇摮');renderBible();return;}
  const data=S.bible[oldName]||{before:[],during:[],after:[]};
  const order=getBibleStages().map(s=>s===oldName?newName:s);
  S.bible=Object.assign({},S.bible);
  delete S.bible[oldName];
  S.bible[newName]=data;
  S.bibleOrder=order;
  activeBibleStage=newName;
  renderBible();
  setSyncing();
  try{
    await setDoc(doc(db,'bible',newName),data);
    await deleteDoc(doc(db,'bible',oldName));
    await setDoc(doc(db,'bible','orderConfig'),{order});
    // Migrate anything keyed off the old stage name so nothing silently
    // detaches: per-project checklist progress, calendar chips, and the
    // frozen snapshot on completed projects.
    const snap=await getDocs(collection(db,'checks'));
    const batch=writeBatch(db);
    snap.docs.filter(d=>d.id.endsWith('_'+oldName)).forEach(d=>{
      const projId=d.id.slice(0,d.id.length-('_'+oldName).length);
      batch.set(doc(db,'checks',projId+'_'+newName),d.data());
      batch.delete(doc(db,'checks',d.id));
    });
    await batch.commit();
    for(const p of S.projects){
      const sched=p.schedule||[];
      const patch={};
      if(sched.some(e=>e.stage===oldName)){
        patch.schedule=sched.map(e=>e.stage===oldName?{...e,stage:newName,label:e.label===oldName?newName:e.label}:e);
      }
      if(p.bibleSnapshot&&p.bibleSnapshot[oldName]){
        const snap2=Object.assign({},p.bibleSnapshot);
        snap2[newName]=snap2[oldName];
        delete snap2[oldName];
        patch.bibleSnapshot=snap2;
      }
      if(Object.keys(patch).length)await updateDoc(doc(db,'projects',p.id),patch);
    }
    setSynced();
  }catch(err){alert('?孵?憭望?嚗?+err.message);setSynced();}
}

}

function ymdInputs(prefix,label){
  return`<div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:2px">${label}</div>
    <div style="display:flex;align-items:center;gap:3px">
      <input id="${prefix}-y" type="number" placeholder="撟? style="width:70px">撟?
      <input id="${prefix}-m" type="number" placeholder="?? min="1" max="12" style="width:50px">??
      <input id="${prefix}-d" type="number" placeholder="?? min="1" max="31" style="width:50px">??
    </div>
  </div>`;
}
function ymdValue(prefix){
  const y=$(`${prefix}-y`).value.trim(),m=$(`${prefix}-m`).value.trim(),d=$(`${prefix}-d`).value.trim();
  if(!y||!m||!d)return'';
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function ymdSetFields(prefix,val){
  if(!val)return;
  const parts=val.split('-');
  if(parts.length!==3)return;
  if($(`${prefix}-y`))$(`${prefix}-y`).value=parts[0];
  if($(`${prefix}-m`))$(`${prefix}-m`).value=parseInt(parts[1],10);
  if($(`${prefix}-d`))$(`${prefix}-d`).value=parseInt(parts[2],10);
}

    if(sel.none){lines.push('<strong>'+escAttr(category.name)+'</strong>嚗');return;}
    const vendors=(sel.vendorIds||[]).map(function(id){
      const vendor=S.tradeVendors.find(v=>v.id===id);if(!vendor)return'';
      const note=(sel.notes||{})[id];
      return escAttr(vendor.companyName||'?芸??)+(vendor.contactName?'嚚?+escAttr(vendor.contactName):'')+(note?'嚗?+escAttr(note)+'嚗?:'');
    }).filter(Boolean);
    if(vendors.length)lines.push('<strong>'+escAttr(category.name)+'</strong>嚗?+vendors.join('??));

// Formula bar functions
var formulaBarState=null; // {type,ds,idx,text,rowId} ??selected meeting/work/personal item
// Inline HTML "oninput" attributes run in a scope that can't see this
// module's top-level variables directly, so they must go through a
// window-exposed function like this instead of touching formulaBarState.
window.pnSyncFormulaText=function(text){
  if(formulaBarState)formulaBarState.text=text;
}
var selGen=0;
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function normalizeLinkedItem(item){
  const source=String(item?.text||'');
  if(item?.link?.url)return{text:source,link:{label:item.link.label||source,url:item.link.url}};
  const legacy=source.match(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/);
  if(!legacy)return{text:source,link:null};
  return{text:source.slice(0,legacy.index)+legacy[1]+source.slice(legacy.index+legacy[0].length),link:{label:legacy[1],url:legacy[2]}};
}
function smartLinkHtml(label,url){
  let host='???';try{host=new URL(url).hostname.replace(/^www\./,'');}catch(e){}
  const kind=/google\.[^/]+\/maps|maps\.app\.goo\.gl/i.test(url)?'Google ?啣?':host;
  return'<span class="smart-link-wrap"><a class="inline-link" href="'+escAttr(url)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">'+escAttr(label)+'</a><a class="smart-link-card" href="'+escAttr(url)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"><div class="smart-link-title">?? '+escAttr(kind)+' 繚 '+escAttr(label)+'</div><div class="smart-link-url">'+escAttr(url)+'</div><span class="smart-link-open">?????</span></a></span>';
}
function renderPlainTextWithProjects(text){
  return String(text||'').split(/(\[proj:[^\]]+\])/g).map(function(part){
    const m=part.match(/^\[proj:([^\]]+)\]$/);
    return m?'<span style="color:var(--purple);font-weight:600;background:var(--pl);padding:0 4px;border-radius:3px;font-size:10px">'+escAttr(m[1])+'</span>':escAttr(part);
  }).join('');
}
function renderItemText(item){
  const linked=normalizeLinkedItem(item),text=linked.text,link=linked.link;
  if(!link)return renderPlainTextWithProjects(text);
  const pos=text.indexOf(link.label);if(pos<0)return renderPlainTextWithProjects(text);
  return renderPlainTextWithProjects(text.slice(0,pos))+smartLinkHtml(link.label,link.url)+renderPlainTextWithProjects(text.slice(pos+link.label.length));
}
function linkFromInput(input,text){
  const url=(input.dataset.linkUrl||'').trim(),label=input.dataset.linkLabel||'';
  if(!url||!label||!String(text).includes(label))return null;
  return{url,label};
}
window.insertUrlForSelection=function(event,input){
  const start=input.selectionStart,end=input.selectionEnd;
  if(start==null||end==null||start===end)return true;
  event.preventDefault();event.stopPropagation();
  const selected=input.value.slice(start,end);
  const url=prompt('鞎潔?蝬脣?嚗oogle ?啣??隞?http / https 蝬脣?嚗?,'https://');
  if(url===null)return false;
  let parsed;
  try{parsed=new URL(url.trim());}catch(err){alert('蝬脣??澆?銝迤蝣?);return false;}
  if(parsed.protocol!=='http:'&&parsed.protocol!=='https:'){alert('?芣??http ??https 蝬脣?');return false;}
  input.dataset.linkUrl=parsed.href;input.dataset.linkLabel=selected;
  if(formulaBarState)formulaBarState.link={url:parsed.href,label:selected};
  input.setSelectionRange(start,end);
  input.dispatchEvent(new Event('input',{bubbles:true}));
  input.focus();
  return false;
}
// Core save: always reads the live value straight off the given input element,
// identified by explicit type/ds/idx (baked into that box at render time) ??
// never relies on a shared "current selection" variable that could be stale.
window.pnSaveBox=async function(el,type,ds,idx){
  if(!currentUser||!el)return;
  if(pnEditCanceled){
    pnEditCanceled=false;
    S.privateEditing=null;
    var pn0=S.privateNotes||{work:{},personal:{}};
    var items0=(pn0[type]&&pn0[type][ds])||[];
    var origText=items0[idx]?items0[idx].text||'':'';
    updateFormulaBar(type,ds,idx,origText);
    renderProgress();
    return;
  }
  var text=el.value;var link=linkFromInput(el,text);
  var pn=S.privateNotes||{work:{},personal:{}};
  var items=(pn[type]&&pn[type][ds])?[...pn[type][ds]]:[];
  while(items.length<=idx)items.push({text:'',color:''});
  items[idx]=Object.assign({},items[idx],{text:text,link:link});
  S.privateNotes=Object.assign({},pn);
  S.privateNotes[type]=Object.assign({},pn[type]||{});
  S.privateNotes[type][ds]=items;
  S.privateEditing=null;
  setSyncing();
  await setDoc(doc(db,'privateNotes',currentUser.uid),S.privateNotes);
  setSynced();
  var gen=selGen;
  setTimeout(function(){
    if(selGen===gen){
      S.privateSelected={};
      if(activePanel==='progress')renderProgress();
    }
  },150);
}
// Box (in-place chip) blur ??identity is baked into the call at render time.
window.pnBoxBlur=function(el,type,ds,idx){
  pnSaveBox(el,type,ds,idx);
}
function updateFormulaBar(type,ds,idx,text,rowId,link){
  const same=formulaBarState&&formulaBarState.type===type&&formulaBarState.ds===ds&&formulaBarState.idx===idx;
  const keptLink=link===undefined&&same?formulaBarState.link:link;
  formulaBarState=(type===null)?null:{type:type,ds:ds,idx:idx,text:text||'',rowId:rowId||'',link:keptLink||null};
  var bar=document.getElementById('pn-formula-bar');
  var inp=document.getElementById('pn-formula-input');
  var lbl=document.getElementById('pn-formula-label');
  if(!bar||!inp)return;
  if(!formulaBarState){
    bar.classList.remove('active');
    inp.value='';
    return;
  }
  bar.classList.add('active');
  const meetingName=type==='meeting'?(MEETING_ROWS.find(r=>r.id===rowId)?.name||'?降 / ?嗡?鈭?'):'';
  lbl.textContent=(type==='meeting'?meetingName:(type==='work'?'撌亙閮?':'蝘犖閮?'))+' 繚 '+ds.slice(5).replace('-','/');
  inp.value=text||'';
  inp.dataset.linkUrl=formulaBarState.link?.url||'';
  inp.dataset.linkLabel=formulaBarState.link?.label||'';
}
// Top bar blur ??identity comes from formulaBarState (the top bar always
// mirrors whichever item was last selected), but the TEXT is read live
// from the input itself.
window.formulaBarSave=async function(){
  if(!formulaBarState)return;
  var inp=document.getElementById('pn-formula-input');
  if(formulaBarState.type==='meeting')await mSaveBox(inp,formulaBarState.rowId,formulaBarState.ds,formulaBarState.idx);
  else await pnSaveBox(inp,formulaBarState.type,formulaBarState.ds,formulaBarState.idx);
}
