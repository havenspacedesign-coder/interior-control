<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>室內設計案件總控系統</title>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=2">
<link rel="shortcut icon" type="image/png" href="./favicon.png?v=2">
<link rel="apple-touch-icon" href="./favicon.png?v=2">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f5;--surface:#fff;--border:#e8e5e0;
  --text:#1a1a1a;--text2:#6b6560;--text3:#9c9690;
  --purple:#534AB7;--pl:#EEEDFE;--pd:#3C3489;
  --teal:#1D9E75;--tl:#E1F5EE;--td:#085041;
  --amber:#BA7517;--al:#FAEEDA;--ad:#633806;
  --red:#E24B4A;--rl:#FCEBEB;--rd:#791F1F;
  --green:#639922;--gl:#EAF3DE;--gd:#27500A;
  --company-1:#D6D1CA;--company-2:#968B83;--company-3:#C0B7B0;--company-4:#9A9794;--company-5:#C8C9C9;
  --r:8px;--rl2:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* Auth screens */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:40px;width:360px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-logo{font-size:22px;font-weight:700;margin-bottom:6px}.login-logo span{color:var(--purple)}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 20px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:14px;font-family:inherit;font-weight:500}
.google-btn:hover{background:var(--bg)}
.test-btn{display:none;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:11px 20px;border:1px solid var(--purple);border-radius:var(--r);background:var(--pl);color:var(--pd);cursor:pointer;font-size:14px;font-family:inherit;font-weight:600}
.test-btn:hover{background:#dedcf9}
.test-hint{display:none;margin-top:9px;font-size:11px;line-height:1.5;color:var(--text3)}
#pending-screen{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:1000}
.pending-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:40px;width:380px;text-align:center}
#app-screen{display:none}

/* App layout */
.app{display:flex;flex-direction:column;min-height:100vh}
.topnav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;gap:1rem;height:50px;position:sticky;top:0;z-index:50}
.logo{font-size:15px;font-weight:600;white-space:nowrap}.logo span{color:var(--purple)}
.nav-tabs{display:flex;gap:1px;overflow-x:auto;flex:1}
.nav-tab{padding:5px 12px;font-size:13px;border:none;background:none;cursor:pointer;border-radius:var(--r);color:var(--text2);white-space:nowrap;font-family:inherit}
.nav-tab:hover{background:var(--bg);color:var(--text)}
.nav-tab.active{background:var(--pl);color:var(--pd);font-weight:500}
.admin-only{display:none}.admin-only.show{display:inline-block}
.topnav-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
.user-avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--border)}
.user-name{font-size:12px;color:var(--text2);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-ind{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}
.main{flex:1;padding:1.25rem;width:100%}
.panel{display:none}.panel.active{display:block}

/* Common */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:14px 16px}
.stat-n{font-size:24px;font-weight:600;line-height:1}.stat-l{font-size:12px;color:var(--text2);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);overflow:hidden;margin-bottom:1rem}
.card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:500}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:11px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.b-prog{background:var(--pl);color:var(--pd)}.b-done{background:var(--gl);color:var(--gd)}
.b-wait{background:var(--al);color:var(--ad)}.b-stop{background:var(--rl);color:var(--rd)}
.b-design{background:#F0EDFB;color:#4A3FA0}.b-new{background:var(--tl);color:var(--td)}
.pend{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:600;margin-left:3px;vertical-align:middle}
.pend-r{background:var(--rl);color:var(--rd)}.pend-g{background:var(--gl);color:var(--gd)}
.status-sel{font-size:11px;padding:2px 8px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;font-weight:500}
.btn{padding:6px 14px;border-radius:var(--r);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--purple);color:#fff;border-color:var(--purple)}.btn-p:hover{background:var(--pd)}
.btn-sm{padding:3px 9px;font-size:12px}.btn-danger{background:var(--rl);color:var(--rd);border-color:var(--rl)}
input[type=text],input[type=date],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
.flex{display:flex;align-items:center;gap:8px}
.flex-sb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:13px}
/* AI Assistant */
.ai-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--purple);color:#fff;border:none;cursor:pointer;font-size:22px;box-shadow:0 4px 16px rgba(83,74,183,.4);z-index:200;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.ai-fab:hover{transform:scale(1.08)}
.ai-panel{position:fixed;bottom:88px;right:24px;width:360px;max-height:520px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.ai-header{padding:12px 16px;background:var(--purple);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.ai-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.ai-msg-user{background:var(--pl);color:var(--pd);padding:8px 12px;border-radius:12px 12px 4px 12px;font-size:13px;align-self:flex-end;max-width:85%}
.ai-msg-ai{background:var(--bg);padding:8px 12px;border-radius:12px 12px 12px 4px;font-size:13px;align-self:flex-start;max-width:85%;line-height:1.5}
.ai-input-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px}
.ai-input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;resize:none;outline:none}
.ai-input:focus{border-color:var(--purple)}
.ai-send{padding:7px 14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r);cursor:pointer;font-size:13px;font-family:inherit;font-weight:500}
.ai-send:hover{background:var(--pd)}
.ai-send:disabled{opacity:.5;cursor:not-allowed}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.rr-choice-group{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.rr-choice{border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:999px;padding:7px 14px;font:500 12px inherit;cursor:pointer;transition:.15s}
.rr-choice:hover{border-color:var(--purple);color:var(--purple)}
.rr-choice.on{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 1px 4px rgba(83,74,183,.25)}
.rr-toggle{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:2px;cursor:pointer;color:var(--text2);font:500 12px inherit;white-space:nowrap}
.rr-toggle-track{position:relative;width:42px;height:23px;border-radius:999px;background:#c9c6c2;transition:.18s;flex:none}
.rr-toggle-knob{position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.18s}
.rr-toggle.on{color:var(--purple)}
.rr-toggle.on .rr-toggle-track{background:var(--purple)}
.rr-toggle.on .rr-toggle-knob{transform:translateX(19px)}
.rr-toggle-label{color:var(--text3);transition:.18s}
.rr-toggle:not(.on) .rr-toggle-off,.rr-toggle.on .rr-toggle-on{color:var(--purple);font-weight:600}

/* Vendor information */
.vendor-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:1rem}.vendor-head-info{grid-column:1}.vendor-tabs{grid-column:2;display:flex;gap:2px;background:var(--border);border-radius:var(--r);padding:2px}.vendor-head-actions{grid-column:3;justify-self:end}.vendor-tab{padding:6px 14px;border:0;background:transparent;border-radius:6px;color:var(--text2);cursor:pointer;font:500 13px inherit}.vendor-tab.on{background:var(--surface);color:var(--pd);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vendor-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.vendor-toolbar input,.vendor-toolbar select{width:auto;min-width:180px}.vendor-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);margin-bottom:10px;overflow:hidden}.vendor-group.dragging{opacity:.45;pointer-events:none}.vendor-group-placeholder{height:0;margin-bottom:10px;border:2px dashed var(--purple);border-radius:var(--rl2);transition:height .12s}.vendor-group-hdr{padding:10px 14px;background:var(--company-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}.vendor-group-title{font-size:14px;font-weight:600;flex:1}.vendor-drag-handle{color:var(--text3);font-size:16px;line-height:1;user-select:none;cursor:grab;touch-action:none}
.vendor-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}.vendor-row:last-child{border-bottom:0}.vendor-row:hover{background:#fafaf8}.vendor-main{flex:1;min-width:0}.vendor-name{font-size:13px;font-weight:500}.vendor-meta{font-size:11px;color:var(--text2);margin-top:3px;word-break:break-word}.vendor-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.vendor-company-search{position:relative}.vendor-company-suggestions{position:absolute;z-index:4;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 20px #0002;max-height:170px;overflow:auto}.vendor-company-suggestions button{display:block;width:100%;padding:8px 10px;border:0;border-bottom:1px solid var(--border);background:#fff;text-align:left;font:inherit;cursor:pointer}.vendor-company-suggestions button:hover{background:var(--company-1)}.vendor-company-suggestions small{display:block;color:var(--text2);margin-top:2px}
.vendor-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);max-height:210px;overflow:auto}.vendor-check{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}.vendor-check input{width:auto}.vendor-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.vendor-tag{font-size:10px;padding:2px 7px;border-radius:12px;background:var(--tl);color:var(--td)}.qr-box{text-align:center;padding-top:12px}.qr-box img{width:220px;height:220px;max-width:100%;border:8px solid #fff;box-shadow:0 1px 8px rgba(0,0,0,.12)}
.site-vendor-project{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);margin-bottom:12px;overflow:hidden}.site-vendor-project-hdr{padding:12px 15px;background:var(--company-1);color:var(--text);font-size:14px;font-weight:600}.site-vendor-category{padding:12px 15px;border-top:1px solid var(--border)}.site-vendor-category-title{font-size:14px;font-weight:600;margin:-12px -15px 8px;padding:10px 15px;background:var(--company-1)}.site-vendor-option{display:grid;grid-template-columns:minmax(180px,280px) minmax(200px,1fr);align-items:center;gap:10px;padding:6px 0}.site-vendor-option label{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}.site-vendor-option input[type=checkbox]{width:auto}.site-vendor-option input[type=text]{padding:6px 9px}.site-vendor-none{border-top:1px dashed var(--border);margin-top:4px;padding-top:9px}.site-vendor-hint{font-size:11px;color:var(--text3);margin:-4px 0 12px}
@media(max-width:700px){.vendor-head{display:flex;flex-direction:column;align-items:stretch}.vendor-head-info{text-align:left}.vendor-tabs{align-self:center;max-width:100%;overflow-x:auto}.vendor-head-actions{align-self:flex-end}.vendor-tab{padding:6px 10px;white-space:nowrap}.vendor-row{align-items:flex-start;flex-direction:column}.vendor-actions{justify-content:flex-start}.vendor-toolbar input,.vendor-toolbar select{width:100%}.site-vendor-option{grid-template-columns:1fr}.topnav{gap:.5rem}.nav-tab{padding:5px 9px}}


/* Design Progress */
.design-proj-row{border:1px solid var(--border);border-radius:var(--rl2);margin-bottom:8px;overflow:hidden}
.design-proj-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:var(--surface);user-select:none}
.design-proj-hdr:hover{background:var(--bg)}
.design-proj-arrow{font-size:12px;transition:transform .2s;flex-shrink:0;color:var(--text3)}
.design-proj-arrow.open{transform:rotate(90deg)}
.design-proj-name{font-size:13px;font-weight:500;flex:1}
.design-project-link{font-weight:500;color:var(--purple);cursor:pointer}
.design-project-link:hover{text-decoration:underline}
.design-warn{font-size:11px;color:var(--rd);margin-left:4px}
/* Sub-section for each field group */
.design-fields-row{border-top:1px solid var(--border);display:none}
.design-fields-row.open{display:block}
.design-fields-hdr{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;background:var(--bg);user-select:none}
.design-fields-hdr:hover{background:#f0eeec}
.design-fields-arrow{font-size:11px;transition:transform .2s;color:var(--text3)}
.design-fields-arrow.open{transform:rotate(90deg)}
.design-fields-body{display:none;overflow-x:auto;border-top:1px solid var(--border)}
.design-fields-body.open{display:block}
.design-tbl{border-collapse:collapse;table-layout:fixed}
.design-tbl th{padding:7px 10px;background:var(--bg);border:1px solid var(--border);font-weight:500;font-size:11px;color:var(--text2);text-align:center;white-space:nowrap;position:relative;min-width:0}
.design-tbl th .col-resize{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize}
.design-tbl th .col-resize:hover{background:var(--purple);opacity:.3}
.design-tbl th input.col-name-edit{border:none;background:transparent;font-size:11px;font-weight:500;color:var(--text2);width:calc(100% - 10px);text-align:center;font-family:inherit;padding:0}
.design-tbl th input.col-name-edit:focus{outline:none;background:var(--pl)}
.design-tbl td{border:1px solid var(--border);padding:0;vertical-align:top}
.design-tbl td input{border:none;padding:6px 8px;font-size:12px;width:100%;background:transparent;font-family:inherit}
.design-tbl td input:focus{outline:none;background:var(--pl)}
.design-tbl td.empty-cell{background:#fff8f8}

/* Week view */
.wctrl{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:2px;background:var(--border);border-radius:var(--r);padding:2px}
.seg button{padding:5px 12px;font-size:12px;border:none;background:none;cursor:pointer;border-radius:6px;color:var(--text2);font-family:inherit;font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav-row{display:flex;align-items:center;gap:6px}
.nav-btn{width:28px;height:28px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);cursor:pointer;font-size:14px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--bg)}
.wk-lbl{font-size:13px;font-weight:500;min-width:150px;text-align:center;cursor:pointer;padding:4px 8px;border-radius:var(--r)}
.wk-lbl:hover{background:var(--bg)}
.wtbl-wrap{overflow:auto;max-height:calc(100vh - 180px);border:1px solid var(--border);border-radius:var(--rl2)}
.hide-hscrollbar{scrollbar-width:none}
.hide-hscrollbar::-webkit-scrollbar{height:0}
.wtbl{border-collapse:collapse;font-size:12px;table-layout:fixed}
.wtbl th{padding:6px 4px;text-align:center;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);background:var(--bg);font-weight:500}
.wtbl th:first-child{position:sticky;left:0;top:0;z-index:15;background:var(--bg)}
.wtbl td{padding:3px;border:1px solid var(--border);vertical-align:top;background:var(--surface)}
.wtbl td.ev-cell{height:50px;overflow:visible}
.formula-bar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#fff;border:1px solid var(--border);border-bottom:2px solid var(--purple);margin-bottom:8px;border-radius:var(--r)}
.formula-bar.active{display:flex}
.formula-bar-label{font-size:11px;color:var(--text2);white-space:nowrap;min-width:80px}
.formula-bar-input{flex:1;border:none;background:transparent;font-size:13px;font-family:inherit;outline:none;color:var(--text)}
.wtbl td.tc{background:#faf9ff}
.wtbl th.th-t{color:var(--purple);font-weight:600}
.wtbl thead th{position:sticky;top:0;z-index:22;border-bottom:2px solid #1a1a1a}
.wtbl thead th:first-child{top:0}
.wtbl thead th:not(:first-child){font-size:14px;font-weight:700}
.site-hd{background:var(--bg)!important;font-size:12px;font-weight:500;padding:8px 10px!important;vertical-align:middle;width:200px;position:sticky;left:0;z-index:5;border-right:2px solid var(--border)}

/* Event */
.ev-row{display:flex;align-items:center;gap:2px;margin-bottom:2px;min-width:0;overflow:hidden}
.ev-row:hover .ev-del{opacity:.6}
.ev-field{font-size:11px;cursor:text;padding:4px 6px;border-radius:3px;min-width:0;min-height:16px;line-height:1.5;background:rgba(255,255,255,.6);color:inherit;flex:1;white-space:nowrap;overflow:hidden;text-overflow:clip}
.ev-field:empty{border:1px dashed rgba(0,0,0,.2)}
.ev-field:hover{background:rgba(255,255,255,.9)}
.ev-field[contenteditable=true]{outline:1.5px solid rgba(0,0,0,.2);background:#fff;min-width:44px;overflow-x:auto}
.ev-chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:1;max-width:55%;min-width:0;overflow:hidden;text-overflow:clip}
.ev-chip:hover{opacity:.85}
.ev-chip.sel{outline:2px solid var(--purple);outline-offset:1px}
.ev-del{opacity:0;font-size:11px;padding:1px 3px;cursor:pointer;border:none;background:none;color:inherit;line-height:1;flex-shrink:0}
.ev-del:hover{opacity:1!important}
.add-ev-wrap{position:relative;display:inline-block}
.add-ev-btn{color:var(--text3);font-size:11px;padding:2px 5px;cursor:pointer;display:inline-block;border-radius:3px;user-select:none}
.add-ev-btn:hover{color:var(--purple);background:var(--pl)}
.meeting-toolbar{position:sticky;left:8px;display:grid;grid-template-columns:104px 28px 57px max-content;align-items:center;white-space:nowrap;width:max-content}
.meeting-toolbar-title{font-size:12px;font-weight:600}
.meeting-toolbar-help{display:flex;align-items:center;justify-content:flex-start}
.meeting-color-controls{display:grid;grid-template-columns:max-content repeat(6,16px) max-content repeat(6,16px);align-items:center;column-gap:4px}
.meeting-color-label{font-size:11px;color:var(--text2);line-height:20px}
.meeting-color-label-bg{margin-left:2px}

/* Stage search popup - opens UP */
.stage-search-box{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.15);min-width:170px;z-index:500}
.stage-search-input{width:100%;padding:6px 10px;border:none;border-bottom:1px solid var(--border);font-size:12px;font-family:inherit;border-radius:var(--r) var(--r) 0 0;outline:none}

.stage-search-list{max-height:150px;overflow-y:auto}
.stage-search-item{padding:6px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border)}
.stage-search-item:last-child{border-bottom:none}
.stage-search-item:hover,.stage-search-item.hi{background:var(--pl);color:var(--pd)}

/* Daily log section */
.daily-section{margin-top:1rem;border:1px solid var(--border);border-radius:var(--rl2);overflow:hidden}
.daily-section-hdr{padding:10px 16px;background:var(--bg);font-size:13px;font-weight:500;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-start;gap:4px}
.daily-section-title{width:180px;flex:none}
.inline-link{color:#1155cc;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.smart-link-wrap{position:relative;display:inline}.smart-link-card{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:120;width:290px;padding:10px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:0 5px 18px rgba(0,0,0,.18);color:var(--text);text-decoration:none}.smart-link-wrap:hover .smart-link-card,.smart-link-wrap:focus-within .smart-link-card{display:block}.smart-link-title{font-size:12px;font-weight:600;color:#1155cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.smart-link-url{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.smart-link-open{display:inline-block;margin-top:8px;padding:4px 9px;border-radius:14px;background:#e8f0fe;color:#174ea6;font-size:11px;font-weight:600}
.daily-log-table{border-collapse:collapse;table-layout:fixed}
.daily-log-table th{padding:6px 4px;text-align:center;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);background:var(--bg);font-weight:500;position:sticky;top:0;z-index:10}
.daily-log-table th:first-child{position:sticky;left:0;top:0;z-index:15;background:var(--bg)}
.daily-log-table td{padding:3px;border:1px solid var(--border);background:var(--surface);vertical-align:top}
.daily-log-table td.log-name-cell{background:var(--bg);font-size:12px;font-weight:500;padding:6px 10px;position:sticky;left:0;z-index:5;border-right:2px solid var(--border);width:200px}
.daily-member-name{display:flex;align-items:flex-start;gap:8px}
.daily-member-draggable{cursor:grab;user-select:none}
.daily-member-draggable:active{cursor:grabbing}
.log-textarea{width:100%;height:80px;border:none;resize:none;font-size:11px;font-family:inherit;padding:4px 6px;background:transparent;color:var(--text);line-height:1.4}
.log-textarea:focus{outline:none;background:#faf9ff}
.log-textarea.today{background:#faf9ff}

/* Private todo */
.private-section{margin-top:0;border:1px solid var(--border);border-radius:0 0 var(--rl2) var(--rl2);overflow:hidden}
.private-section-hdr{padding:10px 16px;background:#fff8f8;font-size:13px;font-weight:500;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.help-wrap{position:relative;display:inline-flex;align-items:center}
.help-btn{width:19px;height:19px;padding:0;border:1px solid #b9b3d9;border-radius:50%;background:var(--surface);color:var(--purple);font-size:11px;font-weight:700;line-height:17px;cursor:pointer}
.help-btn:hover{background:var(--pl)}
.help-pop{display:none;position:absolute;left:0;top:25px;width:300px;max-width:min(300px,80vw);padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:160;color:var(--text);font-size:11px;font-weight:400;white-space:normal}

.private-todo-table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:700px}
.private-todo-table th{padding:6px 4px;text-align:center;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);background:var(--bg);font-weight:500;position:sticky;top:0;z-index:10}
.private-todo-table th:first-child{position:sticky;left:0;top:0;z-index:15;background:var(--bg)}
.private-todo-table td{border:1px solid var(--border);vertical-align:top;background:var(--surface);padding:4px}
.private-todo-table td.ptd-label{background:var(--bg);font-size:12px;font-weight:500;padding:6px 10px;position:sticky;left:0;z-index:5;border-right:2px solid var(--border);width:200px}
.ptd-item{margin-bottom:4px}
.ptd-add-btn{font-size:11px;color:var(--text3);cursor:pointer;padding:2px 4px;display:block;text-align:left;border:none;background:none;font-family:inherit}

.private-divider{border-top:3px solid #1a1a1a;margin:0}

/* Bible */
.bible-wrap{display:grid;grid-template-columns:240px 1fr;gap:1rem;min-height:500px}
.bible-stages{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);overflow:hidden}

.bib-item-text{flex:1;font-size:13px}

.bib-item-add{color:var(--text3);cursor:pointer;font-size:15px;padding:0 4px;border:none;background:none}
.bib-item-add:hover{color:var(--purple)}
.bib-add-row{display:flex;gap:8px;margin-top:8px}
.bib-add-row input{flex:1}
.ws-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.ws-tab.active{background:var(--pl);color:var(--pd);border-color:var(--pl)}
.ws-cl-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.ws-cl-item:last-child{border-bottom:none}

.ws-cl-item label{font-size:13px;cursor:pointer;flex:1;line-height:1.4}
.ck-btns{display:flex;gap:4px;flex-shrink:0}
.ck-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--text3);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ck-btn.on-done{background:var(--teal);border-color:var(--teal);color:#fff}
.ck-btn.on-skip{background:var(--text3);border-color:var(--text3);color:#fff}
.ck-amount{width:80px;flex-shrink:0;font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-family:inherit;text-align:right}

/* Members */
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl2);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.member-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0}
.member-info{flex:1;min-width:120px}
.member-name{font-size:13px;font-weight:500}
.member-email{font-size:11px;color:var(--text2)}
.role-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.role-admin{background:var(--pl);color:var(--pd)}
.role-manager{background:#FCEBEB;color:var(--red)}
.role-staff{background:var(--gl);color:var(--gd)}
.role-pending{background:var(--al);color:var(--ad)}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:300;padding:1rem}
.mo-box{background:var(--surface);border-radius:var(--rl2);padding:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.mo-title{font-size:15px;font-weight:600;margin-bottom:4px}
.mo-sub{font-size:12px;color:var(--text2);margin-bottom:12px}
.mo-footer{margin-top:14px;display:flex;gap:8px;justify-content:flex-end}
.mo-box.project-detail-modal{max-width:860px;overflow:hidden}
.project-detail-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:20px;margin-top:8px;max-height:65vh}
.project-detail-main,.project-detail-trades{min-width:0;overflow-y:auto;padding-right:4px}
.project-detail-trades{border-left:1px solid var(--border);padding-left:20px}
.project-detail-trades-title{font-size:13px;font-weight:600;margin-bottom:8px}
.project-detail-trades-list{font-size:12px;line-height:1.7;word-break:break-word}
.project-detail-empty{font-size:12px;color:var(--text3)}
@media(max-width:760px){.mo-box.project-detail-modal{max-width:560px;overflow-y:auto}.project-detail-grid{grid-template-columns:1fr;max-height:none}.project-detail-main,.project-detail-trades{overflow:visible}.project-detail-trades{border-left:0;border-top:1px solid var(--border);padding:14px 0 0}}
.pb-wrap{background:var(--bg);border-radius:4px;height:4px;margin-bottom:12px}
.pb-fill{height:4px;border-radius:4px}
</style>
</head>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
import{getFirestore,collection,doc,addDoc as fbAddDoc,updateDoc as fbUpdateDoc,deleteDoc as fbDeleteDoc,setDoc as fbSetDoc,getDoc as fbGetDoc,onSnapshot,serverTimestamp,getDocs as fbGetDocs,writeBatch as fbWriteBatch,query,where}from"https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut as fbSignOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.9.0/firebase-auth.js";

const FC={apiKey:"AIzaSyA6W_C2H84heiVwDe_a6ElMwuEjvbR0aRo",authDomain:"have000.firebaseapp.com",projectId:"have000",storageBucket:"have000.firebasestorage.app",messagingSenderId:"758420593792",appId:"1:758420593792:web:29f485e949eca0ce031a65"};
const app=initializeApp(FC);
const db=getFirestore(app);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

let currentUser=null,currentRole=null;
const IS_LOCAL_PREVIEW=location.protocol==='file:'||['127.0.0.1','localhost'].includes(location.hostname);
let localTestMode=false;
let S={projects:[],checks:{},bible:{},bibleOrder:[],members:[],dailyLogs:{},privateNotes:{work:{},personal:{}},dateColors:{},meetingLogs:{},globalNotes:{},userTodos:[],tradeCategories:[],tradeVendors:[],otherVendorCategories:[],otherVendors:[],projectTradeSelections:{}};
let userPrefs={todoProjects:[]};
let localRenderTimer=null;
function localClone(v){return v===undefined?v:JSON.parse(JSON.stringify(v));}
function localPath(ref){return String(ref?.path||'').replace(/^\/+|\/+$/g,'');}
function localParts(ref){const p=localPath(ref).split('/');return{collection:p[0]||'',id:p.slice(1).join('/')};}
function localFindArray(collectionName,id){
  const arr=collectionName==='projects'?S.projects:collectionName==='members'?S.members:collectionName==='userTodos'?S.userTodos:collectionName==='tradeCategories'?S.tradeCategories:collectionName==='tradeVendors'?S.tradeVendors:collectionName==='otherVendorCategories'?S.otherVendorCategories:collectionName==='otherVendors'?S.otherVendors:null;
  if(!arr)return null;
  return arr.find(x=>String(x.id)===id||String(x.uid)===id)||null;
}
function localRead(collectionName,id){
  if(['projects','members','userTodos','tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName))return localFindArray(collectionName,id);
  if(collectionName==='checks')return S.checks[id];
  if(collectionName==='bible')return id==='orderConfig'?{order:S.bibleOrder}:S.bible[id];
  if(collectionName==='dailyLogs')return S.dailyLogs[id];
  if(collectionName==='meetingLogs')return S.meetingLogs[id];
  if(collectionName==='globalNotes')return S.globalNotes[id];
  if(collectionName==='projectTradeSelections')return{categories:S.projectTradeSelections[id]||{}};
  if(collectionName==='privateNotes')return S.privateNotes;
  if(collectionName==='userPrefs')return userPrefs;
  if(collectionName==='settings'){
    if(id==='designCols')return{cols:designCols||DEFAULT_DESIGN_COLS};
    if(id==='designColWidths')return{widths:designColWidths};
    if(id==='designProjectOrder')return{order:designProjectOrder};
    if(id==='dateColors')return{colors:S.dateColors};
  }
  return undefined;
}
function localWrite(collectionName,id,data,merge=false){
  const value=localClone(data)||{};
  if(['projects','members','userTodos','tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName)){
    const arr=collectionName==='projects'?S.projects:collectionName==='members'?S.members:collectionName==='userTodos'?S.userTodos:collectionName==='tradeCategories'?S.tradeCategories:collectionName==='tradeVendors'?S.tradeVendors:collectionName==='otherVendorCategories'?S.otherVendorCategories:S.otherVendors;
    const existing=localFindArray(collectionName,id);
    if(existing)Object.assign(existing,merge?value:{...value,id:existing.id||id});
    else arr.push({...value,id,uid:collectionName==='members'?(value.uid||id):value.uid});
  }else if(collectionName==='checks')S.checks[id]=merge?{...(S.checks[id]||{}),...value}:value;
  else if(collectionName==='bible'){
    if(id==='orderConfig')S.bibleOrder=[...(value.order||[])];
    else S.bible[id]=merge?{...(S.bible[id]||{}),...value}:value;
  }else if(collectionName==='dailyLogs')S.dailyLogs[id]=merge?{...(S.dailyLogs[id]||{}),...value}:value;
  else if(collectionName==='meetingLogs')S.meetingLogs[id]=merge?{...(S.meetingLogs[id]||{}),...value}:value;
  else if(collectionName==='globalNotes')S.globalNotes[id]=merge?{...(S.globalNotes[id]||{}),...value}:value;
  else if(collectionName==='projectTradeSelections')S.projectTradeSelections[id]=localClone(value.categories||{});
  else if(collectionName==='privateNotes')S.privateNotes=merge?{...(S.privateNotes||{}),...value}:value;
  else if(collectionName==='userPrefs')userPrefs=merge?{...userPrefs,...value}:value;
  else if(collectionName==='settings'){
    if(id==='designCols')designCols=value.cols||DEFAULT_DESIGN_COLS;
    else if(id==='designColWidths')designColWidths=value.widths||{};
    else if(id==='designProjectOrder')designProjectOrder=value.order||[];
    else if(id==='dateColors')S.dateColors=value.colors||{};
  }
}
function localDelete(collectionName,id){
  if(collectionName==='projects')S.projects=S.projects.filter(x=>String(x.id)!==id);
  else if(collectionName==='members')S.members=S.members.filter(x=>String(x.id)!==id&&String(x.uid)!==id);
  else if(collectionName==='userTodos')S.userTodos=S.userTodos.filter(x=>String(x.id)!==id);
  else if(collectionName==='checks')delete S.checks[id];
  else if(collectionName==='bible'){delete S.bible[id];S.bibleOrder=S.bibleOrder.filter(x=>x!==id);}

function localNotify(){
  clearTimeout(localRenderTimer);
  localRenderTimer=setTimeout(()=>{if(localTestMode&&typeof renderActive==='function')renderActive();},0);
}
async function setDoc(ref,data,options){
  if(!localTestMode)return fbSetDoc(ref,data,options);
  const{collection:collectionName,id}=localParts(ref);localWrite(collectionName,id,data,!!options?.merge);localNotify();return;
}
async function updateDoc(ref,data){
  if(!localTestMode)return fbUpdateDoc(ref,data);
  const{collection:collectionName,id}=localParts(ref);localWrite(collectionName,id,data,true);localNotify();return;
}
async function deleteDoc(ref){
  if(!localTestMode)return fbDeleteDoc(ref);
  const{collection:collectionName,id}=localParts(ref);localDelete(collectionName,id);localNotify();return;
}
async function addDoc(ref,data){
  if(!localTestMode)return fbAddDoc(ref,data);
  const collectionName=localPath(ref).split('/')[0];const id=`local-${collectionName}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
  localWrite(collectionName,id,data,false);localNotify();return{id,path:`${collectionName}/${id}`};
}
async function getDoc(ref){
  if(!localTestMode)return fbGetDoc(ref);
  const{collection:collectionName,id}=localParts(ref);const value=localRead(collectionName,id);
  return{id,ref,exists:()=>value!==undefined,data:()=>localClone(value)};
}
async function getDocs(ref){
  if(!localTestMode)return fbGetDocs(ref);
  const collectionName=localPath(ref).split('/')[0];let entries=[];
  if(collectionName==='projects')entries=S.projects.map(x=>[x.id,x]);
  else if(collectionName==='members')entries=S.members.map(x=>[x.id||x.uid,x]);
  else if(collectionName==='userTodos')entries=S.userTodos.map(x=>[x.id,x]);
  else if(collectionName==='checks')entries=Object.entries(S.checks);
  else if(collectionName==='bible')entries=Object.entries(S.bible);
  else if(collectionName==='projectTradeSelections')entries=Object.entries(S.projectTradeSelections).map(([id,categories])=>[id,{categories}]);
  else if(['tradeCategories','tradeVendors','otherVendorCategories','otherVendors'].includes(collectionName))entries=S[collectionName].map(x=>[x.id,x]);
  return{docs:entries.map(([id,value])=>({id,ref:doc(db,collectionName,id),data:()=>localClone(value)}))};
}
function writeBatch(database){
  if(!localTestMode)return fbWriteBatch(database);
  const ops=[];return{
    set:(ref,data,options)=>ops.push(()=>setDoc(ref,data,options)),
    update:(ref,data)=>ops.push(()=>updateDoc(ref,data)),
    delete:(ref)=>ops.push(()=>deleteDoc(ref)),
    commit:async()=>{for(const op of ops)await op();}
  };
}

function isAdmin(){return currentRole==='admin'||currentRole==='manager'}
function memberDisplayName(m){if(!m)return'成員';return m.displayName||m.name||(m.email?m.email.split('@')[0]:'成員');}
function memberTag(m){if(!m)return'?';if(m.tagInitial)return m.tagInitial;return memberDisplayName(m).charAt(0);}
function activeMembersList(){return S.members.filter(m=>(m.role==='admin'||m.role==='staff'||m.role==='manager')&&m.status!=='resigned');}
function markableMembersList(){return activeMembersList().filter(m=>m.role!=='manager');}
// Daily work log rows exclude the "管理員" (company/manager account) role —
// that role doesn't do site work, so it shouldn't be asked to log it.
function dailyLogMembersList(){return markableMembersList();}
function orderedDailyLogMembers(){
  const members=dailyLogMembersList();
  const saved=Array.isArray(S.privateNotes&&S.privateNotes.dailyLogMemberOrder)?S.privateNotes.dailyLogMemberOrder:[];
  const rank=new Map(saved.map((uid,i)=>[uid,i]));
  return members.slice().sort((a,b)=>{
    const ar=rank.has(a.uid)?rank.get(a.uid):Number.MAX_SAFE_INTEGER;
    const br=rank.has(b.uid)?rank.get(b.uid):Number.MAX_SAFE_INTEGER;
    return ar-br;
  });
}
let dailyMemberDragUid=null;
window.dailyMemberDragStart=function(e,uid){
  if(currentRole!=='manager'){e.preventDefault();return;}
  dailyMemberDragUid=uid;e.dataTransfer.effectAllowed='move';
};
window.dailyMemberDragOver=function(e){if(currentRole==='manager'&&dailyMemberDragUid){e.preventDefault();e.dataTransfer.dropEffect='move';}};
window.dailyMemberDrop=async function(e,targetUid){
  e.preventDefault();
  if(currentRole!=='manager'||!dailyMemberDragUid||dailyMemberDragUid===targetUid)return;
  const members=orderedDailyLogMembers();
  const from=members.findIndex(m=>m.uid===dailyMemberDragUid),to=members.findIndex(m=>m.uid===targetUid);
  if(from<0||to<0||!currentUser)return;
  const moved=members.splice(from,1)[0];members.splice(to,0,moved);dailyMemberDragUid=null;
  if(!S.privateNotes)S.privateNotes={work:{},personal:{}};
  S.privateNotes.dailyLogMemberOrder=members.map(m=>m.uid);
  setSyncing();
  await setDoc(doc(db,'privateNotes',currentUser.uid),S.privateNotes);
  setSynced();
  if(activePanel==='progress')renderProgress();
};
const DEFAULT_DESIGN_COL_NAMES=['會議人員','平面圖','客變圖','3D圖','施工圖','報價單'];
const DEFAULT_DESIGN_COLS=[
  ...DEFAULT_DESIGN_COL_NAMES.map(name=>({name,kind:'member',collapsible:true})),
  {name:'備註',kind:'note',collapsible:false},
  ...Array.from({length:20},(_,i)=>({name:String(i+1),kind:'text',collapsible:false}))
];
// Keep the production Firebase structure and local preview structure identical.
// Legacy columns keep their original storage key so renaming 欄位7… to 1…20
// never discards data already saved in project.designProgress.
function normalizeDesignCols(raw){
  const source=(Array.isArray(raw)&&raw.length?raw:DEFAULT_DESIGN_COLS).map(c=>{
    if(typeof c==='string')return{name:c,key:c,kind:DEFAULT_DESIGN_COL_NAMES.includes(c)?'member':'text',collapsible:DEFAULT_DESIGN_COL_NAMES.includes(c)};
    return{...c,key:c.key||c.name};
  });
  const existingBlue=source.filter(c=>c.collapsible||c.kind==='member');
  const defaultBlue=DEFAULT_DESIGN_COL_NAMES.map(name=>({name,key:name,kind:'member',collapsible:true}));
  const blue=Array.from({length:6},(_,i)=>({...defaultBlue[i],...(existingBlue[i]||{}),collapsible:true,kind:'member'}));
  const red=source.filter(c=>!c.collapsible&&c.kind!=='member');
  const oldNote=red.find(c=>c.kind==='note'||c.name==='備註');
  const legacyNumbered=red.filter(c=>c!==oldNote);
  const note={name:'備註',key:oldNote?.key||oldNote?.name||'備註',kind:'note',collapsible:false};
  const numbered=Array.from({length:20},(_,i)=>{
    const display=String(i+1);
    const exact=legacyNumbered.find(c=>c.name===display);
    const legacy=exact||legacyNumbered[i];
    return{name:display,key:legacy?.key||legacy?.name||display,kind:'text',collapsible:false};
  });
  return[...blue,note,...numbered];
}
function getDesignCols(){
  const raw=designCols||DEFAULT_DESIGN_COLS;
  return normalizeDesignCols(raw);
}

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function isSameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function fmtDate(d){return`${d.getMonth()+1}/${d.getDate()}`}
function fmtDay(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function today(){return new Date()}
function getWeekDates(){
  if(calMode==='month')return getMonthDates();
  const b=today();const dow=b.getDay();const diff=dow===0?-6:1-dow;const mon=addDays(b,diff+weekOffset*7);return Array.from({length:7},(_,i)=>addDays(mon,i));
}
function getMonthDates(){
  const b=today();
  const target=new Date(b.getFullYear(),b.getMonth()+monthOffset,1);
  const y=target.getFullYear(),m=target.getMonth();
  const daysInMonth=new Date(y,m+1,0).getDate();
  return Array.from({length:daysInMonth},(_,i)=>new Date(y,m,i+1));
}

function getBibleStages(){
  if(S.bibleOrder&&S.bibleOrder.length)return[...new Set(S.bibleOrder)];
  return Object.keys(S.bible).filter(k=>k!=='orderConfig');
}
function displayStageName(stage){
  return String(stage||'').replace(/^.*?、\s*/,'').trim();
}
function getBiblePhaseItems(stage,phase){const b=S.bible[stage];return(b&&b[phase])?b[phase]:[];}
// A bible item used to always be a plain string. It can now be an object
// {text, subs:[...]} so it can carry indented sub-items. This normalizes
// either shape so the rest of the code only has to handle one format.
function normalizeBibleItem(it){
  if(typeof it==='string')return{text:it,subs:[]};
  return{text:it?.text||'',subs:Array.isArray(it?.subs)?it.subs:[]};
}
function flattenPhaseItems(rawArr,depth){
  depth=depth||0;
  const flat=[];
  (rawArr||[]).forEach(it=>{
    const n=normalizeBibleItem(it);
    flat.push({text:n.text,depth:depth,isSub:depth>0});
    flat.push(...flattenPhaseItems(n.subs,depth+1));
  });
  return flat;
}
function flatPhaseCount(rawArr){return(rawArr||[]).reduce((s,it)=>s+1+flatPhaseCount(normalizeBibleItem(it).subs),0);}
// Path-based helpers so items can nest to any depth (item -> sub-item ->
// sub-sub-item ...). A path is an array of indices, e.g. [2] is the 3rd
// top-level item, [2,0] is its 1st sub-item, [2,0,1] its 2nd sub-sub-item.
function replaceAtPath(arr,path,newNode){
  const copy=[...arr];
  if(path.length===1){copy[path[0]]=newNode;return copy;}
  const cur=normalizeBibleItem(copy[path[0]]);
  copy[path[0]]={text:cur.text,subs:replaceAtPath(cur.subs,path.slice(1),newNode)};
  return copy;
}
function addChildAtPath(arr,path,text){
  const copy=[...arr];
  const cur=normalizeBibleItem(copy[path[0]]);
  if(path.length===1){
    copy[path[0]]={text:cur.text,subs:[...cur.subs,text]};
  }else{
    copy[path[0]]={text:cur.text,subs:addChildAtPath(cur.subs,path.slice(1),text)};
  }
  return copy;
}
function removeAtPath(arr,path){
  const copy=[...arr];
  if(path.length===1){copy.splice(path[0],1);return copy;}
  const cur=normalizeBibleItem(copy[path[0]]);
  copy[path[0]]={text:cur.text,subs:removeAtPath(cur.subs,path.slice(1))};
  return copy;
}
function getNodeAtPath(arr,path){
  let node=arr[path[0]];
  for(let k=1;k<path.length;k++)node=normalizeBibleItem(node).subs[path[k]];
  return node;
}
function flatIndexAtPath(data,phase,path){
  const before=data.before||[],during=data.during||[];
  let offset=0;
  if(phase!=='before')offset+=flatPhaseCount(before);
  if(phase==='after')offset+=flatPhaseCount(during);
  let arr=data[phase]||[];
  for(let level=0;level<path.length;level++){
    const idx=path[level];
    for(let i=0;i<idx;i++)offset+=1+flatPhaseCount(normalizeBibleItem(arr[i]).subs);
    if(level<path.length-1){
      offset+=1;
      arr=normalizeBibleItem(arr[idx]).subs;
    }
  }
  return offset;
}
function getAllBibleItemsMeta(stage){
  const b=S.bible[stage]||{before:[],during:[],after:[]};
  return[...flattenPhaseItems(b.before),...flattenPhaseItems(b.during),...flattenPhaseItems(b.after)];
}
function getAllBibleItems(stage){return getAllBibleItemsMeta(stage).map(x=>x.text);}
// For a completed project, use the frozen snapshot taken when it was marked
// done, so later edits to the live 施工寶典 template don't shift/relabel
// its already-checked items. Active projects always use the live template.
function projectBibleData(proj,stage){
  if(proj&&proj.status==='done'&&proj.bibleSnapshot&&proj.bibleSnapshot[stage])return proj.bibleSnapshot[stage];
  return S.bible[stage]||{before:[],during:[],after:[]};
}
function projectBibleItemsMeta(proj,stage){
  const b=projectBibleData(proj,stage);
  return[...flattenPhaseItems(b.before),...flattenPhaseItems(b.during),...flattenPhaseItems(b.after)];
}
function projectBibleItems(proj,stage){return projectBibleItemsMeta(proj,stage).map(x=>x.text);}
function pendingCount(projId,stage){
  if(!stage)return null;
  const proj=S.projects.find(p=>p.id===projId);
  const items=projectBibleItems(proj,stage);if(!items.length)return null;
  const stored=S.checks[`${projId}_${stage}`]||[];
  return items.length-items.filter((_,i)=>stored[i]?.done||stored[i]?.skip).length;
}
function pendBadge(n){
  if(n===null)return'';
  if(n===0)return`<span class="pend pend-g">✓</span>`;
  return`<span class="pend pend-r">${n}</span>`;
}
// Shared row renderer for a bible checklist item — ✓ means done, ✗ means
// "seen but not applicable to this site". Both count as resolved. Sub-items
// (item.isSub) render indented under their parent.
function renderCheckItemRow(projId,stage,idx,item,isEstimate){
  const cls=item.done?'done':(item.skip?'skip':'');
  const depth=item.depth||(item.isSub?1:0);
  return`<div class="ws-cl-item ${cls}"${depth>0?` style="padding-left:${depth*26}px"`:''}>
    <div class="ck-btns">
      <button type="button" class="ck-btn ${item.done?'on-done':''}" title="完成" onclick="setCheckStatus('${projId}','${stage}',${idx},'done')">✓</button>
      <button type="button" class="ck-btn ${item.skip?'on-skip':''}" title="不適用" onclick="setCheckStatus('${projId}','${stage}',${idx},'skip')">✗</button>
    </div>
    <label>${depth>0?'└ ':''}${item.text}</label>
    ${isEstimate?`<input type="number" class="ck-amount" placeholder="金額" value="${item.amount||''}" onclick="event.stopPropagation()" onchange="setCheckAmount('${projId}','${stage}',${idx},this.value)">`:''}
  </div>`;
}

function renderSiteReport(projId){

  const meetingEntries=getMeetingEntriesForProject(p.name);
  return`
  <button class="btn btn-sm" onclick="closeSiteReport()">← 返回案件總覽</button>

    <div class="card-hdr"><span class="card-title">📖 施工寶典勾選結果</span></div>
    ${(()=>{

        const stored=S.checks[`${p.id}_${s}`]||[];
        return stored.some(x=>x&&(x.done||x.skip));
      });
      if(!touchedStages.length)return'<div class="empty">尚無勾選紀錄</div>';
      return touchedStages.map(s=>{
        const metaItems=projectBibleItemsMeta(p,s);
        if(!metaItems.length)return'';
        const stored=S.checks[`${p.id}_${s}`]||[];
        const done=metaItems.filter((_,i)=>stored[i]?.done||stored[i]?.skip).length;
        return`<div style="margin-bottom:14px">
          <div style="font-size:13px;font-weight:600;margin-bottom:4px">${s}（${done}/${metaItems.length}）</div>

            const st=stored[i]||{};

          }).join('')}
        </div>`;
      }).join('');
    })()}

  <div class="card">
    <div class="card-hdr"><span class="card-title">🏗 工地進度</span></div>
    ${schedule.length?schedule.map(ev=>`<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">
      <strong>${ev.date}</strong>　${ev.time||''}　${ev.label||ev.stage||''}${ev.note?'　— '+ev.note:''}
    </div>`).join(''):'<div class="empty">尚無工地進度紀錄</div>'}

    <div class="card-hdr"><span class="card-title">🗓 會議 / 其他事項</span></div>
    ${meetingEntries.length?meetingEntries.map(e=>`<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">
      <strong>${e.date}</strong>　［${e.rowLabel}］　${e.text}
    </div>`).join(''):'<div class="empty">沒有標記這個工地的會議/其他事項紀錄</div>'}
  </div>`;
}
function getMeetingEntriesForProject(projName){
  const out=[];
  Object.keys(S.meetingLogs||{}).forEach(key=>{
    const log=S.meetingLogs[key];
    if(!log||!log.items)return;
    const rowInfo=MEETING_ROWS.find(r=>r.id===log.rowId);
    (log.items||[]).forEach(item=>{
      const m=(item.text||'').match(/\[proj:([^\]]+)\]/);
      if(m&&m[1]===projName){
        out.push({date:log.date,rowLabel:rowInfo?rowInfo.name:(log.rowId||''),text:(item.text||'').replace(/\[proj:[^\]]+\]/g,'').trim()});
      }
    });
  });
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return out;
}
window.updateStatus=async function(projId,v,completionTypes,inspDate){
  setSyncing();
  const patch={status:v};
  if(v==='done'){
    if(completionTypes)patch.completionTypes=completionTypes;
    if(inspDate)patch.initialInspectionDate=inspDate;
    const proj=S.projects.find(p=>p.id===projId);
    if(!proj||!proj.bibleSnapshot){
      const snap={};
      getBibleStages().forEach(s=>{
        const b=S.bible[s]||{before:[],during:[],after:[]};
        snap[s]={before:[...(b.before||[])],during:[...(b.during||[])],after:[...(b.after||[])]};
      });
      patch.bibleSnapshot=snap;
    }
  }
  await updateDoc(doc(db,'projects',projId),patch);
  setSynced();
}

document.addEventListener('wheel',function(e){
  if(activePanel!=='design'||!e.shiftKey)return;
  const wrap=$('design-scroll-wrap');
  if(!wrap||wrap.scrollWidth<=wrap.clientWidth)return;
  const delta=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  if(!delta)return;
  e.preventDefault();
  wrap.scrollLeft+=delta;

  if(col.kind==='member'){
    const memberIds=Array.isArray(val)?val:(val?[val]:[]);

    return`<td style="text-align:center">
      <div style="display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:3px">
        ${selectedMembers.map(m=>`<span style="display:inline-flex;align-items:center;gap:4px;background:var(--pl);color:var(--pd);padding:3px 9px;border-radius:12px;font-size:12px">${memberDisplayName(m)}<span onclick="dcToggleMember('${p.id}','${colKey}','${m.uid}',false)" style="cursor:pointer;font-weight:700">×</span></span>`).join('')}

    </td>`;
  }

    return`<td class="${!val.trim()?'empty-cell':''}">
      <input type="text" class="design-cell-input" id="dcell-${p.id}-${colKey}" value="${escAttr(val)}" placeholder="輸入備註" autocomplete="off"
        onblur="saveDesignField('${p.id}','${colKey}',this.value)"
        onkeydown="if(event.key==='Enter')this.blur()">
    </td>`;
  }
  const dateVal=dp[colKey+'__date']||'';
  const dparts=dateVal.split('-');
  const dy=dp[colKey+'__date_y']!==undefined?dp[colKey+'__date_y']:(dparts[0]||'');
  const dm=dp[colKey+'__date_m']!==undefined?dp[colKey+'__date_m']:(dparts[1]?parseInt(dparts[1],10):'');

  </div>`;
  // text column — supports #stage to link a 施工寶典 stage's checklist
  if(val.startsWith('#')){
    const stage=val.slice(1);
    if(getBibleStages().includes(stage)){
      const key=`${p.id}_${stage}`;const stored=S.checks[key]||[];

  // re-render will remove it from the DOM, and removing a focused element
  // fires a native blur on it — which would otherwise re-save whatever

// Global sticky notepad — visible only to the current user. One text box,
// like 每日施工日誌. Whatever you type is saved under the month you're
// currently viewing; a month with no edit of its own just inherits the
// text from the nearest earlier month that has one, so editing "forks"
// forward from that point without touching earlier months' saved text.
function getGlobalNoteText(viewMonth){
  if(!currentUser)return'';
  const prefix=currentUser.uid+'_';
  const months=Object.keys(S.globalNotes||{})
    .filter(k=>k.indexOf(prefix)===0)
    .map(k=>k.slice(prefix.length))
    .filter(m=>m<=viewMonth)
    .sort();
  if(!months.length)return'';
  return S.globalNotes[prefix+months[months.length-1]].text||'';
}

let dailyAssignMemberUids=[];
function renderDailyAssignBar(days){
  if(!currentUser||!days.length)return'';
  const base=days[Math.floor(days.length/2)];
  const yyyy=base.getFullYear(),mm=String(base.getMonth()+1).padStart(2,'0');
  const monthStart=`${yyyy}-${mm}-01`;
  const monthEnd=`${yyyy}-${mm}-${String(new Date(yyyy,base.getMonth()+1,0).getDate()).padStart(2,'0')}`;
  const td=today();
  const defaultDate=(td.getFullYear()===yyyy&&td.getMonth()===base.getMonth())?fmtDay(td):monthStart;
  const members=dailyLogMembersList();
  return`<div style="display:flex;align-items:center;gap:6px;position:relative;font-weight:400">
    <input type="date" id="daily-assign-date" min="${monthStart}" max="${monthEnd}" value="${defaultDate}" style="width:128px;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:11px">
    <input type="text" id="daily-assign-text" placeholder="輸入指派任務" style="width:180px;padding:4px 7px;border:1px solid var(--border);border-radius:5px;font-size:11px">
    <button class="btn btn-sm" type="button" onclick="toggleDailyAssignPicker(event)">標記（可複選）</button>
    <span id="daily-assign-summary" style="font-size:10px;color:var(--purple);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
    <button class="btn btn-sm btn-p" type="button" onclick="submitDailyAssignment()">新增</button>
    <div id="daily-assign-picker" style="display:none;position:absolute;right:42px;top:32px;width:190px;max-height:230px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:7px;box-shadow:0 5px 18px rgba(0,0,0,.15);padding:7px;z-index:80">
      ${members.map(m=>`<label style="display:flex;align-items:center;gap:7px;padding:5px 4px;font-size:11px;cursor:pointer"><input type="checkbox" value="${m.uid}" ${dailyAssignMemberUids.includes(m.uid)?'checked':''} onchange="toggleDailyAssignMember('${m.uid}',this.checked)">${memberDisplayName(m)}</label>`).join('')}
    </div>
  </div>`;
}
window.toggleDailyAssignPicker=function(event){
  event.stopPropagation();
  const el=$('daily-assign-picker');if(el)el.style.display=el.style.display==='block'?'none':'block';
}
window.toggleDailyAssignMember=function(uid,checked){
  if(checked&&!dailyAssignMemberUids.includes(uid))dailyAssignMemberUids.push(uid);
  if(!checked)dailyAssignMemberUids=dailyAssignMemberUids.filter(x=>x!==uid);
  const names=dailyAssignMemberUids.map(uid=>memberDisplayName(S.members.find(m=>m.uid===uid))).filter(Boolean);
  const el=$('daily-assign-summary');if(el)el.textContent=names.join('、');
}
window.submitDailyAssignment=async function(){
  if(!currentUser)return;
  const dateEl=$('daily-assign-date'),textEl=$('daily-assign-text');
  const ds=dateEl?dateEl.value:'';const task=textEl?textEl.value.trim():'';
  if(!ds||!task){alert('請先選擇日期並輸入指派任務');return;}
  if(!dailyAssignMemberUids.length){alert('請至少標記一位成員');return;}
  setSyncing();
  for(const uid of dailyAssignMemberUids){
    const key=uid+'_'+ds;const cur=S.dailyLogs[key]||{};
    const list=(cur.assigned||[]).slice();
    list.push({id:'a'+Date.now()+'_'+uid,text:task,authorUid:currentUser.uid});
    await setDoc(doc(db,'dailyLogs',key),Object.assign({},cur,{uid,date:ds,assigned:list}));
  }
  dailyAssignMemberUids=[];
  setSynced();
  if(activePanel==='progress')renderProgress();
}
function renderDailyLogSection(days){
  const td=today();
  const activeMembers=orderedDailyLogMembers();
  if(!activeMembers.length)return'';
  const WD=['日','一','二','三','四','五','六'];
  return`<div style="border-top:3px solid #1a1a1a;margin-top:0"></div>
  <div class="daily-section" style="margin-top:0;border-top:none;border-radius:0 0 var(--rl2) var(--rl2)">
    <div class="daily-section-hdr">
      <span class="daily-section-title">每日施工日誌</span>
      ${renderDailyAssignBar(days)}
    </div>
    <div class="hscroll-sync hide-hscrollbar" style="overflow-x:auto">
    <table class="daily-log-table" style="width:${200+days.length*180}px">
      <colgroup><col style="width:200px">${days.map(()=>'<col style="width:180px">').join('')}</colgroup>
      <tbody>
      ${activeMembers.map(m=>`<tr>
        <td class="log-name-cell ${currentRole==='manager'?'daily-member-draggable':''}" ${currentRole==='manager'?`draggable="true" ondragstart="dailyMemberDragStart(event,'${m.uid}')" ondragover="dailyMemberDragOver(event)" ondrop="dailyMemberDrop(event,'${m.uid}')"`:''} title="${currentRole==='manager'?'管理員可拖曳調整順序':''}"><div class="daily-member-name"><span>${memberDisplayName(m)}</span></div></td>

// One cell = the owner's own free-text log (only they can edit it), plus
// any number of "assigned" notes from other people — each assigned note
// can only be edited/removed by whoever wrote it, or by the cell's owner.
function renderDailyLogCell(m,d,td){
  const ds=fmtDay(d);
  const isT=isSameDay(d,td);
  const logKey=`${m.uid}_${ds}`;
  const cur=S.dailyLogs[logKey]||{};
  const logVal=cur.text||'';
  const canEditOwn=currentUser&&m.uid===currentUser.uid;
  const assigned=cur.assigned||[];
  let h=`<td style="${isT?'background:#faf9ff':''};vertical-align:top">
    <textarea class="log-textarea${isT?' today':''}"
      ${canEditOwn?`onblur="saveDailyLog('${m.uid}','${ds}',this.value)"
      onkeydown="if(event.key==='Tab'){event.preventDefault();this.blur()}"
      placeholder=""`:' readonly'}
    >${logVal}</textarea>`;
  assigned.forEach(function(e){
    const canManage=currentUser&&(currentUser.uid===e.authorUid||currentUser.uid===m.uid);
    const author=S.members.find(function(x){return x.uid===e.authorUid;});
    const authorName=memberDisplayName(author);
    if(canManage){
      h+=`<div style="margin-top:3px;position:relative">
        <input type="text" id="assign-${m.uid}-${ds}-${e.id}" value="${escAttr(e.text||'')}" title="${authorName} 指派"
          onblur="saveAssignedEntry('${m.uid}','${ds}','${e.id}',this.value)"
          onkeydown="if(event.key==='Enter')this.blur()"
          style="width:100%;box-sizing:border-box;padding:3px 20px 3px 6px;border:1px solid var(--purple);border-radius:4px;font-size:11px;font-family:inherit;background:var(--pl);color:var(--pd)">
        <span onclick="deleteAssignedEntry('${m.uid}','${ds}','${e.id}')" title="刪除" style="position:absolute;top:2px;right:3px;cursor:pointer;color:var(--pd);font-weight:700;font-size:11px">×</span>
      </div>`;
    }else{
      h+=`<div style="margin-top:3px;padding:3px 6px;border-radius:4px;font-size:11px;background:var(--pl);color:var(--pd)">${escAttr(authorName)}：${escAttr(e.text||'')}</div>`;
    }
  });
  h+='</td>';
  return h;
}
window.addAssignedEntry=async function(uid,ds){
  if(!currentUser)return;
  const key=uid+'_'+ds;
  const cur=S.dailyLogs[key]||{};
  const list=(cur.assigned||[]).slice();
  const eid='a'+Date.now();
  list.push({id:eid,text:'',authorUid:currentUser.uid});
  setSyncing();
  await setDoc(doc(db,'dailyLogs',key),Object.assign({},cur,{uid,date:ds,assigned:list}));
  setSynced();
  if(activePanel==='progress')renderProgress();
  setTimeout(function(){
    const el=document.getElementById('assign-'+uid+'-'+ds+'-'+eid);
    if(el)el.focus();
  },50);
}
window.saveAssignedEntry=async function(uid,ds,eid,text){
  if(!currentUser)return;
  const key=uid+'_'+ds;
  const cur=S.dailyLogs[key]||{};
  const list=(cur.assigned||[]).map(function(e){return e.id===eid?Object.assign({},e,{text}):e;});
  setSyncing();
  await setDoc(doc(db,'dailyLogs',key),Object.assign({},cur,{assigned:list}));
  setSynced();
}
window.deleteAssignedEntry=async function(uid,ds,eid){
  if(!currentUser)return;
  const key=uid+'_'+ds;
  const cur=S.dailyLogs[key]||{};
  const list=(cur.assigned||[]).filter(function(e){return e.id!==eid;});
  setSyncing();
  await setDoc(doc(db,'dailyLogs',key),Object.assign({},cur,{assigned:list}));
  setSynced();
}

window.saveDailyLog=async function(uid,ds,text){
  if(!currentUser||currentUser.uid!==uid)return;
  const key=`${uid}_${ds}`;
  const cur=S.dailyLogs[key]||{};
  setSyncing();
  await setDoc(doc(db,'dailyLogs',key),Object.assign({},cur,{uid,date:ds,text,updatedAt:serverTimestamp()}));
  setSynced();
}



// ── Fixed meeting rows (客戶會議/丈量・廠商會議・丈量・其他) under the site
// table — same chip interaction as 工地記事 (select/edit/color/drag), plus a
// background-color option, plus @member mention that auto-copies the entry
// into that member's daily log for the same day ──
window.mSelect=function(rowId,ds,idx){
  meetingSelGen++;
  meetingSelected={};
  meetingSelected[rowId+'|'+ds]=idx;
  const key=rowId+'_'+ds;
  const items=(S.meetingLogs[key]&&S.meetingLogs[key].items)||[];
  const linked=normalizeLinkedItem(items[idx]||{});
  updateFormulaBar('meeting',ds,idx,linked.text,rowId,linked.link);
  if(activePanel==='progress')renderProgress();
}
window.mAdd=async function(rowId,ds){
  if(!currentUser)return;
  const key=rowId+'_'+ds;
  const items=(S.meetingLogs[key]&&S.meetingLogs[key].items)?[...S.meetingLogs[key].items]:[];
  if(items.length>=1)return; // one entry per cell
  items.push({text:'',color:'',bg:'',mentions:[]});
  setSyncing();
  await setDoc(doc(db,'meetingLogs',key),{rowId,date:ds,items,updatedAt:serverTimestamp()});
  setSynced();
  meetingSelGen++;
  meetingSelected={};
  meetingSelected[rowId+'|'+ds]=0;
  if(activePanel==='progress')renderProgress();
  setTimeout(function(){
    const inp=document.getElementById('meetbox-'+rowId+'-'+ds+'-0');
    if(inp)inp.focus();
  },50);
}
window.mSetColor=async function(rowId,ds,idx,kind,val){
  if(!currentUser)return;
  const key=rowId+'_'+ds;
  const items=(S.meetingLogs[key]&&S.meetingLogs[key].items)?[...S.meetingLogs[key].items]:[];
  if(idx<0||idx>=items.length)return;
  items[idx]=Object.assign({},items[idx],kind==='text'?{color:val}:{bg:val});
  setSyncing();
  await setDoc(doc(db,'meetingLogs',key),{rowId,date:ds,items,updatedAt:serverTimestamp()});
  setSynced();
}
window.mDelete=async function(rowId,ds,idx){
  if(!currentUser)return;
  const key=rowId+'_'+ds;
  const items=(S.meetingLogs[key]&&S.meetingLogs[key].items)?[...S.meetingLogs[key].items]:[];
  const removed=items[idx];
  items.splice(idx,1);
  meetingSelected={};
  setSyncing();
  await setDoc(doc(db,'meetingLogs',key),{rowId,date:ds,items,updatedAt:serverTimestamp()});
  if(removed&&removed.mentions&&removed.mentions.length){
    for(const uid of removed.mentions){
      await mRemoveFromDailyLog(rowId,ds,idx,uid);
    }
  }
  setSynced();
}
window.mDragStart=function(e,rowId,ds,idx){
  meetingDragSrc={rowId,ds,idx};
  e.dataTransfer.effectAllowed='copyMove';
  e.dataTransfer.setData('text/plain','meet|'+rowId+'|'+ds+'|'+idx);
}
window.mDrop=async function(e,toRowId,toDs){
  e.preventDefault();e.stopPropagation();
  const raw=e.dataTransfer.getData('text/plain');
  let from=null;
  if(raw){const p=raw.split('|');if(p.length===4&&p[0]==='meet')from={rowId:p[1],ds:p[2],idx:parseInt(p[3])};}
  if(!from)from=meetingDragSrc;
  if(!from||!currentUser)return;
  if(from.rowId===toRowId&&from.ds===toDs){meetingDragSrc=null;return;}
  const toKey=toRowId+'_'+toDs;
  const toItems=(S.meetingLogs[toKey]&&S.meetingLogs[toKey].items)?[...S.meetingLogs[toKey].items]:[];
  if(toItems.length>=1){meetingDragSrc=null;return;} // target cell already has an entry
  const fromKey=from.rowId+'_'+from.ds;
  const fromItems=(S.meetingLogs[fromKey]&&S.meetingLogs[fromKey].items)?[...S.meetingLogs[fromKey].items]:[];
  const item=fromItems[from.idx];
  if(!item){meetingDragSrc=null;return;}
  toItems.push(Object.assign({},item));
  setSyncing();
  await setDoc(doc(db,'meetingLogs',toKey),{rowId:toRowId,date:toDs,items:toItems,updatedAt:serverTimestamp()});
  if(!e.ctrlKey){
    fromItems.splice(from.idx,1);
    await setDoc(doc(db,'meetingLogs',fromKey),{rowId:from.rowId,date:from.ds,items:fromItems,updatedAt:serverTimestamp()});
  }
  meetingDragSrc=null;
  setSynced();
}

window.mOpenMentionPicker=function(e,rowId,ds,idx){
  clearTimeout(mCloseTimer);
  const menuEl=document.getElementById('meet-mention-'+rowId+'-'+ds);

window.mToggleMention=async function(rowId,ds,idx,uid){
  if(!currentUser)return;
  if(!markableMembersList().some(m=>m.uid===uid))return;
  const key=rowId+'_'+ds;
  const items=(S.meetingLogs[key]&&S.meetingLogs[key].items)?[...S.meetingLogs[key].items]:[];
  if(idx<0||idx>=items.length)return;
  const mentions=(items[idx].mentions||[]).slice();
  const pos=mentions.indexOf(uid);
  const adding=pos<0;
  if(adding)mentions.push(uid);else mentions.splice(pos,1);
  items[idx]=Object.assign({},items[idx],{mentions});
  S.meetingLogs=Object.assign({},S.meetingLogs);
  S.meetingLogs[key]=Object.assign({},S.meetingLogs[key],{items});

    setSynced();

    if(menuEl&&menuEl.style.display==='block')menuEl.innerHTML=mMentionMenuHTML(rowId,ds,idx);
    return;
  }
  setSyncing();
  await setDoc(doc(db,'meetingLogs',key),{rowId,date:ds,items,updatedAt:serverTimestamp()});
  setSynced();
  if(adding)await mSyncDailyLog(rowId,ds,idx,uid,items[idx].text||'');
  else await mRemoveFromDailyLog(rowId,ds,idx,uid);
  // Refresh just the checklist (keep it open) instead of a full re-render,
  // so tagging several people doesn't require re-hovering each time.
  const menuEl=document.getElementById('meet-mention-'+rowId+'-'+ds);

// Upsert this meeting entry's own text as one line in the member's daily
// log, remembering exactly which line came from this entry (so editing the
// text later replaces the same line, and untagging removes the same line).
async function mSyncDailyLog(rowId,ds,idx,uid,newText){
  const m=S.members.find(x=>x.uid===uid);
  if(!m)return;
  const logKey=`${m.uid}_${ds}`;
  const cur=S.dailyLogs[logKey]||{};
  const autoLines=Object.assign({},cur.autoLines||{});
  const trackKey=rowId+'_'+idx;
  const oldLine=autoLines[trackKey];
  let lines=(cur.text||'').split('\n').filter(l=>l!=='');
  if(oldLine!=null){
    const pos=lines.indexOf(oldLine);
    if(pos>=0)lines[pos]=newText;else lines.push(newText);
  }else{
    lines.push(newText);
  }
  autoLines[trackKey]=newText;
  try{
    await setDoc(doc(db,'dailyLogs',logKey),Object.assign({},cur,{uid:m.uid,date:ds,text:lines.join('\n'),autoLines,updatedAt:serverTimestamp()}));
  }catch(err){
    console.error('無法自動寫入 '+memberDisplayName(m)+' 的每日日誌（可能需要調整 Firebase 權限規則）',err);
  }
}
async function mRemoveFromDailyLog(rowId,ds,idx,uid){
  const m=S.members.find(x=>x.uid===uid);
  if(!m)return;
  const logKey=`${m.uid}_${ds}`;
  const cur=S.dailyLogs[logKey]||{};
  const autoLines=Object.assign({},cur.autoLines||{});
  const trackKey=rowId+'_'+idx;
  const oldLine=autoLines[trackKey];
  if(oldLine==null)return;
  let lines=(cur.text||'').split('\n').filter(l=>l!=='');
  const pos=lines.indexOf(oldLine);
  if(pos>=0)lines.splice(pos,1);
  delete autoLines[trackKey];
  try{
    await setDoc(doc(db,'dailyLogs',logKey),Object.assign({},cur,{uid:m.uid,date:ds,text:lines.join('\n'),autoLines,updatedAt:serverTimestamp()}));
  }catch(err){
    console.error('無法自動移除 '+memberDisplayName(m)+' 的每日日誌（可能需要調整 Firebase 權限規則）',err);
  }
}

function getNoteTodosForProject(projName){
  const pn=S.privateNotes||{work:{},personal:{}};
  const out=[];
  ['work','personal'].forEach(function(type){
    const byDate=pn[type]||{};
    Object.keys(byDate).forEach(function(ds){
      (byDate[ds]||[]).forEach(function(item,idx){
        const m=(item.text||'').match(/\[proj:([^\]]+)\]/);
        if(m&&m[1]===projName){
          out.push({source:'note',type:type,ds:ds,idx:idx,text:(item.text||'').replace(/\[proj:[^\]]+\]/g,'').trim(),completed:!!item.completed});
        }
      });
    });
  });
  return out;
}

let recurringSyncRunning=false;
function recurringSchedules(){return Array.isArray(S.privateNotes?.recurringSchedules)?S.privateNotes.recurringSchedules:[];}
function recurringMatches(rule,ds){
  const d=new Date(ds+'T00:00:00'),start=new Date(rule.startDate+'T00:00:00');
  if(ds<rule.startDate||rule.endDate&&ds>rule.endDate)return false;
  if(rule.frequency==='daily')return true;
  if(rule.frequency==='weekly')return d.getDay()===Number(rule.weekday);
  if(rule.frequency==='monthly')return d.getDate()===Number(rule.monthDay);
  if(rule.frequency==='yearly')return d.getMonth()+1===Number(rule.yearMonth||start.getMonth()+1)&&d.getDate()===Number(rule.yearDay||start.getDate());
  if(rule.frequency==='custom')return Math.floor((d-start)/86400000)%Math.max(1,Number(rule.intervalDays)||1)===0;
  return false;
}
async function syncRecurringRule(rule,removeOnly){
  if(!currentUser)return;
  const td=today(),todayDs=fmtDay(td),pn=S.privateNotes||{work:{},personal:{}};
  const next=Object.assign({},pn,{work:Object.assign({},pn.work||{}),personal:Object.assign({},pn.personal||{})});
  let changed=false;
  ['work','personal'].forEach(type=>{
    Object.keys(next[type]).forEach(ds=>{
      const old=next[type][ds]||[];
      const kept=old.filter(item=>!(item.recurringId===rule.id&&ds>=todayDs&&!item.completed));
      if(kept.length!==old.length){next[type][ds]=kept;changed=true;}
    });
  });
  if(!removeOnly&&rule.enabled){
    const startFloor=[todayDs,rule.startDate,rule.enabledFrom||rule.startDate].sort().pop();
    const start=new Date(startFloor+'T00:00:00'),end=new Date(start);end.setDate(end.getDate()+120);
    if(rule.endDate&&new Date(rule.endDate+'T00:00:00')<end)end.setTime(new Date(rule.endDate+'T00:00:00').getTime());
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const ds=fmtDay(d);if(!recurringMatches(rule,ds))continue;
      const type=rule.target==='personal'?'personal':'work';
      const arr=(next[type][ds]||[]).slice();
      const existsAnywhere=['work','personal'].some(t=>(next[t][ds]||[]).some(item=>item.recurringId===rule.id&&item.recurringDate===ds));
      if(existsAnywhere)continue;
      arr.push({text:rule.name,note:rule.note||'',color:'',completed:false,recurringId:rule.id,recurringDate:ds,autoGenerated:true});
      next[type][ds]=arr;changed=true;
    }
  }
  if(changed){S.privateNotes=next;await setDoc(doc(db,'privateNotes',currentUser.uid),next);}
}
async function syncAllRecurringSchedules(){
  if(recurringSyncRunning||!currentUser)return;recurringSyncRunning=true;
  try{for(const rule of recurringSchedules())await syncRecurringRule(rule,!rule.enabled);}finally{recurringSyncRunning=false;}
}
function recurringFreqLabel(r){
  if(r.frequency==='daily')return'每天';
  if(r.frequency==='weekly')return`每週${['日','一','二','三','四','五','六'][Number(r.weekday)||0]}`;
  if(r.frequency==='monthly')return`每月 ${r.monthDay} 日`;
  if(r.frequency==='yearly'){const p=(r.startDate||'').split('-');return`每年 ${Number(r.yearMonth||p[1])}/${Number(r.yearDay||p[2])}`;}
  return`每 ${r.intervalDays||1} 天`;
}

function renderPrivateTodoSection(){
  if(calMode!=='week'&&calMode!=='month')return'';
  var days=getWeekDates();
  var td=today();
  var pn=S.privateNotes||{work:{},personal:{}};
  var COLS=[
    {c:'',bg:'#e8e5e0',l:'無'},
    {c:'#E24B4A',bg:'#E24B4A',l:'紅'},
    {c:'#EF9F27',bg:'#EF9F27',l:'橘'},
    {c:'#1D9E75',bg:'#1D9E75',l:'綠'},

    {c:'#9c9690',bg:'#9c9690',l:'灰'}

  var sel=S.privateSelected||{};
  var editing=S.privateEditing||null;

  function itemControls(){
    var found=null;
    Object.keys(sel).forEach(function(k){
      if(sel[k]>=0){
        var parts=k.split('|');

        if(items[sel[k]])found={type:parts[0],ds:parts[1],idx:sel[k],item:items[sel[k]]};
      }
    });

    var item=active?found.item:null;
    var completeOnclick=active?(' onclick="pnToggleComplete(\''+found.type+'\',\''+found.ds+'\','+found.idx+')"'):'';
    var strikeOnclick=active?(' onclick="pnToggleStrike(\''+found.type+'\',\''+found.ds+'\','+found.idx+')"'):'';

      .split(/(\[proj:[^\]]+\])/g).map(function(part){

      var border=isSel?'2px solid var(--purple)':'1.5px solid var(--border)';
      var textStyle=(color?'color:'+color+';font-weight:500':'color:var(--text)')+(item.strike?';text-decoration:line-through':'');

          +' style="flex:1;min-width:0;box-sizing:border-box;background:transparent;border:none;padding:0;font-size:12px;line-height:1.4;font-family:inherit;'+textStyle+'"'
          +' oninput="pnSyncFormulaText(this.value);pnInput(event,\''+type+'\',\''+ds+'\','+i+')"'
          +' onblur="pnBoxBlur(this,\''+type+'\',\''+ds+'\','+i+')"'
          +' onkeydown="pnKeyDown(event,\''+type+'\',\''+ds+'\','+i+')"'
          +' oncontextmenu="return insertUrlForSelection(event,this)"'
          +' onclick="event.stopPropagation()"'
          +'>'
          +'</div>';
      }else{
        h+='<div class="pn-chip" style="background:var(--surface);border:'+border+';padding:6px 8px;border-radius:5px;font-size:12px;margin-bottom:4px;cursor:pointer;user-select:none;min-height:30px;line-height:1.4;position:relative;'+textStyle+'"'
          +' onclick="pnSelect(\''+type+'\',\''+ds+'\','+i+')"'

        h+=renderItemText(item);

        h+='</div>';
      }
    });
    h+='<button style="font-size:12px;padding:6px 8px;border:1px dashed var(--border);background:none;cursor:pointer;color:var(--text3);width:100%;text-align:left;margin-top:2px;border-radius:5px;font-family:inherit;min-height:30px" onclick="pnAdd(\''+type+'\',\''+ds+'\')">＋ 新增</button>';
    h+='</td>';
    return h;
  }

  function makeRow(type,label){
    var h='<tr><td class="log-name-cell" style="font-size:11px;color:var(--text2);position:sticky;left:0;z-index:5;background:var(--bg);border-right:2px solid var(--border);width:200px">'+label+'</td>';
    days.forEach(function(d){h+=makeCell(type,fmtDay(d));});
    h+='</tr>';
    return h;
  }

  var hiddenHeader='<tr style="height:0;visibility:hidden"><th style="padding:0;width:200px"></th>'+days.map(function(){return'<th style="padding:0"></th>';}).join('')+'</tr>';
  var divider='<tr><td colspan="'+(days.length+1)+'" style="padding:0"><div style="border-top:2px solid #1a1a1a"></div></td></tr>';
  var tblStyle='border-collapse:collapse;table-layout:fixed';
  var colgroup='<colgroup><col style="width:200px">'+days.map(function(){return'<col style="width:180px">';}).join('')+'</colgroup>';

  return '<div style="border-top:3px solid #1a1a1a"></div>'
    +'<div class="private-section" style="border-top:none;border-radius:0 0 var(--rl2) var(--rl2)">'
    +'<div class="private-section-hdr" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">'
    +'<span style="width:180px;display:inline-flex;align-items:center;gap:6px;flex:none">🔒 個人專區'

    +'<span style="display:inline-flex;align-items:center;gap:4px"><button class="btn btn-sm" onclick="openRecurringManager(true)">＋ 新增自動排程</button>'

    +'<div class="hscroll-sync hide-hscrollbar" style="overflow-x:auto"><table style="'+tblStyle+';width:'+(200+days.length*180)+'px">'+colgroup+'<thead>'+hiddenHeader+'</thead><tbody>'
    +makeRow('work','工地記事')

window.pnInput=function(e,type,ds,idx){
  var inp=e.target;
  var val=inp.value||'';
  var pos=inp.selectionStart||0;
  var textBefore=val.substring(0,pos);
  var atIdx=textBefore.lastIndexOf('@');
  var menuEl=document.getElementById('pn-global-mention');
  if(atIdx>=0&&textBefore.indexOf(' ',atIdx)<0){
    var q=textBefore.substring(atIdx+1).toLowerCase();
    var projs=S.projects.filter(function(p){return p.status!=='done'&&p.name.toLowerCase().includes(q);});
    if(projs.length){
      pnMentionActive={type:type,ds:ds,idx:idx,atIdx:atIdx};
      var rect=inp.getBoundingClientRect();
      menuEl.style.cssText='display:block;position:fixed;top:'+(rect.bottom+4)+'px;left:'+rect.left+'px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:9999;min-width:150px;max-height:180px;overflow-y:auto';
      menuEl.innerHTML=projs.map(function(p){
        return'<div style="padding:7px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border)" '
          +'onmousedown="pnInsertMention(event,\''+type+'\',\''+ds+'\','+idx+',\''+p.name+'\')">'
          +p.name+'</div>';
      }).join('');
      return;
    }
  }
  if(menuEl){menuEl.style.display='none';}
  pnMentionActive=null;
}

window.pnInsertMention=function(e,type,ds,idx,projName){
  e.preventDefault();
  var inp=document.getElementById('pnbox-'+type+'-'+ds+'-'+idx);
  if(!inp)return;
  var menuEl=document.getElementById('pn-global-mention');
  if(menuEl)menuEl.style.display='none';
  pnMentionActive=null;
  // Replace @query with [proj:name] in input value
  var val=inp.value;
  var pos=inp.selectionStart||val.length;
  var textBefore=val.substring(0,pos);
  var atIdx=textBefore.lastIndexOf('@');
  if(atIdx>=0){
    var tag='[proj:'+projName+']';
    var newVal=val.substring(0,atIdx)+tag+val.substring(pos);
    inp.value=newVal;
    if(formulaBarState)formulaBarState.text=newVal;
    var newPos=atIdx+tag.length;
    inp.setSelectionRange(newPos,newPos);
  }
  // Stay in edit mode — the person may want to keep typing right after
  // the inserted tag, rather than the field immediately closing.
  inp.focus();
}
